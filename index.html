<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LifeStealMC Network</title>

    <!-- Google AdSense Script (Vérification & Monétisation) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6241793082650017"
         crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181f;
            --card-hover: #1f222c;
            --accent: #e63946;
            --accent-glow: rgba(230, 57, 70, 0.4);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #262933;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem calc(2rem + env(safe-area-inset-bottom));
        }

        .container {
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.3rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.4rem;
        }

        h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: clamp(0.85rem, 3vw, 0.95rem);
            line-height: 1.4;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.3rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 60px;
        }

        .link-card:hover, .link-card:active {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0; /* évite le débordement de texte sur mobile */
        }

        .card-title {
            font-weight: 600;
            font-size: 1.02rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.82rem;
            line-height: 1.3;
        }

        .card-badge {
            font-size: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #20242e;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            color: #cbd5e1;
            border: 1px solid #2e3442;
            flex-shrink: 0;
            margin-left: 0.75rem;
        }

        .state-msg {
            text-align: center;
            color: var(--text-sub);
            padding: 2.5rem 0;
            font-size: 0.9rem;
        }

        /* Encart Publicitaire Sombre & Adapté */
        .ad-container {
            margin-top: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
        }

        .ad-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }

        .ad-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .ad-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .ad-slot-wrapper {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.78rem;
            color: #475569;
        }

        @media (max-width: 480px) {
            .link-card {
                padding: 1rem;
            }
            .card-badge {
                font-size: 0.7rem;
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LifeSteal<span>MC</span></h1>
            <p class="subtitle">Portail &amp; services du réseau lifestealmc.fr</p>
        </header>

        <main id="links-container" class="links-grid">
            <div class="state-msg">Chargement des sous-domaines...</div>
        </main>

        <!-- Bloc Publicitaire LifeSteal Index -->
        <aside class="ad-container" aria-label="Annonce sponsorisée">
            <div class="ad-header">
                <span class="ad-badge">
                    <span class="ad-dot"></span>
                    Sponsorisé
                </span>
                <span>Google AdSense</span>
            </div>
            <div class="ad-slot-wrapper">
                <ins class="adsbygoogle"
                     style="display:block; width:100%; min-height:90px; background-color:transparent; color-scheme:dark;"
                     data-ad-client="ca-pub-6241793082650017"
                     data-ad-slot="1654913277"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </aside>

        <footer>
            &copy; lifestealmc.fr — Tous droits réservés.
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('links-container');

            fetch('./subdomains.json')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    container.innerHTML = '';

                    if (!Array.isArray(data) || data.length === 0) {
                        container.innerHTML = '<div class="state-msg">Aucun sous-domaine configuré.</div>';
                        return;
                    }

                    data.forEach(item => {
                        const a = document.createElement('a');
                        a.className = 'link-card';
                        a.href = item.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';

                        const info = document.createElement('div');
                        info.className = 'card-info';

                        const title = document.createElement('span');
                        title.className = 'card-title';
                        title.textContent = item.title;

                        const desc = document.createElement('span');
                        desc.className = 'card-desc';
                        desc.textContent = item.description || '';

                        info.appendChild(title);
                        if (item.description) info.appendChild(desc);

                        a.appendChild(info);

                        if (item.badge) {
                            const badge = document.createElement('span');
                            badge.className = 'card-badge';
                            badge.textContent = item.badge;
                            a.appendChild(badge);
                        }

                        container.appendChild(a);
                    });
                })
                .catch(err => {
                    console.error('Erreur chargement JSON :', err);
                    container.innerHTML = '<div class="state-msg" style="color: #ef4444;">Impossible de charger les sous-domaines.</div>';
                });
        });
    </script>
</body>
</html>

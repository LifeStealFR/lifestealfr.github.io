<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStealMC Network</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181f;
            --card-hover: #1f222c;
            --accent: #e63946;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #262933;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.4rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .card-badge {
            font-size: 0.75rem;
            font-family: monospace;
            background: #222632;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            color: var(--text-sub);
        }

        .state-msg {
            text-align: center;
            color: var(--text-sub);
            padding: 2rem 0;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: #555e6d;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LifeSteal<span>MC</span></h1>
            <p class="subtitle">Portail & services du réseau lifestealmc.fr</p>
        </header>

        <main id="links-container" class="links-grid">
            <div class="state-msg">Chargement des sous-domaines...</div>
        </main>

        <footer>
            &copy; lifestealmc.fr — Tous droits réservés.
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('links-container');

            fetch('./subdomains.json')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    container.innerHTML = '';

                    if (!Array.isArray(data) || data.length === 0) {
                        container.innerHTML = '<div class="state-msg">Aucun sous-domaine configuré.</div>';
                        return;
                    }

                    data.forEach(item => {
                        const a = document.createElement('a');
                        a.className = 'link-card';
                        a.href = item.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';

                        const info = document.createElement('div');
                        info.className = 'card-info';

                        const title = document.createElement('span');
                        title.className = 'card-title';
                        title.textContent = item.title;

                        const desc = document.createElement('span');
                        desc.className = 'card-desc';
                        desc.textContent = item.description || '';

                        info.appendChild(title);
                        if (item.description) info.appendChild(desc);

                        a.appendChild(info);

                        if (item.badge) {
                            const badge = document.createElement('span');
                            badge.className = 'card-badge';
                            badge.textContent = item.badge;
                            a.appendChild(badge);
                        }

                        container.appendChild(a);
                    });
                })
                .catch(err => {
                    console.error('Erreur chargement JSON :', err);
                    container.innerHTML = '<div class="state-msg" style="color: #ef4444;">Impossible de charger les sous-domaines.</div>';
                });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cardinal System // CONSOLE</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 1. RESSOURCES EXTERNES (Polices & Icones) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 2. STYLES DOCSIFY DE BASE -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <!-- 3. CSS "PIXEL PERFECT" CARDINAL SYSTEM -->
  <style>
    :root {
      --sao-orange: #ffaa00;
      --sao-orange-dim: rgba(255, 170, 0, 0.15);
      --sao-text: #eee;
      --sao-bg: rgba(20, 20, 25, 0.92);
      --font-ui: 'Orbitron', sans-serif;
      --font-code: 'Share Tech Mono', monospace;
    }

    /* --- GLOBAL --- */
    * { box-sizing: border-box; cursor: default; user-select: none; }
    body {
      background-color: #000;
      font-family: var(--font-ui);
      color: var(--sao-text);
      overflow: hidden; /* Empêche le scroll global */
      margin: 0;
    }
    
    /* Cache le bouton mobile moche */
    .sidebar-toggle { display: none !important; }

    /* --- FOND 3D --- */
    #world-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #000 100%);
      perspective: 1000px;
      z-index: -10;
    }
    .grid-floor {
      position: absolute; bottom: -50%; left: -50%; width: 200%; height: 200%;
      background-image: 
        linear-gradient(rgba(255, 170, 0, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 170, 0, 0.1) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: rotateX(70deg);
      animation: floorMove 10s linear infinite;
    }
    @keyframes floorMove { from { transform: rotateX(70deg) translateY(0); } to { transform: rotateX(70deg) translateY(60px); } }

    /* --- ECRAN DE LOGIN (LINK START) --- */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s;
    }
    .start-btn {
      border: 2px solid var(--sao-orange);
      color: var(--sao-orange);
      padding: 20px 60px;
      font-size: 24px;
      font-family: var(--font-ui);
      letter-spacing: 5px;
      background: transparent;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px var(--sao-orange);
      transition: all 0.3s;
    }
    .start-btn:hover { background: var(--sao-orange); color: #000; }
    
    .tunnel-fx {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: conic-gradient(from 0deg, transparent, var(--sao-orange), transparent);
      opacity: 0; pointer-events: none;
    }
    .link-start-active .tunnel-fx { animation: tunnelZoom 2s forwards; opacity: 1; }
    .link-start-active .start-btn { display: none; }
    
    @keyframes tunnelZoom { 
      0% { transform: scale(1) rotate(0deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(20) rotate(180deg); opacity: 0; }
    }

    /* --- HUD : HP BAR --- */
    #hud-hp {
      position: fixed; top: 20px; left: 20px;
      min-width: 350px; height: 80px;
      z-index: 500;
      display: flex; align-items: flex-start;
      opacity: 0; transform: translateX(-100px);
      transition: all 1s ease 2.5s;
    }
    .avatar-frame {
      flex-shrink: 0;
      width: 50px; height: 50px; border-radius: 50%;
      border: 2px solid var(--sao-orange);
      background: #333; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px var(--sao-orange);
      margin-right: 15px; margin-top: 5px;
    }
    .stats-container { flex: 1; display: flex; flex-direction: column; }
    .player-name { 
      font-size: 16px; color: #fff; letter-spacing: 1px; 
      text-shadow: 0 0 5px var(--sao-orange); margin-bottom: 2px;
    }
    .hp-bar-bg { 
      width: 100%; max-width: 250px; height: 12px; 
      background: rgba(0,0,0,0.6); border: 1px solid #555; 
      position:relative; transform: skewX(-20deg); 
    }
    .hp-bar-fill { 
      width: 85%; height: 100%; 
      background: linear-gradient(90deg, #ffcc00, #ff0000); 
      box-shadow: 0 0 10px #ff0000;
      animation: hpPulse 3s infinite;
    }
    .lvl-badge { 
      position: absolute; right: -25px; top: -3px; 
      color: var(--sao-orange); font-size: 10px; transform: skewX(20deg); 
    }

    /* --- HUD : CONSOLE --- */
    #hud-console {
      position: fixed; bottom: 20px; right: 20px;
      width: 300px; height: 150px;
      background: rgba(0,0,0,0.8);
      border-top: 2px solid var(--sao-orange);
      padding: 10px;
      font-family: var(--font-code);
      font-size: 10px; color: #0f0; overflow: hidden;
      z-index: 500; opacity: 0; transition: opacity 1s ease 3s;
    }
    .log-line { margin-bottom: 2px; border-bottom: 1px solid rgba(0,255,0,0.1); }

    /* --- SIDEBAR (MENU) --- */
    .sidebar {
      background: transparent !important;
      border: none !important;
      width: 300px;
      padding-top: 100px; padding-left: 20px;
      opacity: 0; transition: opacity 1s ease 3s;
      overflow: visible;
    }
    .app-name { display: none; }
    
    .sidebar-nav ul { padding: 0; margin: 0; }
    .sidebar-nav li { list-style: none; margin: 5px 0; }

    /* Titres de dossiers */
    .sidebar-nav > ul > li > strong,
    .sidebar-nav > ul > li > span,
    .sidebar-nav > ul > li > p {
      color: var(--sao-orange); font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; font-weight: 800;
      border-bottom: 1px solid rgba(255, 170, 0, 0.3);
      display: block; margin-top: 25px; margin-bottom: 10px;
      padding-bottom: 2px; width: 80%;
    }
    
    /* Boutons de liens */
    .sidebar-nav ul ul { padding-left: 10px; }
    .sidebar-nav a {
      display: flex; align-items: center;
      width: 90%; height: 40px;
      background: rgba(30, 30, 35, 0.9);
      border: 1px solid #555; border-radius: 20px;
      padding-left: 15px;
      color: #bbb !important; text-decoration: none !important;
      font-size: 13px; transition: all 0.2s ease;
    }
    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      background: linear-gradient(90deg, rgba(255, 170, 0, 0.8), rgba(255, 100, 0, 0.6));
      color: #000 !important; font-weight: bold; border-color: #fff;
      box-shadow: 0 0 15px var(--sao-orange);
      padding-left: 25px; width: 95%;
    }
    .folder-icon { display: none; }

    /* --- FENÊTRE DE CONTENU --- */
    .content {
      padding-top: 0; padding-left: 320px; padding-right: 20px;
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .markdown-section {
      background: var(--sao-bg);
      width: 100%; max-width: 1100px; height: 85vh;
      border: 1px solid rgba(150,150,150,0.3); border-radius: 6px;
      position: relative; padding: 50px 40px;
      overflow-y: auto;
      box-shadow: 0 10px 60px rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      opacity: 0; transform: scale(0.9); transition: all 0.4s ease;
    }
    .system-ready .markdown-section { opacity: 1; transform: scale(1); }
    .system-ready .sidebar, .system-ready #hud-hp, .system-ready #hud-console { opacity: 1; transform: translateX(0); }

    .markdown-section::before {
      content: "MESSAGE WINDOW // MAIN VISUALIZER";
      position: absolute; top: 0; left: 0; width: 100%; height: 30px;
      background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
      color: var(--sao-orange); font-size: 11px; line-height: 30px;
      padding-left: 15px; font-family: var(--font-code);
    }
    .markdown-section::after {
      content: "\f00d  \f111"; font-family: "Font Awesome 6 Free"; font-weight: 900;
      position: absolute; top: 8px; right: 15px; color: #888; font-size: 12px; letter-spacing: 8px;
    }

    h1 { color: #fff; font-size: 2em; border-bottom: 2px solid var(--sao-orange); padding-bottom: 10px; }
    h2 { color: var(--sao-orange); margin-top: 30px; border-left: 4px solid var(--sao-orange); padding-left: 10px; }
    a { color: var(--sao-orange); text-decoration: none; font-weight: bold; }
    code { color: var(--sao-orange) !important; background: rgba(0,0,0,0.6) !important; }
    .search input { background: rgba(0,0,0,0.5) !important; border-radius: 20px; color: #fff !important; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #555; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sao-orange); }
  </style>
</head>
<body>

  <!-- ECRAN DE DÉMARRAGE -->
  <div id="login-screen">
    <div class="tunnel-fx"></div>
    <button class="start-btn" onclick="systemStart()">LINK START</button>
  </div>

  <!-- FOND -->
  <div id="world-bg">
    <div class="grid-floor"></div>
  </div>

  <!-- INTERFACE (HUD) -->
  <div id="hud-hp">
    <div class="avatar-frame"><i class="fa-solid fa-user" style="color:#ccc; font-size:24px;"></i></div>
    <div class="stats-container">
      <div class="player-name">VISITOR <span style="font-size:12px; color:#aaa;">LV. 1</span></div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill"></div>
        <div class="lvl-badge">SAFE</div>
      </div>
    </div>
  </div>

  <div id="hud-console"></div>

  <!-- DOCSIFY APP -->
  <div id="app">Initialisation...</div>

  <!-- CONFIGURATION ET SCRIPTS -->
  <script>
    // 1. Démarrage Système (Animation)
    function systemStart() {
      // Animation visuelle
      const screen = document.getElementById('login-screen');
      screen.classList.add('link-start-active');
      
      // Logs Console Fakes
      addLog("[SYS] INITIALIZING NERVEGEAR...");
      setTimeout(() => addLog("[NET] CONNECTING TO SERVER..."), 500);
      setTimeout(() => addLog("[AUTH] ACCESS GRANTED."), 1000);
      setTimeout(() => addLog("[SYS] LOADING CARDINAL UI..."), 1500);

      // Transition
      setTimeout(() => {
        screen.style.opacity = '0';
        setTimeout(() => { screen.style.display = 'none'; }, 1000);
        document.body.classList.add('system-ready'); // Déclenche l'apparition du reste
        startConsoleLoop();
      }, 2500);
    }

    // 2. Gestion Console
    function addLog(text) {
      const consoleDiv = document.getElementById('hud-console');
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span style="opacity:0.6">${new Date().toLocaleTimeString()}</span> > ${text}`;
      consoleDiv.appendChild(line);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function startConsoleLoop() {
      const messages = ["Ping: 24ms", "Updating chunks...", "LifeSteal Protocol Active", "Syncing data..."];
      setInterval(() => {
        if(Math.random() > 0.8) {
          addLog(messages[Math.floor(Math.random() * messages.length)]);
        }
      }, 3000);
    }

    // 3. Configuration Docsify
    window.$docsify = {
      name: 'LifeSteal FR',
      repo: '',
      homepage: 'README.md',
      loadSidebar: true, // IMPORTANT : Nécessite _sidebar.md
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'SEARCH DATABASE...',
        noData: 'NO DATA FOUND',
      },
      sidebarDisplayLevel: 1 // Dossiers fermés par défaut
    }
  </script>

  <!-- CHARGEMENT DES LIBS DOCSIFY (Dans le bon ordre) -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

</body>
</html>

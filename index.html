<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LifeSteal FR // SYSTEM</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Police SAO Style (Exo 2 est très proche de la police officielle) -->
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Thème de base (Dark) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    :root {
      /* Palette Aincrad */
      --sao-orange: #ffaa00;
      --sao-orange-glow: rgba(255, 170, 0, 0.6);
      --sao-dark: #1a1a1a;
      --sao-panel-bg: rgba(30, 30, 30, 0.85);
      --sao-panel-border: rgba(200, 200, 200, 0.3);
      --sao-text: #eee;
      --sao-font: 'Exo 2', sans-serif;
    }

    /* --- 1. BACKGROUND "LINK START" --- */
    body {
      background: radial-gradient(circle at center, #2b2b35 0%, #050505 100%);
      font-family: var(--sao-font);
      color: var(--sao-text);
      overflow-x: hidden;
    }

    /* Animation de particules en arrière-plan */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100px 100px;
      z-index: -1;
      animation: gridFloat 60s linear infinite;
    }

    @keyframes gridFloat {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* --- 2. BARRE LATÉRALE (Le Menu Principal) --- */
    .sidebar {
      background: linear-gradient(180deg, rgba(40,40,40,0.95) 0%, rgba(20,20,20,0.95) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      width: 300px;
      padding-top: 20px;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      /* Forme biseautée typique des menus SAO (illusion via clip-path) */
    }

    /* Le Titre (Nom du Serveur) */
    .app-name-link {
      font-weight: 700;
      font-size: 1.6em;
      color: #fff !important;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      border-bottom: 2px solid var(--sao-orange);
      padding-bottom: 10px;
      display: inline-block;
      width: 90%;
      text-align: center;
    }

    /* Les liens du menu */
    .sidebar-nav ul { padding-left: 0; }
    
    .sidebar-nav li {
      margin: 5px 10px;
      list-style: none;
    }

    .sidebar-nav a {
      display: block;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 4px; /* Un peu arrondi */
      color: #bbb !important;
      text-decoration: none !important;
      transition: all 0.2s;
      font-size: 0.95rem;
      position: relative;
      background: rgba(0,0,0,0.2);
    }

    /* EFFET HOVER SAO : Barre Orange qui apparaît */
    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      background: linear-gradient(90deg, rgba(255, 170, 0, 0.2) 0%, transparent 100%);
      border-left: 4px solid var(--sao-orange);
      color: #fff !important;
      padding-left: 25px;
      box-shadow: 0 0 15px var(--sao-orange-glow);
    }

    /* Icone de dossier */
    .sidebar-nav > ul > li > strong {
      color: var(--sao-orange);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 25px;
      margin-left: 10px;
      border-bottom: 1px solid rgba(255, 170, 0, 0.3);
      display: block;
      width: fit-content;
    }

    /* --- 3. CONTENU (La Fenêtre Flottante) --- */
    .content {
      padding-top: 40px;
    }

    .markdown-section {
      background: var(--sao-panel-bg);
      border: 1px solid var(--sao-panel-border);
      border-radius: 8px;
      padding: 50px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.8);
      position: relative;
      max-width: 950px;
      margin: 0 auto;
      backdrop-filter: blur(5px);
    }

    /* Barre de titre de la fenêtre (Décoration) */
    .markdown-section::before {
      content: "SYSTEM ALERT // MESSAGE WINDOW";
      position: absolute;
      top: 0; left: 0; width: 100%;
      height: 25px;
      background: rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
      line-height: 25px;
      padding-left: 15px;
      box-sizing: border-box;
      border-radius: 8px 8px 0 0;
      font-family: monospace;
    }

    /* Titres */
    .markdown-section h1 {
      color: #fff;
      font-size: 2.5rem;
      border-bottom: 2px solid var(--sao-orange);
      padding-bottom: 10px;
      margin-top: 0;
      text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
    }

    .markdown-section h2 {
      color: var(--sao-orange);
      margin-top: 40px;
      border-left: 5px solid var(--sao-orange);
      padding-left: 15px;
      background: linear-gradient(90deg, rgba(255, 170, 0, 0.1), transparent);
    }

    /* Liens hypertexte */
    .markdown-section a {
      color: var(--sao-orange);
      font-weight: 600;
      text-decoration: none;
      position: relative;
    }
    .markdown-section a::after {
      content: ' »';
      font-size: 0.8em;
    }
    .markdown-section a:hover {
      text-shadow: 0 0 8px var(--sao-orange);
    }

    /* Codes */
    .markdown-section code {
      color: var(--sao-orange) !important;
      background: rgba(0,0,0,0.5) !important;
      border: 1px solid rgba(255, 170, 0, 0.2);
    }
    
    .markdown-section pre {
      background: rgba(10, 10, 10, 0.8) !important;
      border: 1px solid var(--sao-panel-border);
      position: relative;
    }

    /* --- 4. BARRE DE RECHERCHE (Input Field) --- */
    .search {
      margin-bottom: 20px;
      border-bottom: none !important;
      padding: 10px;
    }
    .search input {
      background: rgba(0,0,0,0.4) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #fff !important;
      border-radius: 20px; /* Forme de pilule */
      padding: 5px 15px !important;
      transition: all 0.3s;
    }
    .search input:focus {
      border-color: var(--sao-orange) !important;
      box-shadow: 0 0 10px var(--sao-orange-glow);
    }

    /* --- 5. SCROLLBARS --- */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sao-orange); }

    /* --- CHARGEMENT --- */
    #app {
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <!-- Point de montage avec texte de chargement immersif -->
  <div id="app">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center; color:#ffaa00;">
      <h2 style="font-family: sans-serif; letter-spacing: 5px;">LINK START</h2>
      <p style="color:#666;">INITIALIZING CARDINAL SYSTEM...</p>
    </div>
  </div>

  <script>
    window.$docsify = {
      // Le logo est stylisé via CSS, on met juste le texte ici
      name: 'LifeSteal FR',
      repo: '', 
      
      homepage: 'README.md',
      loadSidebar: true, // Nécessite toujours le script Python
      subMaxLevel: 3,
      auto2top: true,
      
      // Configuration Recherche
      search: {
        placeholder: 'SEARCH OBJECT...',
        noData: 'NO DATA FOUND.',
        depth: 6
      },

      sidebarDisplayLevel: 1,

      copyCode: {
        buttonText: 'COPY',
        errorText: 'ERROR',
        successText: 'COPIED'
      }
    }
  </script>

  <!-- Scripts Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

</body>
</html>

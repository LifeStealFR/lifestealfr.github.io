<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Docs | LifestealFR</title>
    
    <!-- Polices Dev (Inter pour le texte, Fira Code pour le code) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="branding/logo-icon.png">
    <!-- Coloration syntaxique One Dark (Style VS Code) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">

    <!-- Tailwind CSS AVEC LE PLUGIN TYPOGRAPHY (C'est ça qui répare le Markdown !) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
                    colors: { dev: { bg: '#0d1117', panel: '#161b22', border: '#30363d', accent: '#58a6ff' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        
        /* Personnalisation avancée du Markdown (Plugin Typography) */
        .prose-invert {
            --tw-prose-body: #c9d1d9;
            --tw-prose-headings: #ffffff;
            --tw-prose-links: #58a6ff;
            --tw-prose-bold: #ffffff;
            --tw-prose-hr: #30363d;
            --tw-prose-quotes: #8b949e;
            --tw-prose-quote-borders: #30363d;
            --tw-prose-code: #ff7b72;
            --tw-prose-th-borders: #30363d;
            --tw-prose-td-borders: #30363d;
        }

        /* Style des balises `code` en ligne (pas les gros blocs) */
        .prose-invert :where(code):not(:where([class~="not-prose"] *)) {
            background-color: rgba(110, 118, 129, 0.4);
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-weight: 500;
        }
        .prose-invert :where(code):not(:where([class~="not-prose"] *))::before,
        .prose-invert :where(code):not(:where([class~="not-prose"] *))::after { content: ""; }

        /* Tables style GitHub Dark */
        .prose-invert table { width: 100%; text-align: left; border-collapse: collapse; }
        .prose-invert th { background-color: #161b22; padding: 12px; font-size: 0.875rem; border: 1px solid #30363d; }
        .prose-invert td { padding: 12px; font-size: 0.875rem; border: 1px solid #30363d; background-color: #0d1117; }

        .glass-nav { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #30363d; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Navbar Minimaliste -->
    <nav class="sticky top-0 z-50 glass-nav px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-layer-group text-dev-accent text-xl"></i>
                <span class="text-lg font-semibold text-white tracking-wide">LifestealMC <span class="text-gray-500 font-mono text-sm ml-1 border border-gray-700 bg-gray-800/50 px-1.5 py-0.5 rounded">API</span></span>
            </div>
            <a href="https://lifestealmc.fr" class="text-sm text-gray-400 hover:text-white transition font-medium">Retour au site <i class="fas fa-arrow-right ml-1 text-xs"></i></a>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-4xl mx-auto px-6 py-12">
        <!-- Loader -->
        <div id="loader" class="flex items-center justify-center py-20 text-gray-500 font-mono text-sm">
            <i class="fas fa-circle-notch fa-spin mr-3 text-dev-accent"></i> fetching api.md...
        </div>

        <!-- C'EST ICI QUE LE MARKDOWN EST INJECTÉ. LA CLASSE "prose" GÈRE TOUT LE DESIGN -->
        <article id="content" class="hidden prose prose-invert max-w-none prose-h1:text-3xl prose-h2:text-2xl prose-h2:border-b prose-h2:border-dev-border prose-h2:pb-2 prose-a:no-underline hover:prose-a:underline prose-pre:p-0 prose-pre:bg-transparent"></article>
    </main>

    <footer class="border-t border-dev-border mt-auto">
        <div class="max-w-4xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center text-xs text-gray-500 font-mono">
            <p>status: <span class="text-green-500">200 OK</span></p>
            <p>LifestealMC Network &copy; 2024</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script>
        const MD_FILE = 'api.md'; 

        async function init() {
            try {
                const response = await fetch(MD_FILE);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const markdown = await response.text();

                // On configure Marked.js pour qu'il ne touche qu'aux blocs de code
                const renderer = new marked.Renderer();
                
                // Design des blocs de code style Éditeur
                renderer.code = ({ text, lang }) => {
                    const language = lang || 'plaintext';
                    const validLang = !!(lang && hljs.getLanguage(lang));
                    const highlighted = validLang ? hljs.highlight(text, { language: lang }).value : text;
                    
                    return `
                        <div class="my-6 rounded-lg overflow-hidden border border-dev-border bg-dev-panel shadow-lg">
                            <div class="flex items-center justify-between px-4 py-2 bg-[#0d1117] border-b border-dev-border">
                                <span class="text-xs font-mono text-gray-400 lowercase">${language}</span>
                                <button onclick="copyCode(this)" class="text-gray-500 hover:text-white transition flex items-center gap-1.5 text-xs font-mono">
                                    <i class="far fa-copy"></i> copy
                                </button>
                            </div>
                            <div class="p-4 overflow-x-auto bg-[#161b22]">
                                <pre style="margin:0; padding:0; background:transparent;"><code class="hljs language-${language} text-sm font-mono leading-relaxed">${highlighted}</code></pre>
                            </div>
                        </div>`;
                };

                marked.setOptions({ renderer });

                // Injection du HTML
                document.getElementById('content').innerHTML = marked.parse(markdown);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').classList.remove('hidden');
                
            } catch (err) {
                document.getElementById('loader').innerHTML = `<span class="text-red-400"><i class="fas fa-times-circle mr-2"></i> Failed to load documentation: ${err.message}</span>`;
            }
        }

        // Fonction copie
        function copyCode(btn) {
            const codeBlock = btn.parentElement.nextElementSibling.querySelector('code');
            navigator.clipboard.writeText(codeBlock.innerText);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check text-green-400"></i> copied';
            btn.classList.add('text-green-400');
            setTimeout(() => { 
                btn.innerHTML = originalHTML; 
                btn.classList.remove('text-green-400');
            }, 2000);
        }

        init();
    </script>
</body>
</html>

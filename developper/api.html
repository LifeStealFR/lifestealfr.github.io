<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifestealFR | Developer Docs</title>
    
    <!-- Polices et Icones -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Coloration de code (Tokyo Night Theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0e14; color: #e2e8f0; }
        
        /* Personnalisation du rendu Markdown */
        #content h1 { @apply text-4xl font-bold mb-6 text-white border-b border-gray-800 pb-4; }
        #content h2 { @apply text-2xl font-semibold mt-10 mb-4 text-blue-400; }
        #content h3 { @apply text-xl font-medium mt-8 mb-2 text-indigo-300; }
        #content p { @apply text-gray-400 leading-relaxed mb-4; }
        
        /* Tableaux stylés */
        #content table { @apply w-full text-left border-collapse my-6 rounded-lg overflow-hidden; }
        #content th { @apply bg-gray-800/50 p-4 text-gray-200 font-semibold border-b border-gray-700; }
        #content td { @apply p-4 border-b border-gray-800/50 bg-gray-900/30; }
        
        /* Blocs de code */
        #content pre { @apply rounded-xl border border-gray-800 my-6 shadow-2xl !bg-[#1a1b26]; }
        #content code:not(pre code) { @apply bg-blue-500/10 text-blue-400 px-1.5 py-0.5 rounded font-mono text-sm; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0e14; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="antialiased">

    <!-- NAVBAR MOBILE-FRIENDLY -->
    <nav class="sticky top-0 z-50 glass px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fas fa-terminal text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Lifesteal<span class="gradient-text">MC</span> <span class="text-xs uppercase bg-gray-800 px-2 py-1 rounded ml-2 text-gray-400">API</span></span>
            </div>
            <div class="hidden md:flex gap-6 text-sm font-medium text-gray-400">
                <a href="https://lifestealmc.fr" class="hover:text-white transition">Retour au site</a>
                <a href="#" class="hover:text-white transition text-blue-400">Documentation</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <!-- LOADER -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            <p class="mt-4 text-gray-500 font-medium animate-pulse">Chargement des données...</p>
        </div>

        <!-- CONTENT AREA -->
        <article id="content" class="hidden animate-in fade-in duration-700"></article>
    </main>

    <footer class="max-w-5xl mx-auto px-6 py-12 border-t border-gray-900 text-center text-gray-600 text-sm">
        &copy; 2024 LifestealMC. Tous droits réservés. <br>
        <span class="mt-2 block italic text-gray-700 font-mono italic text-blue-900/50 text-xs">Propulsé par Azuriom & API-Extender</span>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script>
        // CONFIGURATION : Le lien vers ton fichier Markdown (api.md)
        const MD_FILE = 'api.md'; 

        async function fetchDocs() {
            try {
                const response = await fetch(MD_FILE);
                if (!response.ok) throw new Error("Fichier .md introuvable.");
                const markdown = await response.text();

                // Custom Render pour ajouter des icones auto sur les titres
                const renderer = new marked.Renderer();
                renderer.heading = function(text, level) {
                    const icons = { 1: 'fa-book', 2: 'fa-bolt', 3: 'fa-code' };
                    const icon = icons[level] || 'fa-chevron-right';
                    return `<h${level} id="${text.toLowerCase().replace(/[^\w]+/g, '-')}"><i class="fas ${icon} mr-3 opacity-30 text-sm"></i>${text}</h${level}>`;
                };

                marked.setOptions({
                    renderer: renderer,
                    highlight: function(code, lang) {
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                document.getElementById('content').innerHTML = marked.parse(markdown);
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                // Coloration du code
                hljs.highlightAll();

            } catch (err) {
                document.getElementById('loader').innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/50 p-6 rounded-xl text-center">
                        <i class="fas fa-circle-exclamation text-3xl text-red-500 mb-4"></i>
                        <h2 class="text-xl font-bold text-white">Erreur de chargement</h2>
                        <p class="text-red-400 mt-2">${err.message}</p>
                    </div>`;
            }
        }

        fetchDocs();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Script de Démarrage Minecraft Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #10b981;
            --border: #334155;
            --code-bg: #0b1120;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            color: var(--accent);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media(min-width: 850px) {
            .grid {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row > div {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .toggle-container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        input:disabled + .slider {
            background-color: #1e293b;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .help-text {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
        }

        .code-container {
            position: relative;
            background-color: var(--code-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .code-header {
            background-color: #162032;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name {
            font-family: monospace;
            color: var(--accent);
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--border);
        }

        .btn.primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #0f172a;
        }

        .btn.primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn.success {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        pre {
            padding: 1.5rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #a5b4fc;
            font-family: "Fira Code", Consolas, Monaco, monospace;
            font-size: 0.9rem;
            flex-grow: 1;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Générateur de Script Pro</h1>
        <p class="subtitle">Paper, Velocity, Purpur... Générez vos scripts de lancement optimisés en un clic.</p>
    </header>

    <div class="grid">
        <!-- Colonne Formulaire -->
        <div class="card">
            <h2>Configuration</h2>
            
            <div class="form-group">
                <label for="os">Système d'exploitation</label>
                <select id="os">
                    <option value="windows">Windows (.bat)</option>
                    <option value="linux">Linux / macOS (.sh)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="software">Logiciel Serveur</label>
                <select id="software">
                    <option value="paper">Paper / Purpur / Spigot (Aikar's Flags)</option>
                    <option value="velocity">Velocity (Proxy)</option>
                    <option value="bungee">BungeeCord / Waterfall (Proxy)</option>
                    <option value="vanilla">Vanilla / Fabric / Forge (Basique)</option>
                </select>
            </div>

            <div class="form-row form-group">
                <div>
                    <label for="ram">Mémoire</label>
                    <input type="number" id="ram" min="1" max="128" value="4" step="0.5">
                </div>
                <div>
                    <label for="unit">Unité</label>
                    <select id="unit">
                        <option value="G">Go (Gigaoctets)</option>
                        <option value="M">Mo (Mégaoctets)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="jarName">Fichier Exécutable</label>
                <input type="text" id="jarName" value="server.jar">
            </div>

            <div class="form-group toggle-container">
                <div>
                    <label>Auto-Restart (Boucle)</label>
                    <span class="help-text">Redémarre le serveur automatiquement en cas de crash ou de /stop.</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="restart">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group toggle-container" id="guiContainer">
                <div>
                    <label>Interface GUI</label>
                    <span class="help-text">Afficher la console blanche par défaut (déconseillé).</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="gui">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Colonne Résultat -->
        <div class="card" style="display: flex; flex-direction: column; padding: 0;">
            <div class="code-container">
                <div class="code-header">
                    <span id="fileNameDisplay" class="file-name">start.bat</span>
                    <div class="button-group">
                        <button class="btn" id="copyBtn" onclick="copyCode()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copier
                        </button>
                        <button class="btn primary" id="dlBtn" onclick="downloadFile()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Télécharger
                        </button>
                    </div>
                </div>
                <pre><code id="outputCode"></code></pre>
            </div>
        </div>
    </div>
</div>

<script>
    // Éléments DOM
    const els = {
        os: document.getElementById('os'),
        software: document.getElementById('software'),
        ram: document.getElementById('ram'),
        unit: document.getElementById('unit'),
        jar: document.getElementById('jarName'),
        restart: document.getElementById('restart'),
        gui: document.getElementById('gui'),
        output: document.getElementById('outputCode'),
        fileName: document.getElementById('fileNameDisplay'),
        copyBtn: document.getElementById('copyBtn'),
        guiContainer: document.getElementById('guiContainer')
    };

    // Bases des flags
    const flags = {
        paper_base: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true",
        paper_large_ram: "-XX:G1NewSizePercent=40 -XX:G1MaxNewSizePercent=50 -XX:G1ReservePercent=15 -XX:InitiatingHeapOccupancyPercent=20",
        paper_small_ram: "-XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1ReservePercent=20",
        velocity: "-XX:+UseG1GC -XX:G1HeapRegionSize=4M -XX:+UnlockExperimentalVMOptions -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch -XX:MaxInlineLevel=15",
        bungee: "-XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:-UseAdaptiveSizePolicy -XX:CompileThreshold=100 -Dfile.encoding=UTF-8"
    };

    function updateUI() {
        // Les proxys (Velocity/Bungee) n'ont pas de GUI
        const isProxy = els.software.value === 'velocity' || els.software.value === 'bungee';
        els.gui.disabled = isProxy;
        if (isProxy) els.gui.checked = false;
        els.guiContainer.style.opacity = isProxy ? '0.5' : '1';
        
        // Suggestion automatique de nom de jar
        if (els.software.value === 'velocity' && els.jar.value === 'server.jar') els.jar.value = 'velocity.jar';
        if (els.software.value === 'paper' && els.jar.value === 'velocity.jar') els.jar.value = 'paper.jar';
    }

    function generateScript() {
        updateUI();

        const os = els.os.value;
        const software = els.software.value;
        const ram = els.ram.value || 1;
        const unit = els.unit.value;
        const jar = els.jar.value || 'server.jar';
        const autoRestart = els.restart.checked;
        const useGui = els.gui.checked;

        // RAM pour calculs (Conversion en Go si en Mo)
        const ramInGb = unit === 'G' ? parseFloat(ram) : parseFloat(ram) / 1024;

        let script = "";
        const ext = os === 'windows' ? ".bat" : ".sh";
        els.fileName.textContent = `start${ext}`;

        // 1. En-tête
        if (os === 'windows') {
            script += "@echo off\n";
            script += "TITLE Minecraft Server\n";
            if (autoRestart) script += ":start\n";
        } else {
            script += "#!/usr/bin/env bash\n";
            if (autoRestart) script += "while true\ndo\n";
        }

        // 2. Commande Java
        let cmd = `java -Xms${ram}${unit} -Xmx${ram}${unit}`;

        // 3. Application des Flags selon logiciel
        if (software === 'paper') {
            cmd += ` ${flags.paper_base}`;
            if (ramInGb >= 12) {
                cmd += ` ${flags.paper_large_ram}`;
            } else {
                cmd += ` ${flags.paper_small_ram}`;
            }
        } else if (software === 'velocity') {
            cmd += ` ${flags.velocity}`;
        } else if (software === 'bungee') {
            cmd += ` ${flags.bungee}`;
        }

        // 4. Ajout de l'exécutable
        cmd += ` -jar ${jar}`;

        // 5. Options de fin (NoGUI)
        if (!useGui && software !== 'velocity' && software !== 'bungee') {
            cmd += " --nogui";
        }

        // Indentation pour la boucle Linux
        if (os === 'linux' && autoRestart) {
            script += `    ${cmd}\n`;
        } else {
            script += `${cmd}\n`;
        }

        // 6. Gestion du redémarrage
        if (autoRestart) {
            if (os === 'windows') {
                script += "echo Serveur en cours de redemarrage... Appuyez sur CTRL+C pour annuler.\n";
                script += "timeout /t 5\n";
                script += "goto start\n";
            } else {
                script += '    echo "Le serveur va redemarrer dans 5 secondes. Appuyez sur CTRL+C pour annuler."\n';
                script += "    sleep 5\n";
                script += "done\n";
            }
        } else {
            // Pas d'auto-restart = on met en pause à la fin pour voir les erreurs
            if (os === 'windows') {
                script += "pause\n";
            }
        }

        els.output.textContent = script;
    }

    // Copier le texte
    function copyCode() {
        navigator.clipboard.writeText(els.output.textContent).then(() => {
            const originalText = els.copyBtn.innerHTML;
            els.copyBtn.classList.add('success');
            els.copyBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copié !';
            
            setTimeout(() => {
                els.copyBtn.classList.remove('success');
                els.copyBtn.innerHTML = originalText;
            }, 2000);
        });
    }

    // Télécharger le fichier
    function downloadFile() {
        const text = els.output.textContent;
        const filename = els.fileName.textContent;
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Écouteurs d'événements
    Object.values(els).forEach(el => {
        if(el && (el.tagName === 'INPUT' || el.tagName === 'SELECT')) {
            el.addEventListener('input', generateScript);
            el.addEventListener('change', generateScript);
        }
    });

    // Init
    generateScript();
</script>

</body>
</html>

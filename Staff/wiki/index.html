<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Staff Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Wiki officiel pour le staff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Thème sombre design (Docsify Themeable) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <!-- Personnalisation CSS (Design) -->
  <style>
    :root {
      /* Couleur d'accentuation (Ici un violet moderne, tu peux changer par du bleu #3498db ou rouge #e74c3c) */
      --theme-color: #bb86fc; 
      
      /* Typographie plus propre */
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      
      /* Fond légèrement plus texturé pour le menu */
      --sidebar-background: #181a1b;
      --sidebar-name-color: #bb86fc;
      --sidebar-nav-link-color: #a0aabf;
      --sidebar-nav-link-color--active: #fff;
    }

    /* Design des titres dans les pages */
    .markdown-section h1, .markdown-section h2 {
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    /* Arrondir la barre de recherche */
    .sidebar .search input {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">⏳ Chargement du Wiki du Staff...</div>

  <script>
    window.$docsify = {
      name: '🛡️ Staff Wiki', // Le nom affiché en haut à gauche
      repo: '', // Optionnel : Mets le lien de ton repo GitHub ici pour afficher une icône en haut à droite
      
      // Configuration pour lire dans les DOSSIERS via un menu latéral
      loadSidebar: true, // Active la lecture du fichier _sidebar.md
      subMaxLevel: 3,    // Affiche les sous-titres (h2, h3) dans le menu
      autoHeader: true,  // Ajoute le titre principal automatiquement
      
      // Options ergonomiques
      auto2top: true,    // Remonte en haut automatiquement quand on change de page
      themeColor: '#bb86fc', 
      
      // Configuration du plugin de recherche
      search: {
        paths: 'auto',
        placeholder: '🔍 Rechercher dans le wiki...',
        noData: '❌ Aucun résultat trouvé.',
        depth: 3,
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugins indispensables pour le Wiki -->
  <!-- 1. Barre de recherche -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 2. Zoom sur les images (clic pour agrandir) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- 3. Bouton "Copier" sur les blocs de code -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>

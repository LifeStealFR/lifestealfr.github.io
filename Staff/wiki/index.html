<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Staff Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Police "Poppins" pour le côté moderne et doux -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Thème de base Dark -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/dark.css">
  
  <!-- CSS pour la barre latérale DÉPLIABLE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <!-- DESIGN "DARK IDOL THEME" (Custom CSS) -->
  <style>
    :root {
      /* Palette de couleurs "Dark Idol" */
      --bg-color: #0d0509;       /* Noir/Magenta profond */
      --text-color: #fce7f3;     /* Rose très pâle pour la lisibilité */
      --heading-color: #ff7eb3;  /* Rose vibrant pour les titres */
      --accent-color: #ff2a7a;   /* Rose signature */
      --accent-hover: #ff5e99;   /* Rose plus clair au survol */
      --border-color: #3d1c2a;   /* Bordures discrètes */
      --star-color: #ffdf00;     /* Jaune doré (détails) */
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
    }

    /* ================= ANIMATION DE FOND (Ne coupe jamais) ================= */
    .animated-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background-color: var(--bg-color);
      overflow: hidden;
    }
    
    /* Orbes lumineuses qui flottent */
    .animated-background::before,
    .animated-background::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px); /* Flou extrême pour faire un halo */
      opacity: 0.4;
      animation: float 12s infinite alternate ease-in-out;
    }
    
    /* Orbe Rose en haut à gauche */
    .animated-background::before {
      width: 40vw;
      height: 40vw;
      background: var(--accent-color);
      top: -10vw;
      left: -10vw;
    }

    /* Orbe Violette/Magenta en bas à droite */
    .animated-background::after {
      width: 35vw;
      height: 35vw;
      background: #7a1b5c;
      bottom: -10vw;
      right: -10vw;
      animation-duration: 15s;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      100% { transform: translate(50px, 50px) scale(1.1); opacity: 0.5; }
    }

    /* ================= BARRE LATÉRALE (SIDEBAR) ================= */
    .sidebar {
      /* Glassmorphism : Effet de verre pour voir l'animation à travers */
      background-color: rgba(22, 8, 16, 0.7) !important;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-right: 1px solid rgba(255, 42, 122, 0.1);
      box-shadow: 2px 0 20px rgba(0, 0, 0, 0.5);
    }
    
    /* Titre du Wiki */
    .sidebar > h1 {
      font-weight: 800;
      font-size: 1.4rem;
      color: #fff;
      margin: 20px 0;
      text-align: center;
      text-shadow: 0 0 10px var(--accent-color);
    }
    .sidebar > h1 .app-name-link::after { content: " ✨"; }
    
    /* Liens des pages */
    .sidebar ul li a {
      color: #fbcfe8;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      border-radius: 8px;
      padding: 8px 12px;
      text-decoration: none;
    }
    .sidebar ul li a:hover {
      color: #fff;
      background-color: rgba(255, 42, 122, 0.15);
      box-shadow: inset 2px 0 0 var(--accent-color);
    }
    .sidebar ul li.active > a {
      color: #fff;
      background-color: var(--accent-color);
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(255, 42, 122, 0.3);
    }

    /* Noms des Dossiers */
    .sidebar ul li > strong {
      color: var(--heading-color);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 15px;
      display: block;
      cursor: pointer;
    }

    /* Barre de recherche design */
    .sidebar .search input {
      background-color: rgba(10, 3, 6, 0.8) !important;
      border: 1px solid var(--border-color) !important;
      color: #fff !important;
      border-radius: 20px !important;
      padding: 10px 15px !important;
      font-family: 'Poppins', sans-serif;
    }
    .sidebar .search input:focus {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 8px rgba(255, 42, 122, 0.4) !important;
    }

    /* ================= ADAPTATION DES FICHIERS .MD ================= */
    .markdown-section {
      max-width: 900px;
      padding: 40px;
      position: relative;
      z-index: 1; /* S'assure que le texte passe AU DESSUS de l'animation */
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      color: var(--heading-color);
      font-weight: 700;
    }
    
    .markdown-section h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 10px rgba(255, 126, 179, 0.3);
    }

    .markdown-section h2 {
      font-size: 1.8rem;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 0.5rem;
      margin-top: 2.5rem;
    }
    .markdown-section h2::before {
      content: "✨ ";
      color: var(--star-color);
    }

    .markdown-section a {
      color: var(--heading-color);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .markdown-section a:hover {
      color: var(--accent-hover);
      border-bottom: 1px solid var(--accent-hover);
      text-shadow: 0 0 8px rgba(255, 42, 122, 0.4);
    }

    .markdown-section strong {
      color: #fff;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }
    .markdown-section em {
      color: var(--star-color);
    }

    /* Blocs de code */
    .markdown-section pre {
      background-color: rgba(10, 3, 6, 0.8);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-color);
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    
    .markdown-section code {
      background-color: rgba(255, 42, 122, 0.15);
      color: #ff9ebd;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
    }

    /* Citations */
    .markdown-section blockquote {
      border-left: 4px solid var(--accent-color);
      background-color: rgba(255, 42, 122, 0.05);
      color: #fbcfe8;
      border-radius: 0 12px 12px 0;
      padding: 15px 20px;
      margin: 20px 0;
      backdrop-filter: blur(5px);
    }

    /* Tableaux */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
      background-color: rgba(18, 6, 13, 0.6);
      backdrop-filter: blur(5px);
    }
    .markdown-section th {
      background-color: rgba(255, 42, 122, 0.2);
      color: #fff;
      padding: 10px;
    }
    .markdown-section td {
      border: 1px solid var(--border-color);
      padding: 10px;
    }

    /* Scrollbar personnalisée */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: #5c273d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

    /* ================= RESPONSIVE (Mobiles & Tablettes) ================= */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 20px 15px; /* Réduit les marges sur téléphone */
      }
      .markdown-section h1 {
        font-size: 2rem;
      }
      .markdown-section h2 {
        font-size: 1.5rem;
      }
      .sidebar {
        background-color: rgba(22, 8, 16, 0.95) !important; /* Plus opaque sur mobile pour masquer l'arrière-plan */
      }
    }
  </style>
</head>
<body>
  <!-- Calque d'animation fixe en arrière-plan -->
  <div class="animated-background"></div>

  <div id="app">✨ Chargement du Wiki...</div>

  <script>
    window.$docsify = {
      name: 'Staff Wiki', // Titre neutre
      repo: '',
      
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      
      search: {
        paths: 'auto',
        placeholder: '🔍 Rechercher...', // Neutre
        noData: '❌ Aucun résultat.', // Neutre
        depth: 3,
      },

      sidebarDisplayLevel: 1 
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- PLUGINS -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMHY | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b; /* Noir très profond */
            --bg-card: #121214;
            --bg-element: #1c1c1f;
            --accent: #ff3b3b; /* Rouge vif LifeSteal */
            --accent-hover: #ff5f5f;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        /* Scrollbar stylisée */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 40px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* --- DESIGN DU CONTENU MARKDOWN --- */
        .markdown-body {
            font-size: 15px;
        }

        /* Titres */
        .markdown-body h1 {
            color: #fff;
            font-size: 2.5em;
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .markdown-body h2 {
            color: #fff;
            font-size: 1.8em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-top: 50px;
        }

        .markdown-body h3 {
            color: var(--accent-hover);
            margin-top: 30px;
        }

        /* Liens */
        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            word-break: break-word;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .markdown-body a:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 8px rgba(255, 59, 59, 0.4);
            text-decoration: underline;
        }

        /* Listes */
        .markdown-body ul, .markdown-body ol {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .markdown-body li {
            margin-bottom: 6px;
        }

        /* Menus déroulants (Très utilisés par FMHY) */
        .markdown-body details {
            background: var(--bg-element);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 15px 0;
        }

        .markdown-body summary {
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            outline: none;
        }
        
        .markdown-body details[open] summary {
            margin-bottom: 10px;
            color: var(--accent);
        }

        /* Tableaux */
        .table-wrapper {
            overflow-x: auto;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
        }

        .markdown-body th {
            background: var(--bg-element);
            color: #fff;
            text-align: left;
            padding: 12px;
            font-weight: 700;
        }

        .markdown-body td {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        /* Citations & Code */
        .markdown-body blockquote {
            margin: 20px 0;
            padding: 15px 20px;
            background: rgba(255, 59, 59, 0.05);
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
            color: var(--text-muted);
        }

        .markdown-body code {
            background: var(--bg-element);
            padding: 3px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #ff8a8a;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
        }

        /* --- UI LOADER --- */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text { margin-top: 15px; font-weight: 600; color: #fff; }
        .loader-sub { color: var(--text-muted); font-size: 0.9em; margin-top: 5px; }

        @media (max-width: 768px) {
            .container { margin: 0; border-radius: 0; border: none; padding: 20px; }
            .markdown-body h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Récupération des données...</div>
            <div class="loader-sub">Préparation de l'affichage en cours</div>
        </div>
        
        <div id="content" class="markdown-body"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Configuration de base de Marked (Sans modifier les liens pour ne rien casser)
        marked.setOptions({
            gfm: true,
            breaks: true
        });

        const url = 'https://api.fmhy.net/single-page';

        fetch(url)
            .then(res => res.text())
            .then(text => {
                // ASTUCE DE GÉNIE : On découpe le fichier de 1.6Mo à chaque sous-titre (##)
                // Cela crée une liste de petits morceaux (chunks)
                const chunks = text.split(/(?=^## )/gm);
                let currentChunk = 0;
                
                const contentDiv = document.getElementById('content');
                const loader = document.getElementById('loader');

                // Fonction récursive pour injecter les morceaux un par un
                function renderNextChunk() {
                    if (currentChunk < chunks.length) {
                        // On parse le petit morceau
                        const html = marked.parse(chunks[currentChunk]);
                        
                        // On le met dans une div temporaire pour chercher les tableaux
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = html;

                        // Rendre les tableaux "scrollables" sur mobile (Responsive)
                        tempDiv.querySelectorAll('table').forEach(table => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'table-wrapper';
                            table.parentNode.insertBefore(wrapper, table);
                            wrapper.appendChild(table);
                        });

                        // On injecte le résultat dans la page
                        contentDiv.appendChild(tempDiv);

                        // Dès que le premier morceau (l'intro) est chargé, on cache le loader !
                        if (currentChunk === 0) {
                            loader.style.display = 'none';
                        }

                        currentChunk++;
                        
                        // On passe au morceau suivant avec un micro-délai de 10ms
                        // Ça empêche le navigateur de freezer !
                        setTimeout(renderNextChunk, 10);
                    }
                }

                // On lance le processus
                renderNextChunk();
            })
            .catch(err => {
                document.getElementById('loader').innerHTML = "<span style='color:red; font-weight:bold;'>❌ Erreur de chargement. Veuillez rafraîchir.</span>";
            });

        // GESTION DES LIENS SECURISEE
        // Au lieu de modifier Marked.js, on écoute les clics sur la page.
        document.addEventListener('click', function(e) {
            // Si l'élément cliqué est un lien (ou dans un lien)
            const link = e.target.closest('a');
            
            // Si c'est un lien et qu'il commence par http (lien externe)
            if (link && link.href.startsWith('http')) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        });
    </script>
</body>
</html>

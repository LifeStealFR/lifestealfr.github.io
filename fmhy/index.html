<!DOCTYPE html>
<html lang="fr" data-theme="ai">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMHY | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ANTI-CLIGNOTEMENT -->
    <script>
        const savedTheme = localStorage.getItem('animeTheme') || 'ai';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* --- COULEURS DE BASE --- */
        :root {
            --bg-main: #09090b;
            --bg-sidebar: rgba(18, 18, 20, 0.85);
            --bg-surface: rgba(24, 24, 27, 0.85);
            --bg-hover: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: rgba(39, 39, 42, 0.5);
        }

        /* PALETTES (Variables ultra-légères) */
        [data-theme="ruby"] { --accent: #f43f5e; --aura: rgba(244, 63, 94, 0.20); }
        [data-theme="ai"] { --accent: #c026d3; --aura: rgba(192, 38, 211, 0.20); }
        [data-theme="aqua"] { --accent: #06b6d4; --aura: rgba(6, 182, 212, 0.20); }
        [data-theme="memcho"] { --accent: #eab308; --aura: rgba(234, 179, 8, 0.20); }
        [data-theme="kana"] { --accent: #dc2626; --aura: rgba(220, 38, 38, 0.20); }
        [data-theme="akane"] { --accent: #4f46e5; --aura: rgba(79, 70, 229, 0.20); }
        [data-theme="asuna"] { --accent: #f97316; --aura: rgba(249, 115, 22, 0.20); }
        [data-theme="sinon"] { --accent: #10b981; --aura: rgba(16, 185, 129, 0.20); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- FOND ANIMÉ ZERO LAG (RADIAL GRADIENT) --- */
        #animated-bg {
            position: fixed; inset: 0; z-index: -1;
            overflow: hidden; pointer-events: none;
            background: var(--bg-main);
        }
        
        .aura {
            position: absolute;
            /* Astuce anti-lag : Dégradé au lieu d'un filtre flou ! */
            background: radial-gradient(circle, var(--aura) 0%, transparent 60%);
            will-change: transform, opacity;
            border-radius: 50%;
        }

        .aura-1 { width: 80vw; height: 80vw; top: -20vw; left: -20vw; }
        .aura-2 { width: 90vw; height: 90vw; bottom: -30vw; right: -20vw; }

        /* --- ANIMATIONS PERSONNALISÉES PAR PERSONNAGE --- */
        /* Ai : Rotation Stellaire */
        [data-theme="ai"] .aura { animation: aiAnim 20s linear infinite; }
        @keyframes aiAnim { 0% { transform: rotate(0deg) translate(10vw) rotate(0deg); } 100% { transform: rotate(360deg) translate(10vw) rotate(-360deg); } }

        /* Ruby : Pulsation (Battement de coeur) */
        [data-theme="ruby"] .aura { animation: rubyAnim 3s ease-in-out infinite alternate; }
        @keyframes rubyAnim { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.2); opacity: 1; } }

        /* Aqua : Descente abyssale */
        [data-theme="aqua"] .aura { animation: aquaAnim 8s ease-in-out infinite alternate; }
        @keyframes aquaAnim { 0% { transform: translateY(-15vh); } 100% { transform: translateY(15vh); } }

        /* Kana : Flammes montantes */
        [data-theme="kana"] .aura { animation: kanaAnim 6s ease-in infinite alternate; }
        @keyframes kanaAnim { 0% { transform: translateY(15vh) scale(1); opacity: 1; } 100% { transform: translateY(-15vh) scale(1.1); opacity: 0.5; } }

        /* Memcho : Diagonales Joyeuses */
        [data-theme="memcho"] .aura { animation: memchoAnim 5s ease-in-out infinite alternate; }
        @keyframes memchoAnim { 0% { transform: translate(-10vw, -10vh); } 100% { transform: translate(10vw, 10vh); } }

        /* Akane : Respiration Calme */
        [data-theme="akane"] .aura { animation: akaneAnim 6s ease-in-out infinite alternate; transform: scale(1.5); }
        @keyframes akaneAnim { 0% { opacity: 0.2; } 100% { opacity: 0.9; } }

        /* Asuna : Flash d'épée (Rapide horizontal) */
        [data-theme="asuna"] .aura-1 { height: 40vw; width: 120vw; animation: asunaAnim 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; }
        @keyframes asunaAnim { 0% { transform: translateX(-30vw) scaleY(0.5); opacity: 0.3; } 100% { transform: translateX(30vw) scaleY(1); opacity: 1; } }

        /* Sinon : Sniper (Immobile avec micro-tressaillements) */
        [data-theme="sinon"] .aura { animation: sinonAnim 4s steps(2, end) infinite; }
        @keyframes sinonAnim { 0%, 90% { transform: translate(0, 0); opacity: 0.6; } 95% { transform: translate(2vw, -1vh); opacity: 1; } 100% { transform: translate(-1vw, 1vh); opacity: 0.8; } }

        /* --- UI DE BASE --- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: var(--bg-surface); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 2000;
        }

        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 26px; cursor: pointer; display: none; }
        .logo { font-weight: 800; font-size: 1.2rem; }
        .logo span { color: var(--accent); }

        .icon-btn { background: var(--bg-hover); border: none; color: var(--text-main); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        .icon-btn:hover { background: var(--border); }
        
        .theme-menu {
            position: absolute; top: 55px; right: 20px; background: var(--bg-surface);
            border: 1px solid var(--border); border-radius: 12px; padding: 12px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            opacity: 0; pointer-events: none; transform: translateY(-10px);
            transition: 0.2s; backdrop-filter: blur(15px);
        }
        .theme-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
        
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 8px; background: var(--bg-hover); font-weight: 500; font-size: 0.9rem;}
        .avatar { width: 28px; height: 28px; background: var(--accent); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

        /* --- LAYOUT --- */
        .app-container { display: flex; margin-top: 60px; min-height: calc(100vh - 60px); }

        .sidebar {
            width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border);
            position: fixed; top: 60px; bottom: 0; left: 0; overflow-y: auto; padding: 20px;
            z-index: 1500; transition: transform 0.3s; backdrop-filter: blur(10px);
        }

        .toc-title { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 15px; }
        .toc-link { display: block; text-decoration: none; color: var(--text-muted); padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; }
        .toc-link:hover { background: var(--bg-hover); color: var(--text-main); }
        .toc-h1 { font-weight: 700; color: var(--text-main); margin-top: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .toc-h2 { margin-left: 10px; font-size: 0.85rem; }
        .toc-h3 { margin-left: 20px; font-size: 0.8rem; opacity: 0.8; }

        /* --- MARKDOWN (Patch Anti-Crash) --- */
        .main-content { flex: 1; margin-left: 280px; padding: 40px; max-width: 1000px; contain: content; }
        
        /* Attention: AUCUNE transition animée ici pour éviter de surcharger le processeur */
        .markdown-body { font-size: 16px; }
        .markdown-body h1, .markdown-body h2 { color: var(--text-main); scroll-margin-top: 80px; }
        .markdown-body h1 { font-size: 2.2em; font-weight: 800; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin: 40px 0 20px; }
        .markdown-body h1:first-child { margin-top: 0; }
        .markdown-body h2 { font-size: 1.5em; margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .markdown-body h3 { font-size: 1.2em; color: var(--accent); }

        .markdown-body a { color: var(--accent); text-decoration: none; font-weight: 600; word-break: break-word; }
        .markdown-body a:hover { text-decoration: underline; }

        .markdown-body details { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; margin: 15px 0; overflow: hidden; }
        .markdown-body summary { background: var(--bg-hover); padding: 12px 15px; font-weight: 700; cursor: pointer; }
        .markdown-body details > div, .markdown-body details > p { padding: 15px; }

        .table-wrapper { overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.2); }
        .markdown-body table { width: 100%; border-collapse: collapse; }
        .markdown-body th { background: var(--bg-hover); padding: 12px; text-align: left; }
        .markdown-body td { padding: 12px; border-top: 1px solid var(--border); }

        .markdown-body blockquote { border-left: 4px solid var(--accent); padding: 15px 20px; background: rgba(0,0,0,0.3); margin: 20px 0; border-radius: 0 8px 8px 0; color: var(--text-muted); }

        #inline-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { margin-top: 20px; font-weight: 700; color: var(--text-muted); }

        /* --- MOBILE --- */
        #mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1400; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(2px); }
        @media (max-width: 900px) {
            .menu-btn { display: block; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            #mobile-overlay.active { display: block; opacity: 1; top: 60px; }
            .main-content { margin-left: 0; padding: 20px; }
            .user-profile span { display: none; }
        }
    </style>
</head>
<body>

    <!-- FOND SANS LAG -->
    <div id="animated-bg">
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="logo">LifeSteal<span>FR</span></div>
        </div>
        <div class="nav-right">
            <button class="icon-btn" id="themeBtn">🎨</button>
            <div class="theme-menu" id="themeMenu"></div>

            <div class="user-profile" id="userProfile">
                <div class="avatar" id="userAvatar">A</div>
                <span id="userNameDisplay">Anonyme</span>
            </div>
        </div>
    </nav>

    <div id="mobile-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="toc-title">Bibliothèque</div>
            <nav id="toc"></nav>
        </aside>

        <main class="main-content">
            <div id="inline-loader">
                <div class="spinner"></div>
                <div class="loader-text" id="loaderState">Connexion aux archives...</div>
            </div>
            
            <div id="content" class="markdown-body" style="display: none;"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // INITIALISATION PROFIL
        const savedName = localStorage.getItem('username') || 'Visiteur';
        document.getElementById('userNameDisplay').innerText = savedName;
        document.getElementById('userAvatar').innerText = savedName.charAt(0).toUpperCase();

        document.getElementById('userProfile').addEventListener('click', () => {
            const newName = prompt("Choisis ton pseudo local :", localStorage.getItem('username') || '');
            if (newName && newName.trim() !== '') {
                localStorage.setItem('username', newName.trim());
                document.getElementById('userNameDisplay').innerText = newName.trim();
                document.getElementById('userAvatar').innerText = newName.trim().charAt(0).toUpperCase();
            }
        });

        // MENU DES COULEURS
        const palettes = [
            { id: 'ruby', color: '#f43f5e', title: 'Ruby Hoshino' },
            { id: 'ai', color: '#c026d3', title: 'Ai Hoshino' },
            { id: 'aqua', color: '#06b6d4', title: 'Aqua Hoshino' },
            { id: 'memcho', color: '#eab308', title: 'Memcho' },
            { id: 'kana', color: '#dc2626', title: 'Kana Arima' },
            { id: 'akane', color: '#4f46e5', title: 'Akane Kurokawa' },
            { id: 'asuna', color: '#f97316', title: 'Asuna Yuuki' },
            { id: 'sinon', color: '#10b981', title: 'Sinon (Hecate)' }
        ];

        const themeMenu = document.getElementById('themeMenu');
        palettes.forEach(p => {
            const dot = document.createElement('div');
            dot.className = 'color-dot';
            dot.style.background = p.color;
            dot.title = p.title;
            dot.onclick = () => {
                document.documentElement.setAttribute('data-theme', p.id);
                localStorage.setItem('animeTheme', p.id);
                themeMenu.classList.remove('show');
            };
            themeMenu.appendChild(dot);
        });

        document.getElementById('themeBtn').onclick = (e) => {
            e.stopPropagation();
            themeMenu.classList.toggle('show');
        };
        document.addEventListener('click', () => themeMenu.classList.remove('show'));

        // CHARGEMENT DU TEXTE
        marked.setOptions({ gfm: true, breaks: true });

        fetch('https://api.fmhy.net/single-page')
            .then(res => res.text())
            .then(text => {
                // Délai pour ne pas faire lagger l'UI
                setTimeout(() => {
                    const ghostDiv = document.createElement('div');
                    ghostDiv.innerHTML = marked.parse(text);

                    ghostDiv.querySelectorAll('table').forEach(table => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'table-wrapper';
                        table.parentNode.insertBefore(wrapper, table);
                        wrapper.appendChild(table);
                    });

                    const tocDiv = document.getElementById('toc');
                    const fragment = document.createDocumentFragment();
                    
                    ghostDiv.querySelectorAll('h1, h2, h3').forEach((heading, index) => {
                        if (!heading.id) heading.id = 'section-' + index;
                        const link = document.createElement('a');
                        link.href = '#' + heading.id;
                        link.innerText = heading.innerText.replace(/[↑►▷]/g, '').trim();
                        link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
                        
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            document.getElementById(heading.id).scrollIntoView({ behavior: 'smooth' });
                            if (window.innerWidth <= 900) toggleMenu(false);
                        });
                        fragment.appendChild(link);
                    });
                    
                    tocDiv.appendChild(fragment);

                    const contentDiv = document.getElementById('content');
                    contentDiv.appendChild(ghostDiv);

                    document.getElementById('inline-loader').style.display = 'none';
                    contentDiv.style.display = 'block';

                    const savedScroll = localStorage.getItem('scrollPosition');
                    if (savedScroll) {
                        setTimeout(() => window.scrollTo(0, parseInt(savedScroll)), 100);
                    }
                }, 50);
            });

        let isScrolling;
        window.addEventListener('scroll', () => {
            window.clearTimeout(isScrolling);
            isScrolling = setTimeout(() => {
                localStorage.setItem('scrollPosition', window.scrollY);
            }, 300);
        }, { passive: true });

        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            if (link && !link.getAttribute('href').startsWith('#')) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        });

        // MENU TACTILE (SWIPE SÉCURISÉ)
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        const menuBtn = document.getElementById('menuBtn');

        function toggleMenu(state) {
            const isOpen = state !== undefined ? state : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', isOpen);
            if (isOpen) {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        menuBtn.addEventListener('click', () => toggleMenu());
        overlay.addEventListener('click', () => toggleMenu(false));

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', e => { 
            touchStartX = e.changedTouches[0].screenX; 
            touchStartY = e.changedTouches[0].screenY; 
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (window.innerWidth > 900) return;
            const diffX = e.changedTouches[0].screenX - touchStartX;
            const diffY = Math.abs(e.changedTouches[0].screenY - touchStartY);

            if (diffY < 50) {
                if (diffX > 60 && touchStartX < 40) toggleMenu(true);
                if (diffX < -60 && sidebar.classList.contains('open')) toggleMenu(false);
            }
        }, { passive: true });
    </script>
</body>
</html>

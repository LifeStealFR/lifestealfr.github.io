<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FMHY | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- SYSTÈME DE THÈMES CORRIGÉ --- */
        [data-theme="dark"] {
            --bg-main: #09090b;
            --bg-sidebar: #121214;
            --bg-surface: #18181b;
            --bg-hover: #27272a;
            --accent: #ef4444; 
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        [data-theme="light"] {
            --bg-main: #f8f9fa;
            --bg-sidebar: #ffffff;
            --bg-surface: #ffffff;
            --bg-hover: #e2e8f0;
            --accent: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 2000;
        }

        .nav-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 26px; cursor: pointer; display: none; }
        .logo { font-weight: 800; font-size: 1.2rem; }
        .logo span { color: var(--accent); }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        .icon-btn { background: var(--bg-hover); border: none; color: var(--text-main); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .icon-btn:hover { background: var(--accent); color: white; }
        
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 8px; background: var(--bg-hover); font-weight: 500; font-size: 0.9rem;}
        .avatar { width: 28px; height: 28px; background: var(--accent); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

        /* --- LAYOUT --- */
        .app-container { display: flex; margin-top: 60px; }

        /* --- SIDEBAR CORRIGÉE --- */
        .sidebar {
            width: 300px; 
            background-color: var(--bg-sidebar); 
            border-right: 1px solid var(--border);
            position: fixed; top: 60px; bottom: 0; left: 0; 
            overflow-y: auto; padding: 20px;
            z-index: 1500; 
            transition: transform 0.3s ease;
        }

        .toc-title { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }

        .toc-link {
            display: block; text-decoration: none; color: var(--text-muted);
            padding: 6px 10px; border-radius: 6px; font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .toc-link:hover { background: var(--bg-hover); color: var(--text-main); }
        .toc-h1 { font-weight: 700; color: var(--text-main); margin-top: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .toc-h2 { margin-left: 10px; font-size: 0.85rem; }
        .toc-h3 { margin-left: 20px; font-size: 0.8rem; opacity: 0.8; }

        /* --- CONTENU --- */
        .main-content {
            flex: 1; margin-left: 300px; padding: 40px; max-width: 1000px;
        }

        /* --- MARKDOWN --- */
        .markdown-body { font-size: 16px; }
        .markdown-body h1, .markdown-body h2 { color: var(--text-main); scroll-margin-top: 80px; }
        .markdown-body h1 { font-size: 2.2em; font-weight: 800; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin: 40px 0 20px; }
        .markdown-body h1:first-child { margin-top: 0; }
        .markdown-body h2 { font-size: 1.5em; margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .markdown-body h3 { font-size: 1.2em; color: var(--accent); }

        .markdown-body a { color: var(--accent); text-decoration: none; font-weight: 600; word-break: break-word; }
        .markdown-body a:hover { text-decoration: underline; }

        .markdown-body details { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; margin: 15px 0; overflow: hidden; }
        .markdown-body summary { background: var(--bg-hover); padding: 12px 15px; font-weight: 700; cursor: pointer; }
        .markdown-body details > div, .markdown-body details > p { padding: 15px; }

        .table-wrapper { overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); border-radius: 8px; }
        .markdown-body table { width: 100%; border-collapse: collapse; }
        .markdown-body th { background: var(--bg-hover); padding: 12px; text-align: left; }
        .markdown-body td { padding: 12px; border-top: 1px solid var(--border); }

        .markdown-body blockquote { border-left: 4px solid var(--accent); padding: 10px 20px; background: var(--bg-surface); margin: 20px 0; border-radius: 0 8px 8px 0; color: var(--text-muted); }

        /* --- LOADER --- */
        #loader { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { margin-top: 20px; font-weight: 700; font-size: 1.2rem; }

        /* --- VOILE SOMBRE MOBILE (Overlay) --- */
        #mobile-overlay {
            display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); z-index: 1400; backdrop-filter: blur(2px);
            opacity: 0; transition: opacity 0.3s;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 900px) {
            .menu-btn { display: block; }
            .sidebar { transform: translateX(-100%); width: 280px; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            
            /* Quand le menu est ouvert */
            .sidebar.open { transform: translateX(0); }
            #mobile-overlay.active { display: block; opacity: 1; }

            .main-content { margin-left: 0; padding: 20px; }
            .user-profile span { display: none; } /* Cache le pseudo sur petit écran */
        }
    </style>
</head>
<body>

    <!-- Écran de chargement -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Chargement de l'encyclopédie...</div>
    </div>

    <!-- Voile sombre pour mobile -->
    <div id="mobile-overlay"></div>

    <nav class="navbar">
        <div class="nav-left">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="logo">LifeSteal<span>FR</span></div>
        </div>
        <div class="nav-right">
            <button class="icon-btn" id="themeToggle">🌓</button>
            <div class="user-profile" id="userProfile">
                <div class="avatar" id="userAvatar">A</div>
                <span id="userNameDisplay">Anonyme</span>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="toc-title">Navigation</div>
            <nav id="toc"></nav>
        </aside>

        <main class="main-content">
            <div id="content" class="markdown-body"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // --- 1. INITIALISATION DU THÈME ---
        // Le thème doit être appliqué sur le <html> (document.documentElement)
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Pseudo
        const savedName = localStorage.getItem('username') || 'Visiteur';
        document.getElementById('userNameDisplay').innerText = savedName;
        document.getElementById('userAvatar').innerText = savedName.charAt(0).toUpperCase();

        // --- 2. GESTION DU THÈME (BOUTON) ---
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // --- 3. GESTION DU PSEUDO ---
        document.getElementById('userProfile').addEventListener('click', () => {
            const currentName = localStorage.getItem('username') || '';
            const newName = prompt("Choisissez votre pseudo local :", currentName);
            if (newName && newName.trim() !== '') {
                localStorage.setItem('username', newName.trim());
                document.getElementById('userNameDisplay').innerText = newName.trim();
                document.getElementById('userAvatar').innerText = newName.trim().charAt(0).toUpperCase();
            }
        });

        // --- 4. RÉCUPÉRATION ET PARSING ---
        marked.setOptions({ gfm: true, breaks: true });

        fetch('https://api.fmhy.net/single-page')
            .then(res => res.text())
            .then(text => {
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = marked.parse(text);

                // Tableaux Responsive
                contentDiv.querySelectorAll('table').forEach(table => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                });

                // Génération du Sommaire (TOC)
                const tocDiv = document.getElementById('toc');
                // On ne prend que h1, h2, h3 pour éviter de saturer le menu
                const headings = contentDiv.querySelectorAll('h1, h2, h3');
                
                headings.forEach((heading, index) => {
                    if (!heading.id) heading.id = 'section-' + index;
                    
                    const link = document.createElement('a');
                    link.href = '#' + heading.id;
                    // Nettoyage des symboles bizarres du markdown FMHY
                    link.innerText = heading.innerText.replace(/[↑►▷]/g, '').trim();
                    link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
                    
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        heading.scrollIntoView({ behavior: 'smooth' });
                        if (window.innerWidth <= 900) toggleMenu(false);
                    });

                    tocDiv.appendChild(link);
                });

                // Masquer le loader et restaurer le scroll après le rendu DOM
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    const savedScroll = localStorage.getItem('scrollPosition');
                    if (savedScroll) window.scrollTo(0, parseInt(savedScroll));
                }, 300);
            });

        // --- 5. SAUVEGARDE DU SCROLL ---
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                localStorage.setItem('scrollPosition', window.scrollY);
            }, 500);
        });

        // --- 6. OUVERTURE DES LIENS ---
        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            // Si c'est un lien et qu'il ne sert pas au sommaire (ne commence pas par #)
            if (link && !link.getAttribute('href').startsWith('#')) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        });

        // --- 7. MENU MOBILE & SWIPE ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        const menuBtn = document.getElementById('menuBtn');

        function toggleMenu(state) {
            const isOpen = state !== undefined ? state : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', isOpen);
            
            // Gestion de l'overlay noir sur mobile
            if (isOpen) {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden'; // Empêche de scroller derrière le menu
            } else {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        menuBtn.addEventListener('click', () => toggleMenu());
        overlay.addEventListener('click', () => toggleMenu(false));

        // Détection Tactile (Swipe)
        let touchStartX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (window.innerWidth > 900) return;
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            
            // Swipe Droite depuis le bord (Ouvrir)
            if (diff > 70 && touchStartX < 40) toggleMenu(true);
            // Swipe Gauche (Fermer)
            if (diff < -70 && sidebar.classList.contains('open')) toggleMenu(false);
        }, { passive: true });
    </script>
</body>
</html>

name: UPDATE STAFF WIKI

on:
  push:
    paths:
      - 'Staff/wiki/**' # S'active pour n'importe quelle modif dans ce dossier (fichiers, sous-dossiers, scripts)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Clonage des données
        uses: actions/checkout@v4
        
      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
        
      - name: ⚙️ Lancement du Cardinal Script
        run: python Staff/wiki/scan.py
        
      - name: 💾 Sauvegarde du nouveau Menu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [SYS] Auto-update Menu Navigation"
          file_pattern: 'Staff/wiki/_sidebar.md'
          # Force le commit même si le script n'a pas changé le fichier
          skip_dirty_check: false

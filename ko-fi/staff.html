<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Contact | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --accent: #5865F2;
            --mc-gold: #ffaa00;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { max-width: 900px; width: 100%; }

        /* Override Markdown Body pour le fond sombre */
        .markdown-body {
            background-color: transparent !important;
            color: var(--text-main) !important;
            font-family: 'Inter', sans-serif !important;
        }

        /* Grille pour les cartes ### */
        .staff-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin: 25px 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 25px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .staff-name { font-size: 1.25rem; font-weight: 800; color: #fff; margin-bottom: 20px; display: block; border-bottom: 1px solid #30363d; padding-bottom: 10px;}

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 10px;
            margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03);
        }

        .label { font-size: 0.65rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .value { font-family: 'monospace'; font-size: 0.95rem; color: #fff; }
        .mc-gold { color: var(--mc-gold); font-weight: 700; }
        .role-tag { font-size: 0.85rem; color: var(--text-dim); margin-top: 15px; display: block; font-style: italic; }

        #loader { margin-top: 100px; color: var(--text-dim); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container markdown-body" id="content">
        <div id="loader">Chargement du contenu...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        async function init() {
            try {
                const res = await fetch(url);
                let md = await res.text();
                const container = document.getElementById('content');
                container.innerHTML = ""; 

                // On sépare par les profils ### pour isoler les cartes
                const parts = md.split(/(?=### )/g);

                parts.forEach(part => {
                    if (part.startsWith('### ')) {
                        // C'est un profil, on crée une carte
                        const lines = part.split('\n');
                        const name = lines[0].replace('### ', '').trim();
                        const content = lines.slice(1).join('\n');

                        // Extraction des données
                        const discord = content.match(/Discord.*`(.+?)`/)?.[1] || "";
                        const mc = content.match(/Minecraft.*`(.+?)`/)?.[1] || "";
                        const role = content.match(/Rôle.*:(.+)/)?.[1] || "";

                        // On crée la structure HTML de la carte
                        const cardHTML = `
                            <div class="card">
                                <span class="staff-name">${name}</span>
                                <div class="info-row">
                                    <span class="label">Discord</span>
                                    <span class="value">${discord}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Minecraft</span>
                                    <span class="value mc-gold">${mc}</span>
                                </div>
                                ${role ? `<span class="role-tag">📍 ${role.trim()}</span>` : ''}
                            </div>
                        `;
                        
                        // On injecte dans une grille si nécessaire ou on l'affiche direct
                        const lastElem = container.lastElementChild;
                        if (lastElem && lastElem.className === 'staff-grid') {
                            lastElem.innerHTML += cardHTML;
                        } else {
                            const grid = document.createElement('div');
                            grid.className = 'staff-grid';
                            grid.innerHTML = cardHTML;
                            container.appendChild(grid);
                        }
                    } else {
                        // C'est du Markdown normal (Titres, Textes, Images)
                        const rawHtml = marked.parse(part);
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = rawHtml;
                        container.appendChild(tempDiv);
                    }
                });
            } catch (e) {
                container.innerHTML = "Erreur de chargement du fichier Markdown.";
                console.error(e);
            }
        }

        init();
    </script>
</body>
</html>

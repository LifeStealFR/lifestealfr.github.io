<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Contact | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --accent: #5865F2;
            --mc-gold: #ffaa00;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { max-width: 900px; width: 100%; }

        /* Header */
        .main-title { font-size: 2.5rem; font-weight: 900; text-align: center; margin-bottom: 10px; color: #fff; }
        .intro-text { color: var(--text-dim); text-align: center; margin-bottom: 40px; }

        /* Grades (##) */
        .rank-group-title {
            font-size: 1.4rem; font-weight: 800; color: var(--accent);
            margin: 50px 0 20px 0; display: flex; align-items: center;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .rank-group-title::after { content: ""; flex: 1; height: 1px; background: #30363d; margin-left: 15px; }

        /* Grille */
        .staff-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px;
        }

        /* Cartes (###) */
        .card {
            background: var(--card-bg); border: 1px solid #30363d;
            border-radius: 16px; padding: 25px; transition: 0.3s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .staff-name { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 20px; display: block; }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 10px;
            margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03);
        }

        .label { font-size: 0.65rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .value { font-family: 'monospace'; font-size: 0.9rem; color: #fff; }
        .mc-gold { color: var(--mc-gold); font-weight: 700; }
        .role-tag { font-size: 0.8rem; color: var(--text-dim); margin-top: 10px; display: block; opacity: 0.8; }

        /* Sécurité */
        .security-section {
            margin-top: 50px; padding: 25px; border-top: 1px solid #30363d; color: var(--text-dim);
        }
        .security-section h2 { color: #ff5f5f; font-size: 1.1rem; }
        
        #loader { margin-top: 100px; color: var(--text-dim); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container" id="content">
        <div id="loader">Chargement de l'équipe...</div>
    </div>

    <script>
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        async function init() {
            try {
                const res = await fetch(url);
                const md = await res.text();
                const container = document.getElementById('content');
                container.innerHTML = ""; 

                const lines = md.split('\n');
                let currentGrid = null;

                lines.forEach(line => {
                    const cleanLine = line.trim();

                    if (cleanLine.startsWith('# ')) {
                        container.innerHTML += `<h1 class="main-title">${cleanLine.replace('# ', '')}</h1>`;
                    } 
                    else if (cleanLine.startsWith('## ')) {
                        const title = cleanLine.replace('## ', '');
                        if (title.includes('Rappel de Sécurité')) {
                            container.innerHTML += `<div class="security-section"><h2>${title}</h2></div>`;
                            currentGrid = null;
                        } else {
                            container.innerHTML += `<h2 class="rank-group-title">${title}</h2>`;
                            currentGrid = document.createElement('div');
                            currentGrid.className = 'staff-grid';
                            container.appendChild(currentGrid);
                        }
                    } 
                    else if (cleanLine.startsWith('### ')) {
                        const name = cleanLine.replace('### ', '');
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<span class="staff-name">${name}</span><div class="card-body"></div>`;
                        if (currentGrid) currentGrid.appendChild(card);
                    }
                    else if (cleanLine.includes('**Pseudo Discord**')) {
                        const val = cleanLine.match(/`(.+?)`/)?.[1] || "";
                        addDetail(container, 'Discord', val, false);
                    }
                    else if (cleanLine.includes('**Pseudo Minecraft**')) {
                        const val = cleanLine.match(/`(.+?)`/)?.[1] || "";
                        addDetail(container, 'Minecraft', val, true);
                    }
                    else if (cleanLine.includes('**Rôle**')) {
                        const val = cleanLine.split(':')[1]?.trim() || "";
                        addDetail(container, 'Rôle', val, false, true);
                    }
                    else if (cleanLine.startsWith('* ') || cleanLine.startsWith('>')) {
                        const sec = container.querySelector('.security-section');
                        if (sec) sec.innerHTML += `<p>${cleanLine.replace(/[\*\>]/g, '')}</p>`;
                    }
                });
            } catch (e) { container.innerHTML = "Erreur de chargement."; }
        }

        function addDetail(container, label, value, isMc, isRole = false) {
            const grids = container.querySelectorAll('.staff-grid');
            const lastGrid = grids[grids.length - 1];
            if (!lastGrid) return;
            const lastCard = lastGrid.lastElementChild;
            if (!lastCard) return;
            const body = lastCard.querySelector('.card-body');
            
            if (isRole) {
                body.innerHTML += `<span class="role-tag">📍 ${value}</span>`;
            } else {
                body.innerHTML += `
                    <div class="info-row">
                        <span class="label">${label}</span>
                        <span class="value ${isMc ? 'mc-gold' : ''}">${value}</span>
                    </div>`;
            }
        }
        init();
    </script>
</body>
</html>

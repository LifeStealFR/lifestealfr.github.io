<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Staff | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-color: #5865F2; /* Bleu Blurple Discord */
            --card-bg: #161b22;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            max-width: 800px;
            width: 100%;
            margin: 40px 20px;
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .header-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .markdown-body {
            background-color: transparent !important;
            color: #c9d1d9 !important;
        }

        /* Style spécifique pour les pseudos Discord en code source `text` */
        .markdown-body code {
            background-color: rgba(88, 101, 242, 0.2);
            color: #5865F2;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .markdown-body h1 {
            text-align: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 20px;
            color: #fff;
        }

        .markdown-body ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        /* Style pour transformer les listes Markdown en cartes de staff */
        .markdown-body li {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 10px;
            transition: transform 0.2s ease;
        }

        .markdown-body li:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        #loader {
            text-align: center;
            color: #8b949e;
            margin-top: 50px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.2s;
        }

        .back-btn:hover { color: #fff; }

        @media (max-width: 600px) {
            .main-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="index.html" class="back-btn">← Retour à la charte</a>
        <div id="loader">Récupération des contacts...</div>
        <article id="content" class="markdown-body"></article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Remplace par l'URL de ton nouveau fichier Markdown pour le staff
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        fetch(url)
            .then(response => response.text())
            .then(text => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('loader').innerHTML = "Impossible de charger la liste du staff.";
                console.error(err);
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        :root { --bg: #0d1117; --card-bg: #161b22; --accent: #5865F2; --mc-gold: #ffaa00; --text-main: #f0f6fc; --text-dim: #8b949e; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1000px; width: 100%; }
        
        .group-section { margin-top: 40px; }
        .group-title { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 20px; display: flex; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        
        .card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 12px; padding: 25px; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .staff-name { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        
        .info-box { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; }
        .label { font-size: 0.65rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .value { font-family: 'monospace'; font-size: 0.9rem; color: #fff; }
        .mc-gold { color: var(--mc-gold); font-weight: 700; }
        .role-tag { margin-top: 15px; font-size: 0.85rem; color: var(--text-dim); font-style: italic; display: flex; align-items: center; gap: 8px; }

        .markdown-body { background: transparent !important; color: var(--text-main) !important; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container" id="content"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        async function init() {
            try {
                const res = await fetch(url);
                const md = await res.text();
                const container = document.getElementById('content');
                
                const lines = md.split('\n');
                let currentGrid = null;
                let activeProfile = null;

                lines.forEach(line => {
                    const trimmed = line.trim();

                    if (trimmed.startsWith('# ')) {
                        container.innerHTML += `<div class="markdown-body"><h1>${trimmed.replace('# ', '')}</h1></div>`;
                    } 
                    else if (trimmed.startsWith('## ')) {
                        // Reset : nouveau groupe = nouvelle section
                        const section = document.createElement('div');
                        section.className = 'group-section';
                        section.innerHTML = `<h2 class="group-title">${trimmed.replace('## ', '')}</h2>`;
                        currentGrid = document.createElement('div');
                        currentGrid.className = 'staff-grid';
                        section.appendChild(currentGrid);
                        container.appendChild(section);
                    }
                    else if (trimmed.startsWith('### ')) {
                        // Nouveau Profil
                        activeProfile = {
                            name: trimmed.replace('### ', ''),
                            discord: "Non renseigné",
                            mc: "Non renseigné",
                            role: ""
                        };
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.id = "profile-" + activeProfile.name.replace(/\s+/g, '');
                        card.innerHTML = `<span class="staff-name">${activeProfile.name}</span><div class="card-data"></div>`;
                        
                        if (currentGrid) {
                            currentGrid.appendChild(card);
                        } else {
                            // Si pas de ## avant le ###
                            const soloGrid = document.createElement('div');
                            soloGrid.className = 'staff-grid';
                            soloGrid.appendChild(card);
                            container.appendChild(soloGrid);
                            currentGrid = soloGrid;
                        }
                    }
                    else if (trimmed.startsWith('* ') && activeProfile) {
                        // On injecte les infos dans la CARTE ACTUELLE uniquement
                        const lastCardData = container.querySelector('.card:last-of-type .card-data');
                        const l = trimmed.toLowerCase();
                        
                        if (l.includes('discord')) {
                            const val = trimmed.match(/`(.+?)`/)?.[1] || "";
                            lastCardData.innerHTML += `<div class="info-box"><span class="label">Discord</span><span class="value">${val}</span></div>`;
                        } else if (l.includes('minecraft')) {
                            const val = trimmed.match(/`(.+?)`/)?.[1] || "";
                            lastCardData.innerHTML += `<div class="info-box"><span class="label">Minecraft</span><span class="value mc-gold">${val}</span></div>`;
                        } else if (l.includes('rôle') || l.includes('role')) {
                            const val = trimmed.split(':')[1]?.replace(/\*\*/g, '').trim() || "";
                            lastCardData.parentElement.innerHTML += `<div class="role-tag">📍 ${val}</div>`;
                        }
                    }
                    else if (trimmed.length > 0 && !trimmed.startsWith('---')) {
                        // Markdown standard (si pas dans un profil)
                        const textDiv = document.createElement('div');
                        textDiv.className = 'markdown-body';
                        textDiv.innerHTML = marked.parse(line);
                        container.appendChild(textDiv);
                    }
                    else if (trimmed.startsWith('---')) {
                        container.innerHTML += `<hr style="border:0; border-top:1px solid #30363d; margin:40px 0;">`;
                        currentGrid = null; 
                    }
                });
            } catch (e) { console.error(e); }
        }
        init();
    </script>
</body>
</html>

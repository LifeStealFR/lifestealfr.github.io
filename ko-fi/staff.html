<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Contact | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        :root { --bg: #0d1117; --card-bg: #161b22; --accent: #5865F2; --mc-gold: #ffaa00; --text-main: #f0f6fc; --text-dim: #8b949e; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1000px; width: 100%; }
        
        .markdown-body { background-color: transparent !important; color: var(--text-main) !important; margin-bottom: 20px; }
        .markdown-body h2 { border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-top: 40px; color: #fff !important; }

        .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin: 20px 0 40px 0; }
        
        .card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 16px; padding: 25px; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        .staff-name { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.03); }
        .label { font-size: 0.7rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .value { font-family: 'monospace'; font-size: 0.95rem; color: #fff; }
        .mc-gold { color: var(--mc-gold); font-weight: 700; }
        .role-tag { margin-top: 10px; font-size: 0.9rem; color: var(--text-dim); font-style: italic; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="container" id="main-content"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        async function init() {
            try {
                const res = await fetch(url);
                const md = await res.text();
                const container = document.getElementById('main-content');

                // On découpe par blocs de titres (## ou ###)
                const parts = md.split(/(?=##+ )/g);

                parts.forEach(part => {
                    const trimmed = part.trim();
                    
                    if (trimmed.startsWith('###')) {
                        // --- PROFIL INDIVIDUEL ---
                        const lines = trimmed.split('\n');
                        const name = lines[0].replace('### ', '').trim();
                        let discord = "Non renseigné", mc = "Non renseigné", role = "";

                        lines.forEach(line => {
                            const cleanLine = line.trim();
                            if (cleanLine.startsWith('*')) {
                                const l = cleanLine.toLowerCase();
                                if (l.includes('discord')) discord = cleanLine.match(/`(.+?)`/)?.[1] || discord;
                                if (l.includes('minecraft')) mc = cleanLine.match(/`(.+?)`/)?.[1] || mc;
                                if (l.includes('rôle') || l.includes('role')) {
                                    role = cleanLine.split(':')[1]?.replace(/\*\*/g, '').replace(/[`]/g, '').trim() || "";
                                }
                            }
                        });

                        const cardHTML = `
                            <div class="card">
                                <span class="staff-name">${name}</span>
                                <div class="info-row"><span class="label">Discord</span><span class="value">${discord}</span></div>
                                <div class="info-row"><span class="label">Minecraft</span><span class="value mc-gold">${mc}</span></div>
                                ${role ? `<div class="role-tag">📍 ${role}</div>` : ''}
                            </div>`;

                        // On cherche la dernière grille. Si elle n'existe pas ou qu'un titre est passé par là, on en crée une.
                        let lastElem = container.lastElementChild;
                        if (lastElem && lastElem.classList.contains('staff-grid')) {
                            lastElem.innerHTML += cardHTML;
                        } else {
                            const grid = document.createElement('div');
                            grid.className = 'staff-grid';
                            grid.innerHTML = cardHTML;
                            container.appendChild(grid);
                        }

                    } else {
                        // --- TITRES ET TEXTE NORMAL ---
                        // Cela inclut les # et les ##. Quand on injecte un ## ici,
                        // le prochain profil créera obligatoirement une nouvelle grille en dessous.
                        const mdDiv = document.createElement('div');
                        mdDiv.className = 'markdown-body';
                        mdDiv.innerHTML = marked.parse(part);
                        container.appendChild(mdDiv);
                    }
                });
            } catch (e) { console.error(e); }
        }
        init();
    </script>
</body>
</html>

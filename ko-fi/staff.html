<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --accent: #5865F2;
            --mc-gold: #ffaa00;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 50px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { max-width: 1000px; width: 100%; }

        /* Titre # (Grandes Sections) */
        .main-category {
            font-size: 2rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 2px solid #30363d;
            margin: 60px 0 30px 0; padding-bottom: 10px;
            color: #fff; text-align: center;
        }

        /* Titre ## (Groupes de Ranks) */
        .rank-group-title {
            font-size: 1.2rem; font-weight: 700;
            color: var(--accent);
            margin: 40px 0 20px 0;
            display: flex; align-items: center;
        }
        .rank-group-title::after {
            content: ""; flex: 1; height: 1px; background: #30363d; margin-left: 15px;
        }

        /* Grille de cartes ### */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .staff-name { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; display: block; }
        
        .info-row {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 8px 12px; border-radius: 6px; margin-bottom: 8px;
            font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.03);
        }

        .label { color: var(--text-dim); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
        .value { font-family: 'monospace'; color: #fff; }
        .mc-color { color: var(--mc-gold); }

        #loader { font-size: 1.2rem; color: var(--text-dim); margin-top: 100px; }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <div id="loader">Chargement de l'équipe...</div>
    </div>

    <script>
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        async function init() {
            try {
                const res = await fetch(url);
                const md = await res.text();
                const container = document.getElementById('main-content');
                container.innerHTML = ""; // On vide le loader

                const lines = md.split('\n');
                let currentGrid = null;

                lines.forEach(line => {
                    const cleanLine = line.trim();

                    if (cleanLine.startsWith('# ')) {
                        // Grand Titre Section
                        const h1 = document.createElement('h1');
                        h1.className = 'main-category';
                        h1.textContent = cleanLine.replace('# ', '');
                        container.appendChild(h1);
                    } 
                    else if (cleanLine.startsWith('## ')) {
                        // Titre de Rank
                        const h2 = document.createElement('h2');
                        h2.className = 'rank-group-title';
                        h2.textContent = cleanLine.replace('## ', '');
                        container.appendChild(h2);
                        
                        // On crée une nouvelle grille pour ce rank
                        currentGrid = document.createElement('div');
                        currentGrid.className = 'staff-grid';
                        container.appendChild(currentGrid);
                    } 
                    else if (cleanLine.startsWith('### ')) {
                        // Création d'une carte Profil
                        const name = cleanLine.replace('### ', '');
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<span class="staff-name">${name}</span><div class="data-area"></div>`;
                        if (currentGrid) currentGrid.appendChild(card);
                    }
                    else if (cleanLine.includes('**Discord**')) {
                        const val = cleanLine.match(/`(.+?)`/)?.[1] || "";
                        addInfo(container, 'Discord', val, false);
                    }
                    else if (cleanLine.includes('**Minecraft**')) {
                        const val = cleanLine.match(/`(.+?)`/)?.[1] || "";
                        addInfo(container, 'Minecraft', val, true);
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }

        function addInfo(container, label, value, isMc) {
            const grids = container.querySelectorAll('.staff-grid');
            const lastGrid = grids[grids.length - 1];
            if (!lastGrid) return;
            const lastCard = lastGrid.lastElementChild;
            if (!lastCard) return;
            
            const area = lastCard.querySelector('.data-area');
            area.innerHTML += `
                <div class="info-row">
                    <span class="label">${label}</span>
                    <span class="value ${isMc ? 'mc-color' : ''}">${value}</span>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>

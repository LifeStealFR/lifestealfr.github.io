<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team & Contact | LifeStealFR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c10;
            --card-bg: #161b22;
            --accent: #5865F2; /* Discord Blue */
            --mc-gold: #ffaa00;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 50px; }
        h1 { font-weight: 900; font-size: 2.5rem; text-transform: uppercase; margin: 0; }
        .subtitle { color: var(--text-dim); margin-top: 10px; }

        #staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 25px;
            transition: 0.3s;
        }

        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .role { font-size: 0.7rem; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 15px; display: block; letter-spacing: 1px; }
        
        .info-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label { font-size: 0.75rem; color: var(--text-dim); }
        .value { font-family: 'monospace'; font-weight: 600; font-size: 0.9rem; }
        .mc { color: var(--mc-gold); }

        #error { color: #ff5f5f; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>L'Équipe</h1>
        <p class="subtitle">Contacts officiels LifeStealFR</p>
    </div>

    <div id="staff-grid">
        </div>
    
    <div id="error">Impossible de charger les données du staff.</div>

    <script>
        const url = 'https://raw.githubusercontent.com/LifeStealFR/LifeSteal/refs/heads/main/ko-fi/staff.md';

        async function loadStaff() {
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                // On sépare le MD par les titres (marqués par #)
                const sections = text.split('#').filter(s => s.trim() !== "");
                const grid = document.getElementById('staff-grid');

                sections.forEach(section => {
                    const lines = section.split('\n');
                    const role = lines[0].trim();
                    
                    // On cherche les valeurs entre les ` `
                    const discordMatch = section.match(/Discord.*`(.+?)`/);
                    const mcMatch = section.match(/Minecraft.*`(.+?)`/);

                    if (discordMatch && mcMatch) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <span class="role">${role}</span>
                            <div class="info-box">
                                <span class="label">DISCORD</span>
                                <span class="value">${discordMatch[1]}</span>
                            </div>
                            <div class="info-box">
                                <span class="label">MINECRAFT</span>
                                <span class="value mc">${mcMatch[1]}</span>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });
            } catch (e) {
                document.getElementById('error').style.display = 'block';
            }
        }

        loadStaff();
    </script>
</body>
</html>

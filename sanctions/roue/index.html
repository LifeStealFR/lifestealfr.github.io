<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardinal System - Divine Wheel</title>
    <!-- Polices Tech & Gaming -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sao-blue: #00f0ff;
            --sao-blue-dim: #007c85;
            --sao-gold: #ffd700;
            --sao-orange: #ffaa00;
            --sao-red: #ff3333;
            --sao-dark: #0a0a10;
            --glass-bg: rgba(10, 15, 30, 0.85);
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- FOND MATRICE (HEXAGONES) --- */
        .hex-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(30deg, #0d121f 12%, transparent 12.5%, transparent 87%, #0d121f 87.5%, #0d121f),
                linear-gradient(150deg, #0d121f 12%, transparent 12.5%, transparent 87%, #0d121f 87.5%, #0d121f),
                linear-gradient(30deg, #0d121f 12%, transparent 12.5%, transparent 87%, #0d121f 87.5%, #0d121f),
                linear-gradient(150deg, #0d121f 12%, transparent 12.5%, transparent 87%, #0d121f 87.5%, #0d121f),
                linear-gradient(60deg, #131b2e 25%, transparent 25.5%, transparent 75%, #131b2e 75%, #131b2e),
                linear-gradient(60deg, #131b2e 25%, transparent 25.5%, transparent 75%, #131b2e 75%, #131b2e);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
            opacity: 0.4;
            z-index: -2;
            animation: slideBg 20s linear infinite;
        }

        @keyframes slideBg { 0% { background-position: 0 0; } 100% { background-position: 0 140px; } }

        /* Lignes de scan (Effet écran) */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 90;
            pointer-events: none;
        }

        /* --- UI PRINCIPALE --- */
        .system-container {
            position: relative;
            z-index: 10;
            text-align: center;
            /* Entrance Animation */
            animation: materialize 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0; transform: scale(0.8);
        }

        @keyframes materialize {
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, var(--sao-blue));
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px var(--sao-blue);
        }

        .subtitle {
            color: var(--sao-blue-dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        .subtitle::before, .subtitle::after { content: "- SYSTEM CALL -"; opacity: 0.5; margin: 0 10px; }

        /* --- LA ROUE HOLOGRAPHIQUE --- */
        .holo-ring-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }

        /* Cercles rotatifs décoratifs */
        .data-ring {
            position: absolute;
            top: 50%; left: 50%;
            border-radius: 50%;
            border: 1px solid var(--sao-blue);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--sao-blue);
            pointer-events: none;
        }
        .r1 { width: 100%; height: 100%; border-style: dashed; animation: spin 20s linear infinite; opacity: 0.5; }
        .r2 { width: 110%; height: 110%; border-left-color: transparent; border-right-color: transparent; animation: spin 15s linear infinite reverse; opacity: 0.3; }
        .r3 { width: 85%; height: 85%; border: 2px solid var(--sao-orange); opacity: 0.2; animation: pulseRing 2s infinite; }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes pulseRing { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; } 50% { transform: translate(-50%, -50%) scale(1.02); opacity: 0.5; } }

        /* Canvas Roue */
        canvas {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
            transform-origin: center;
        }

        /* Pointeur (Flèche Système) */
        .pointer {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #fff;
            z-index: 20;
            filter: drop-shadow(0 0 10px #fff);
        }
        .pointer::after {
            content: "";
            position: absolute;
            top: -35px; left: -15px;
            width: 30px; height: 10px;
            background: var(--sao-red);
            box-shadow: 0 0 10px var(--sao-red);
        }

        /* --- BOUTON DE COMMANDE --- */
        .btn-link-start {
            margin-top: 40px;
            background: linear-gradient(90deg, transparent 5%, var(--sao-blue-dim) 5%, var(--sao-blue-dim) 95%, transparent 95%);
            border: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            padding: 15px 60px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        
        .btn-link-start:hover {
            background: linear-gradient(90deg, transparent 5%, var(--sao-blue) 5%, var(--sao-blue) 95%, transparent 95%);
            text-shadow: 0 0 10px #fff;
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--sao-blue);
        }

        .btn-link-start:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- MODALE "ITEM GET" (Style SAO Popup) --- */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .sao-window {
            width: 450px;
            background: rgba(220, 220, 225, 0.95);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 0;
            box-shadow: 
                0 0 0 1px #999,
                0 5px 20px rgba(0,0,0,0.5);
            position: relative;
            transform-origin: center;
            animation: popWindow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        @keyframes popWindow {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .sao-header {
            background: linear-gradient(to right, #ffaa00, #ffcc00);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #fff;
        }
        
        .sao-icon {
            width: 24px; height: 24px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; color: #ffaa00;
            font-size: 16px;
        }

        .sao-title {
            color: #fff;
            font-family: 'Orbitron';
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .sao-body {
            padding: 20px;
            text-align: center;
            color: #444;
        }

        .item-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 10px 0;
            color: #333;
            text-transform: uppercase;
        }

        .item-desc {
            font-family: 'Share Tech Mono';
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #999;
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .sao-btn {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border: 1px solid #fff;
            padding: 10px 40px;
            border-radius: 20px;
            color: white;
            font-family: 'Orbitron';
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .sao-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Types de fenêtres selon rareté (via JS) */
        .sao-window.danger .sao-header { background: linear-gradient(to right, #d31027, #ea384d); }
        .sao-window.danger .sao-icon { color: #d31027; }
        
        .sao-window.divine .sao-header { background: linear-gradient(to right, #FDC830, #F37335); }

        /* --- PARTICULES POLYGONES --- */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

    </style>
</head>
<body>
    
    <div class="scanlines"></div>
    <div class="hex-bg"></div>

    <div class="system-container">
        <h1>Roulette Système</h1>
        <div class="subtitle">PROJECT ALICIZATION // ADMIN ACCESS</div>

        <div class="holo-ring-container">
            <!-- Cercles déco -->
            <div class="data-ring r1"></div>
            <div class="data-ring r2"></div>
            <div class="data-ring r3"></div>
            
            <div class="pointer"></div>
            <canvas id="wheel" width="800" height="800"></canvas>
        </div>

        <button id="spin-btn" class="btn-link-start">GENERATE LOOT</button>
    </div>

    <!-- Modale Resultat -->
    <div id="modal-overlay">
        <div class="sao-window" id="result-window">
            <div class="sao-header">
                <div class="sao-icon">!</div>
                <div class="sao-title" id="res-type">CONGRATULATIONS</div>
            </div>
            <div class="sao-body">
                <div style="font-size: 12px; color:#888; letter-spacing:1px; margin-bottom:5px;">ITEM NAME</div>
                <div class="item-name" id="res-name">DIVINE OBJECT</div>
                
                <div style="font-size: 12px; color:#888; letter-spacing:1px; margin: 15px 0 5px 0; text-align:left;">EFFECT_PROPERTIES:</div>
                <div class="item-desc" id="res-desc">
                    System.out.println("No Effect");
                </div>

                <button class="sao-btn" onclick="closeModal()">ACCEPT</button>
            </div>
        </div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <script>
        // --- DONNÉES DU JUGEMENT (THEME SAO) ---
        // type: 'divine' (Or), 'rare' (Bleu/Violet), 'common' (Vert), 'danger' (Rouge)
        const segments = [
            { name: "MAINTIEN PEINE", effect: "Status: Unchanged. No modification applied.", weight: 12, color: "#4deeea", type: "common" }, // Cyan
            { name: "DURÉE x2", effect: "Time Dilation. Punishment duration doubled.", weight: 5, color: "#ffe700", type: "danger" }, // Jaune alerte
            { name: "CRITICAL x4", effect: "Critical Hit. Max duration applied.", weight: 3, color: "#ff0000", type: "danger" }, // Rouge
            { name: "ZONE LOCK", effect: "Area Restriction applied to player ID.", weight: 2, color: "#7400e8", type: "rare" }, // Violet
            { name: "SILENCE MOD", effect: "Voice/Chat module disabled.", weight: 1, color: "#ff9100", type: "rare" }, // Orange
            { name: "RANK DOWN", effect: "Permission Level Reduced.", weight: 1, color: "#555555", type: "danger" }, // Gris foncé
            { name: "REDUCE 50%", effect: "Mercy protocol. Duration halved.", weight: 0.5, color: "#00ff6a", type: "divine" }, // Vert Matrix
            { name: "DISPEL", effect: "All active debuffs removed.", weight: 0.25, color: "#ffffff", type: "divine" }, // Blanc Pur
            { name: "PERMA-BAN", effect: "Account deletion. ID Erased.", weight: 0.25, color: "#000000", type: "danger" }  // Noir
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const totalWeight = segments.reduce((sum, s) => sum + s.weight, 0);
        let currentRotation = 0;

        // --- DESSIN DU CERCLE DE DONNÉES ---
        function drawWheel() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 20;
            let start = 0;

            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fond tech
            ctx.beginPath();
            ctx.arc(cx, cy, r + 10, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 20, 40, 0.8)";
            ctx.fill();

            segments.forEach((seg, i) => {
                const angle = (seg.weight / totalWeight) * 2 * Math.PI;
                const end = start + angle;

                // 1. Segment (Data Block)
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();
                
                // Style Holographique : Dégradé radiale + Transparence
                let grad = ctx.createRadialGradient(cx, cy, 50, cx, cy, r);
                grad.addColorStop(0, "rgba(0,0,0,0)"); // Centre transparent
                grad.addColorStop(0.5, seg.color + "44"); // Couleur semi-transparente (hex + 44 alpha)
                grad.addColorStop(0.9, seg.color + "aa"); // Bordure intense
                grad.addColorStop(1, seg.color);
                
                ctx.fillStyle = grad;
                ctx.fill();

                // 2. Séparateur Tech (Ligne blanche fine)
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(end) * r, cy + Math.sin(end) * r);
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // 3. Texte (Aligné sur le rayon)
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + angle / 2);
                ctx.textAlign = "right";
                
                // Effet néon texte
                ctx.shadowColor = seg.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = "#fff";
                ctx.font = "bold 28px 'Rajdhani'";
                
                let label = seg.weight <= 0.25 ? "⚠" : seg.name;
                ctx.fillText(label, r - 30, 8);
                
                // Petit indicateur pourcentage
                if (seg.weight > 1) {
                    ctx.font = "14px 'Share Tech Mono'";
                    ctx.fillStyle = "rgba(255,255,255,0.7)";
                    ctx.fillText(((seg.weight/totalWeight)*100).toFixed(0)+"%", r - 30, 25);
                }

                ctx.restore();
                start += angle;
            });

            // Centre Core (Réacteur)
            ctx.beginPath();
            ctx.arc(cx, cy, 60, 0, Math.PI * 2);
            ctx.fillStyle = "#000";
            ctx.fill();
            
            // Anneau lumineux central
            ctx.beginPath();
            ctx.arc(cx, cy, 55, 0, Math.PI * 2);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00f0ff";
            ctx.shadowColor = "#00f0ff";
            ctx.shadowBlur = 20;
            ctx.stroke();
            
            // Texte central
            ctx.font = "bold 20px 'Orbitron'";
            ctx.fillStyle = "#00f0ff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 0;
            ctx.fillText("SYS", cx, cy);
        }

        drawWheel();

        // --- ANIMATION SPIN ---
        const btn = document.getElementById("spin-btn");
        const modal = document.getElementById("modal-overlay");
        const winEl = document.getElementById("result-window");
        const particlesCanvas = document.getElementById("particle-canvas");
        const pCtx = particlesCanvas.getContext("2d");

        btn.addEventListener("click", () => {
            btn.disabled = true;
            btn.innerHTML = "PROCESSING...";
            
            // Weighted Random
            let rand = Math.random() * totalWeight;
            let sum = 0, winner = 0;
            for(let i=0; i<segments.length; i++) {
                sum += segments[i].weight;
                if(rand <= sum) { winner = i; break; }
            }

            // Calcul angles
            let startDeg = 0;
            for(let i=0; i<winner; i++) startDeg += (segments[i].weight/totalWeight)*360;
            let sliceDeg = (segments[winner].weight/totalWeight)*360;
            let targetInSlice = startDeg + sliceDeg / 2; // Viser le centre pile pour effet précis
            
            // Ajouter un peu de RNG visuel
            let noise = (Math.random() - 0.5) * (sliceDeg * 0.6);
            targetInSlice += noise;

            // Rotation (Pointeur en haut = 270deg)
            // On veut atterrir sur 270
            let spins = 5 + Math.floor(Math.random() * 3); // 5 à 8 tours
            let finalRot = currentRotation + (360 * spins) + (270 - targetInSlice - (currentRotation % 360));
            // Assurer rotation positive
            if((finalRot - currentRotation) < 360*5) finalRot += 360;

            // CSS Transition pour le mouvement "Machine"
            // Cubic-bezier personnalisé pour effet "moteur qui démarre et freine sec"
            canvas.style.transition = "transform 5s cubic-bezier(0.25, 1, 0.5, 1)";
            canvas.style.transform = `rotate(${finalRot}deg)`;
            currentRotation = finalRot;

            // Son de charge (Visuel) - L'anneau pulse
            document.querySelector('.r3').style.animationDuration = "0.2s";

            setTimeout(() => {
                showResult(segments[winner]);
                spawnPolygons(segments[winner].color);
                
                btn.disabled = false;
                btn.innerHTML = "GENERATE LOOT";
                document.querySelector('.r3').style.animationDuration = "2s";
            }, 5000);
        });

        // --- RESULT MODAL ---
        function showResult(seg) {
            // Configurer le style de la fenêtre
            winEl.className = "sao-window"; // Reset
            if(seg.type === 'danger') winEl.classList.add('danger');
            if(seg.type === 'divine') winEl.classList.add('divine');

            // Textes
            document.getElementById('res-type').innerText = seg.type === 'divine' ? 'DIVINE OBJECT' : (seg.type === 'danger' ? 'SYSTEM ALERT' : 'ITEM GET');
            document.getElementById('res-name').innerText = seg.name;
            document.getElementById('res-name').style.color = seg.color === '#ffffff' ? '#333' : seg.color;
            
            // Description "Code style"
            document.getElementById('res-desc').innerHTML = 
                `<span style="color:#007c85">class</span> <span style="color:#a800e8">Effect</span> {<br>` +
                `&nbsp;&nbsp;target: <span style="color:#d31027">PlayerID</span>;<br>` +
                `&nbsp;&nbsp;action: "<span style="color:#333">${seg.effect}</span>";<br>` +
                `}`;

            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        // --- PARTICULES SAO (Polygones qui éclatent) ---
        let particles = [];
        
        function resizeCanvas() {
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        function spawnPolygons(color) {
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            for(let i=0; i<60; i++) {
                particles.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    size: Math.random() * 15 + 5,
                    color: color,
                    life: 1.0,
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                });
            }
            animateParticles();
        }

        function animateParticles() {
            pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
            let active = false;

            particles.forEach(p => {
                if(p.life > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95; // Friction
                    p.vy *= 0.95;
                    p.life -= 0.02;
                    p.rotation += p.rotSpeed;

                    pCtx.save();
                    pCtx.translate(p.x, p.y);
                    pCtx.rotate(p.rotation);
                    pCtx.globalAlpha = p.life;
                    pCtx.fillStyle = p.color;

                    // Dessiner un triangle ou carré (glitch style)
                    if(Math.random() > 0.5) {
                        pCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    } else {
                        pCtx.beginPath();
                        pCtx.moveTo(0, -p.size);
                        pCtx.lineTo(p.size, p.size);
                        pCtx.lineTo(-p.size, p.size);
                        pCtx.fill();
                    }
                    pCtx.restore();
                }
            });

            if(active) requestAnimationFrame(animateParticles);
        }

    </script>
</body>
</html>

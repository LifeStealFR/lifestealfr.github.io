<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Call: Generate Luminous Element</title>
    
    <!-- Polices SAO Alicization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --god-gold: #ffd700;
            --god-gold-light: #fffec4;
            --god-glow: rgba(255, 215, 0, 0.6);
            --stacia-pink: #ffb7b2;
            --vector-red: #ff003c;
            --void-bg: #030005;
        }

        body {
            background-color: var(--void-bg);
            color: #fff;
            font-family: 'Cinzel', serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- FOND COSMIQUE STABLE --- */
        .universe {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 120%, #2a0a3d 0%, #000000 70%);
            z-index: -3;
        }
        
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 2px);
            background-size: 550px 550px;
            opacity: 0.6;
            animation: starMove 100s linear infinite;
        }

        @keyframes starMove { from { transform: translateY(0); } to { transform: translateY(-200px); } }

        /* --- INTERFACE PRINCIPALE --- */
        .interface-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Animation d'entrée douce */
            animation: fadeIn 2s ease-out forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .system-text {
            font-family: 'Rajdhani', sans-serif;
            color: var(--god-gold-light);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--god-glow);
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.5rem;
            margin: 0 0 40px 0;
            background: linear-gradient(to bottom, #fff, var(--god-gold));
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            position: relative;
        }

        /* --- CERCLES MAGIQUES --- */
        .sacred-circle-container {
            position: relative;
            width: 550px;
            height: 550px;
            display: flex;
            align-items: center; justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-outer {
            width: 100%; height: 100%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: spinRight 60s linear infinite;
        }

        .ring-mid {
            width: 85%; height: 85%;
            border: 2px solid var(--god-gold);
            opacity: 0.4;
            animation: spinLeft 40s linear infinite;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
        }

        .ring-inner {
            width: 65%; height: 65%;
            border: 1px solid var(--stacia-pink);
            box-shadow: 0 0 20px rgba(255, 183, 178, 0.2);
            animation: pulseRing 4s ease-in-out infinite;
        }

        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        @keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.02); opacity: 0.9; } }

        /* --- CANVAS ROUE (FIXÉ) --- */
        /* Note: mix-blend-mode supprimé pour éviter le bug de disparition */
        canvas {
            position: relative;
            z-index: 5;
            width: 500px;
            height: 500px;
            filter: drop-shadow(0 0 10px var(--god-gold));
            transform-origin: center;
            /* Will-change aide le navigateur à ne pas faire disparaitre l'élément */
            will-change: transform; 
        }

        /* Pointeur */
        .divine-pointer {
            position: absolute;
            top: -40px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 100px;
            background: #fff;
            z-index: 20;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--god-gold);
        }
        .divine-pointer::before {
            content: "▼";
            position: absolute; bottom: -10px; left: -7px;
            color: #fff; font-size: 14px;
            text-shadow: 0 0 10px var(--god-gold);
        }

        /* --- BOUTON --- */
        .btn-release {
            margin-top: 50px;
            background: transparent;
            color: var(--god-gold);
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 5px;
            padding: 18px 60px;
            border: 1px solid var(--god-gold);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            text-shadow: 0 0 5px var(--god-gold);
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .btn-release:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 30px var(--god-gold);
            transform: scale(1.05);
        }

        .btn-release:disabled {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- FENETRE RESULTAT --- */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
        }

        .stacia-window {
            width: 500px;
            background: rgba(20, 15, 25, 0.95);
            border: 1px solid var(--god-gold);
            padding: 4px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            transform: scale(0.8);
            opacity: 0;
            animation: openWindow 0.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes openWindow { to { transform: scale(1); opacity: 1; } }

        .window-inner {
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 30px;
            text-align: center;
        }

        .win-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2.5rem;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        
        .win-desc {
            font-size: 1.2rem;
            color: #ddd;
            margin-bottom: 30px;
        }

        .btn-accept {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px 40px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-accept:hover { background: #fff; color: #000; }

        .stacia-window.dark { border-color: var(--vector-red); }
        .stacia-window.dark .win-title { color: var(--vector-red); text-shadow: 0 0 15px var(--vector-red); }

        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

    <div class="universe">
        <div class="stars"></div>
    </div>

    <div class="interface-container" id="main-ui">
        <div class="system-text">System Call . . . Inspect Entire Command List</div>
        <h1>Divine Authority</h1>
        
        <div class="sacred-circle-container">
            <div class="ring ring-outer"></div>
            <div class="ring ring-mid"></div>
            <div class="ring ring-inner"></div>
            
            <div class="divine-pointer"></div>
            <!-- Canvas avec dimensions fixes pour éviter le flou/disparition -->
            <canvas id="wheel" width="800" height="800"></canvas>
        </div>

        <button id="spin-btn" class="btn-release">ENHANCE ARMAMENT</button>
    </div>

    <div id="result-overlay">
        <div class="stacia-window" id="win-obj">
            <div class="window-inner">
                <div class="system-text">UNIT ID: ADMIN_001</div>
                <div class="win-title" id="res-title">TITLE</div>
                <div class="win-desc" id="res-desc">Description text...</div>
                <button class="btn-accept" onclick="closeModal()">DISCHARGE</button>
            </div>
        </div>
    </div>

    <canvas id="particles"></canvas>

    <script>
        const segments = [
            { name: "MAINTIEN", desc: "La Volonté reste inchangée.", weight: 12, color: "#aaddff", type: "neutral" },
            { name: "DURÉE x2", desc: "Fluctlight Acceleration: Punishment doubled.", weight: 5, color: "#ffaa00", type: "dark" },
            { name: "CRITICAL x4", desc: "Maximum Load. Sanction quadrupled.", weight: 3, color: "#ff003c", type: "dark" },
            { name: "ZONE LOCK", desc: "Spatial Barrier: Area restriction applied.", weight: 2, color: "#d4af37", type: "light" },
            { name: "SILENCE", desc: "Voice Command Module: Disabled.", weight: 1, color: "#b19cd9", type: "neutral" },
            { name: "DEMOTION", desc: "Authority Level Reduced.", weight: 1, color: "#777777", type: "neutral" },
            { name: "MERCY /2", desc: "Solus Blessing: Duration halved.", weight: 0.5, color: "#00ffaa", type: "light" },
            { name: "ABSOLUTION", desc: "Stacia Miracle: Sanction removed.", weight: 0.25, color: "#ffffff", type: "light" },
            { name: "BANISHMENT", desc: "System Alert: Account deletion.", weight: 0.25, color: "#000000", type: "dark" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const totalWeight = segments.reduce((sum, s) => sum + s.weight, 0);
        let currentRotation = 0;

        function drawWheel() {
            // Nettoyage complet
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 40;
            let start = 0;

            segments.forEach((seg) => {
                const angle = (seg.weight / totalWeight) * 2 * Math.PI;
                const end = start + angle;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                // Dégradé solide (pas de transparence excessive)
                let grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, r);
                if (seg.color === "#000000") {
                    grad.addColorStop(0, "#333");
                    grad.addColorStop(1, "#000");
                } else {
                    grad.addColorStop(0, "rgba(255,255,255,0.2)");
                    grad.addColorStop(0.6, seg.color);
                    grad.addColorStop(1, seg.color); // Couleur pleine à la fin
                }

                ctx.fillStyle = grad;
                ctx.fill();

                // Lignes dorées
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(end) * (r + 10), cy + Math.sin(end) * (r + 10));
                ctx.strokeStyle = "rgba(255, 215, 0, 0.6)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Texte
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + angle / 2);
                ctx.textAlign = "right";
                ctx.shadowColor = "rgba(0,0,0,0.8)"; // Ombre noire pour lisibilité
                ctx.shadowBlur = 4;
                ctx.fillStyle = "#fff";
                let fontSize = seg.weight < 1 ? 24 : 32;
                ctx.font = `600 ${fontSize}px 'Cinzel'`;
                let label = seg.weight <= 0.25 ? "Ω" : seg.name;
                ctx.fillText(label, r - 30, 10);
                ctx.restore();

                start += angle;
            });

            // Centre
            ctx.beginPath();
            ctx.arc(cx, cy, 50, 0, Math.PI * 2);
            ctx.fillStyle = "#ffd700";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx, cy, 45, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
        }

        drawWheel();

        // --- ANIMATION STABLE ---
        const btn = document.getElementById("spin-btn");
        const uiContainer = document.getElementById("main-ui");

        btn.addEventListener("click", () => {
            if(btn.disabled) return;
            btn.disabled = true;
            btn.innerHTML = "GENERATING...";
            
            let rand = Math.random() * totalWeight;
            let sum = 0, winner = 0;
            for(let i=0; i<segments.length; i++) {
                sum += segments[i].weight;
                if(rand <= sum) { winner = i; break; }
            }

            let startDeg = 0;
            for(let i=0; i<winner; i++) startDeg += (segments[i].weight/totalWeight)*360;
            let sliceDeg = (segments[winner].weight/totalWeight)*360;
            let target = startDeg + sliceDeg / 2;
            let rng = (Math.random() - 0.5) * (sliceDeg * 0.5);
            
            let spins = 8; 
            let finalRot = currentRotation + (360 * spins) + (270 - (target + rng) - (currentRotation % 360));
            if(finalRot < currentRotation) finalRot += 360;

            // Application de la rotation
            // Note: J'ai retiré l'animation de "shake" sur le container parent
            // car c'est souvent ça qui fait disparaitre le canvas enfant pendant la rotation.
            canvas.style.transition = "transform 6s cubic-bezier(0.1, 0.9, 0.3, 1)";
            canvas.style.transform = `rotate(${finalRot}deg)`;
            currentRotation = finalRot;

            // Accélération visuelle des anneaux
            document.querySelector('.ring-outer').style.animationDuration = "1s";
            
            setTimeout(() => {
                document.querySelector('.ring-outer').style.animationDuration = "60s";
                showResult(segments[winner]);
                explodeParticles(segments[winner].color);
                btn.disabled = false;
                btn.innerHTML = "ENHANCE ARMAMENT";
            }, 6000);
        });

        // --- RESULTATS ---
        const winEl = document.getElementById("win-obj");
        const overlay = document.getElementById("result-overlay");

        function showResult(seg) {
            winEl.className = "stacia-window"; 
            if(seg.type === 'dark') winEl.classList.add('dark');

            document.getElementById("res-title").innerText = seg.name;
            document.getElementById("res-desc").innerText = seg.desc;
            overlay.style.display = "flex";
        }

        function closeModal() {
            overlay.style.display = "none";
        }

        // --- PARTICULES ---
        const pCanvas = document.getElementById("particles");
        const pCtx = pCanvas.getContext("2d");
        
        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeP);
        resizeP();

        let particles = [];

        function explodeParticles(color) {
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            for(let i=0; i<80; i++) {
                particles.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
            loopParticles();
        }

        function loopParticles() {
            pCtx.clearRect(0,0,pCanvas.width, pCanvas.height);
            let active = false;
            particles.forEach(p => {
                if(p.life > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95; p.vy *= 0.95;
                    p.life -= 0.02;
                    pCtx.globalAlpha = p.life;
                    pCtx.fillStyle = p.color;
                    pCtx.beginPath();
                    pCtx.rect(p.x, p.y, p.size, p.size);
                    pCtx.fill();
                }
            });
            if(active) requestAnimationFrame(loopParticles);
        }
    </script>
</body>
</html>

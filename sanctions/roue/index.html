<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Grimoire du Destin</title>
    <!-- Polices Médiévales et Fantasy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #ffd700;
            --gold-dim: #b8860b;
            --magic-blue: #00ffff;
            --magic-purple: #bd00ff;
            --danger: #ff003c;
            --void: #050010;
            --parchment: #e3d2b3;
        }

        body {
            background-color: var(--void);
            color: var(--parchment);
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- FOND ANIMÉ (NUAGES & RUNES) --- */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #000000 100%);
            overflow: hidden;
        }

        .fog {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.1"/%3E%3C/svg%3E');
            animation: fogMove 60s linear infinite;
            opacity: 0.3;
        }

        .giant-rune-circle {
            position: absolute;
            top: 50%; left: 50%;
            width: 150vmin; height: 150vmin;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(189, 0, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(189, 0, 255, 0.05);
            animation: rotateBg 120s linear infinite;
            z-index: -1;
            background-image: repeating-conic-gradient(rgba(189, 0, 255, 0.05) 0 15deg, transparent 15deg 30deg);
            pointer-events: none;
        }

        @keyframes fogMove { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateBg { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- LE LIVRE (CONTENEUR PRINCIPAL) --- */
        .grimoire-container {
            position: relative;
            width: 900px;
            max-width: 95vw;
            background: #110a05; /* Cuir sombre */
            border: 4px solid var(--gold-dim);
            border-radius: 12px;
            box-shadow: 
                0 0 0 8px #2e1a0a, /* Bordure cuir */
                0 0 60px rgba(0,0,0,0.9),
                0 0 100px rgba(184, 134, 11, 0.1) inset; /* Lueur intérieure */
            padding: 40px;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s;
            /* Texture cuir */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
        }

        /* Coins décoratifs dorés */
        .corner {
            position: absolute;
            width: 60px; height: 60px;
            border: 3px solid var(--gold);
            z-index: 10;
            box-shadow: 0 0 10px var(--gold);
        }
        .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        h1 {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 4rem;
            margin: 0 0 20px 0;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
        }

        h1 span { color: var(--danger); }

        /* --- LA ROUE --- */
        .wheel-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            /* Lueur derrière la roue */
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.1); 
        }

        /* Anneau runique qui tourne autour de la roue */
        .rune-ring {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: spinRing 20s linear infinite reverse;
            background-image: url("data:image/svg+xml;utf8,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath id='circlePath' d='M 50, 50 m -45, 0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0' fill='none' /%3E%3Ctext fill='%23b8860b' font-size='8' letter-spacing='5'%3E%3CtextPath href='%23circlePath'%3E• F ATUM • JUDICIUM • AETERNUS • SANCTUS • MORTIS •%3C/textPath%3E%3C/text%3E%3C/svg%3E");
            z-index: 0;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* Le Canvas */
        canvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            transform-origin: center;
            z-index: 2;
            position: relative;
            /* Bordure métallique de la roue */
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,1),
                0 0 0 5px #4a3c26,
                0 0 0 8px var(--gold-dim);
        }

        /* Le Cristal Pointeur */
        .pointer {
            position: absolute;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 70px;
            background: linear-gradient(135deg, #fff, #00ffff);
            clip-path: polygon(50% 100%, 0% 15%, 50% 0%, 100% 15%);
            z-index: 20;
            filter: drop-shadow(0 0 15px #00ffff);
            animation: floatPointer 3s ease-in-out infinite;
        }

        @keyframes floatPointer { 50% { transform: translateX(-50%) translateY(-10px); filter: drop-shadow(0 0 25px #00ffff); } }

        /* --- BOUTON MAGIQUE --- */
        .btn-magic {
            background: linear-gradient(to bottom, #2b1100, #000);
            border: 2px solid var(--gold);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            padding: 15px 60px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(184, 134, 11, 0.3);
            z-index: 10;
        }

        .btn-magic:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px var(--gold), 0 0 80px var(--gold);
            text-shadow: none;
        }
        
        /* Effet de brillance qui traverse le bouton */
        .btn-magic::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.8), transparent);
            transform: rotate(45deg) translate(-150%, 0);
            transition: 0.5s;
        }
        .btn-magic:hover::after { transform: rotate(45deg) translate(150%, 0); }

        .btn-magic:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        /* --- RESULTAT (PARCHEMIN) --- */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s;
        }

        .scroll-content {
            background: var(--parchment);
            width: 500px;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            /* Forme de parchemin déroulé */
            border-radius: 5px;
            box-shadow: 
                0 0 10px rgba(0,0,0,0.5),
                0 0 100px var(--gold-dim);
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 20px solid #4a3c26;
            border-bottom: 20px solid #4a3c26;
        }
        
        .scroll-content::before {
            content: "VERDICTUM";
            position: absolute;
            top: -15px; left: 50%; transform: translateX(-50%);
            color: #e3d2b3; font-family: 'Cinzel'; font-size: 12px; letter-spacing: 5px;
        }

        .modal-title {
            font-family: 'UnifrakturMaguntia';
            font-size: 3rem;
            color: var(--danger);
            border-bottom: 2px solid #2e1a0a;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .modal-desc {
            font-size: 1.5rem;
            color: #2e1a0a;
            font-style: italic;
            margin-bottom: 30px;
        }

        .close-btn {
            background: transparent;
            border: 2px solid #2e1a0a;
            color: #2e1a0a;
            padding: 10px 30px;
            font-family: 'Cinzel';
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { background: #2e1a0a; color: var(--parchment); }

        /* --- RESPONSIVE --- */
        @media (max-width: 700px) {
            .grimoire-container { width: 95%; padding: 20px 10px; }
            .wheel-wrapper { width: 300px; height: 300px; }
            h1 { font-size: 2.5rem; }
        }
        
        /* Animation de shake pour l'écran */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <!-- Couches de fond -->
    <div class="ambient-bg">
        <div class="giant-rune-circle"></div>
        <div class="fog"></div>
    </div>

    <!-- Le Grimoire -->
    <div class="grimoire-container" id="grimoire">
        <!-- Coins dorés -->
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <h1>Roue du <span>Jugement</span></h1>
        
        <div class="wheel-wrapper">
            <div class="rune-ring"></div>
            <div class="pointer"></div>
            <canvas id="wheel" width="800" height="800"></canvas>
        </div>

        <button id="spin-btn" class="btn-magic">Invoquer la Sentence</button>
    </div>

    <!-- Modale de Résultat -->
    <div id="result-modal">
        <div class="scroll-content" id="modal-content">
            <div class="modal-title" id="res-title">TITRE</div>
            <div class="modal-desc" id="res-desc">Description de la sentence...</div>
            <button class="close-btn" onclick="closeModal()">Accepter le Destin</button>
        </div>
    </div>

    <script>
        // --- DONNEES ---
        // Couleurs améliorées pour effet "Vitrail"
        const segments = [
            { name: "MAINTIEN", effect: "La sanction reste inchangée.", weight: 12, color: "#3498db", type: "neutral" },
            { name: "X 2", effect: "Durée de la sanction doublée.", weight: 5, color: "#e67e22", type: "bad" },
            { name: "X 4", effect: "Sanction maximale appliquée.", weight: 3, color: "#d35400", type: "bad" },
            { name: "BLACKLIST ZONES", effect: "Accès restreint (Salons/Zones).", weight: 2, color: "#9b59b6", type: "magic" },
            { name: "MUTE MÉDIAS", effect: "Interdiction liens & images.", weight: 1, color: "#f1c40f", type: "magic" },
            { name: "DÉGRADATION", effect: "Perte de tous les grades/VIP.", weight: 1, color: "#7f8c8d", type: "neutral" },
            { name: "ALLÈGEMENT /2", effect: "Durée divisée par deux.", weight: 0.5, color: "#2ecc71", type: "good" },
            { name: "ANNULATION", effect: "Sanction retirée immédiatement.", weight: 0.25, color: "#1abc9c", type: "good" },
            { name: "BAN DÉFINITIF", effect: "Exclusion permanente & irrévocable.", weight: 0.25, color: "#000000", type: "doom" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const totalWeight = segments.reduce((sum, s) => sum + s.weight, 0);
        let currentRotation = 0;

        // --- DESSIN AVANCÉ ---
        function drawWheel() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 10;
            let start = 0;

            // Fond
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

            segments.forEach(seg => {
                const angle = (seg.weight / totalWeight) * 2 * Math.PI;
                const end = start + angle;

                // 1. Forme de la part
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                // 2. Dégradé radiale (Effet "Vitrail éclairé")
                let gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                if (seg.color === "#000000") {
                    gradient.addColorStop(0, "#333");
                    gradient.addColorStop(1, "#000");
                } else {
                    gradient.addColorStop(0, adjustColor(seg.color, 40)); // Centre plus clair
                    gradient.addColorStop(1, seg.color);
                }
                ctx.fillStyle = gradient;
                ctx.fill();

                // 3. Bordures internes (Or)
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#b8860b";
                ctx.stroke();

                // 4. Texte (Runique / Ancien)
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + angle / 2);
                ctx.textAlign = "right";
                
                // Ombre portée texte (Glow)
                ctx.shadowColor = "rgba(0,0,0,1)";
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                ctx.fillStyle = "#fff";
                
                // Taille dynamique
                let fontSize = seg.weight < 1 ? 22 : 36;
                if(seg.name.length > 10) fontSize = 24;
                
                ctx.font = `bold ${fontSize}px 'Cinzel'`;
                
                // Pour les toutes petites parts (1% et moins), on met juste un symbole
                if(seg.weight <= 0.25) {
                    ctx.fillText("✦", r - 20, 10);
                } else {
                    ctx.fillText(seg.name, r - 30, 10);
                }
                
                ctx.restore();
                start += angle;
            });

            // 5. Centre "Joyau"
            ctx.beginPath();
            ctx.arc(cx, cy, 40, 0, Math.PI*2);
            let gemGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 40);
            gemGrad.addColorStop(0, "#fff");
            gemGrad.addColorStop(0.3, "#ff003c");
            gemGrad.addColorStop(1, "#590015");
            ctx.fillStyle = gemGrad;
            ctx.fill();
            
            // Anneau doré autour du joyau
            ctx.lineWidth = 8;
            ctx.strokeStyle = "#ffd700";
            ctx.stroke();
        }

        // Fonction utilitaire pour éclaircir une couleur hex
        function adjustColor(color, amount) {
            return color; // Simplifié pour cet exemple, mais idéalement éclaircit la couleur
        }

        drawWheel();

        // --- ANIMATION & LOGIQUE ---
        const btn = document.getElementById("spin-btn");
        const grimoire = document.getElementById("grimoire");

        btn.addEventListener("click", () => {
            btn.disabled = true;
            btn.innerText = "Incantation...";
            
            // Calcul résultat
            let rand = Math.random() * totalWeight;
            let sum = 0, winner = 0;
            for(let i=0; i<segments.length; i++) {
                sum += segments[i].weight;
                if(rand <= sum) { winner = i; break; }
            }

            // Calcul angles
            let startDeg = 0;
            for(let i=0; i<winner; i++) startDeg += (segments[i].weight/totalWeight)*360;
            let sliceDeg = (segments[winner].weight/totalWeight)*360;
            
            // Cible : 270 deg (Haut) - (Start + Random dans Slice) + tours complets
            let targetInSlice = startDeg + (sliceDeg * 0.5); // Viser le milieu
            // Ajout d'aléa léger
            targetInSlice += (Math.random() - 0.5) * (sliceDeg * 0.8);

            let spins = 8; // Nombre de tours
            let finalRot = currentRotation + (360 * spins) + (270 - targetInSlice - (currentRotation % 360));
            if (finalRot < currentRotation) finalRot += 360; // Toujours avancer

            // Lancer l'animation
            // On triche avec CSS transition pour la fluidité, mais on ajoute du "Shake"
            canvas.style.transition = "transform 6s cubic-bezier(0.15, 1, 0.3, 1)";
            canvas.style.transform = `rotate(${finalRot}deg)`;
            currentRotation = finalRot;

            // Effet de tremblement pendant que ça tourne
            grimoire.style.animation = "shake 0.5s infinite";
            
            // Arrêter le tremblement avant la fin
            setTimeout(() => { grimoire.style.animation = "none"; }, 5000);

            // Révélation
            setTimeout(() => {
                showResult(segments[winner]);
                triggerExplosion();
                btn.disabled = false;
                btn.innerText = "Invoquer la Sentence";
            }, 6000);
        });

        // --- INTERFACE DE RESULTAT ---
        const modal = document.getElementById("result-modal");
        const modalContent = document.getElementById("modal-content");
        const titleEl = document.getElementById("res-title");
        const descEl = document.getElementById("res-desc");

        function showResult(seg) {
            titleEl.innerText = seg.name;
            descEl.innerText = seg.effect;
            
            // Couleurs conditionnelles
            if(seg.type === "doom") titleEl.style.color = "#000"; 
            else if(seg.type === "good") titleEl.style.color = "#2ecc71";
            else titleEl.style.color = "#ff003c";

            modal.style.display = "flex";
            setTimeout(() => { modalContent.style.transform = "scale(1)"; }, 50);
        }

        function closeModal() {
            modalContent.style.transform = "scale(0.5)";
            setTimeout(() => { modal.style.display = "none"; }, 300);
        }

        // --- PARTICULES EXPLOSIVES (Canvas Overlay) ---
        // Création dynamique d'un canvas par dessus tout
        const pCanvas = document.createElement("canvas");
        pCanvas.style.position = "fixed";
        pCanvas.style.top = "0"; pCanvas.style.left = "0";
        pCanvas.style.width = "100%"; pCanvas.style.height = "100%";
        pCanvas.style.pointerEvents = "none";
        pCanvas.style.zIndex = "999";
        document.body.appendChild(pCanvas);
        const pCtx = pCanvas.getContext("2d");

        let particles = [];

        function triggerExplosion() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            for(let i=0; i<150; i++) {
                particles.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    life: 1,
                    color: `hsl(${Math.random()*60 + 10}, 100%, 50%)`, // Or/Feu
                    size: Math.random() * 8
                });
            }
            animateParticles();
        }

        function animateParticles() {
            pCtx.clearRect(0,0,pCanvas.width, pCanvas.height);
            let active = false;
            particles.forEach(p => {
                if(p.life > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // Gravité
                    p.life -= 0.02;
                    p.size *= 0.95;
                    
                    pCtx.globalAlpha = p.life;
                    pCtx.fillStyle = p.color;
                    pCtx.beginPath();
                    pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    pCtx.fill();
                }
            });
            if(active) requestAnimationFrame(animateParticles);
        }

    </script>
</body>
</html>

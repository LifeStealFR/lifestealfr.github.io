<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Call: Generate Luminous Element</title>
    
    <!-- Polices : Cinzel pour le côté Divin/Fantasy, Orbitron pour la Tech subtile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --god-gold: #ffd700;
            --god-gold-light: #fffec4;
            --god-glow: rgba(255, 215, 0, 0.6);
            --stacia-pink: #ffb7b2;
            --vector-red: #ff003c;
            --void-bg: #030005;
            --glass: rgba(20, 10, 30, 0.65);
        }

        body {
            background-color: var(--void-bg);
            color: #fff;
            font-family: 'Cinzel', serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* --- FOND COSMIQUE (WORLD END ALTAR) --- */
        .universe {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 120%, #2a0a3d 0%, #000000 70%);
            z-index: -3;
        }
        
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px);
            background-size: 550px 550px, 350px 350px;
            opacity: 0.6;
            animation: starMove 100s linear infinite;
        }

        /* Lignes de flux de données (Aurora) */
        .aurora {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, rgba(255, 0, 200, 0.05) 60deg, transparent 120deg, rgba(0, 200, 255, 0.05) 280deg, transparent 360deg);
            animation: rotateAurora 60s linear infinite;
            z-index: -2;
            filter: blur(50px);
        }

        @keyframes starMove { from { transform: translateY(0); } to { transform: translateY(-200px); } }
        @keyframes rotateAurora { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- INTERFACE PRINCIPALE --- */
        .interface-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Entrance */
            opacity: 0;
            animation: divineEntrance 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes divineEntrance {
            0% { opacity: 0; transform: scale(1.2) translateY(50px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .system-text {
            font-family: 'Rajdhani', sans-serif;
            color: var(--god-gold-light);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--god-glow);
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.5rem;
            margin: 0 0 40px 0;
            background: linear-gradient(to bottom, #fff, var(--god-gold));
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            position: relative;
        }
        
        h1::after {
            content: "";
            position: absolute;
            bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 150px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--god-gold), transparent);
            box-shadow: 0 0 10px var(--god-gold);
        }

        /* --- CERCLES MAGIQUES (Sacred Arts) --- */
        .sacred-circle-container {
            position: relative;
            width: 550px;
            height: 550px;
            display: flex;
            align-items: center; justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        /* Anneau Extérieur (Runes) */
        .ring-outer {
            width: 100%; height: 100%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: spinRight 60s linear infinite;
        }
        .ring-outer::before {
            content: "";
            position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px dashed rgba(255, 215, 0, 0.2);
            border-radius: 50%;
        }

        /* Anneau Médian (Complexe) */
        .ring-mid {
            width: 85%; height: 85%;
            border: 2px solid var(--god-gold);
            opacity: 0.4;
            animation: spinLeft 40s linear infinite;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
        }

        /* Anneau Intérieur (Focus) */
        .ring-inner {
            width: 65%; height: 65%;
            border: 1px solid var(--stacia-pink);
            box-shadow: 0 0 20px rgba(255, 183, 178, 0.2);
            animation: pulseRing 4s ease-in-out infinite;
        }

        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        @keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.02); opacity: 0.9; } }

        /* --- LE CANVAS (La Roue Divine) --- */
        canvas {
            position: relative;
            z-index: 5;
            width: 500px;
            height: 500px;
            /* Mode de fusion pour effet lumière */
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 10px var(--god-gold));
            transform-origin: center;
        }

        /* Pointeur (Épée Verticale) */
        .divine-pointer {
            position: absolute;
            top: -40px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 100px;
            background: #fff;
            z-index: 20;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--god-gold);
        }
        .divine-pointer::before {
            content: "▼";
            position: absolute; bottom: -10px; left: -7px;
            color: #fff; font-size: 14px;
            text-shadow: 0 0 10px var(--god-gold);
        }

        /* --- BOUTON RELEASE RECOLLECTION --- */
        .btn-release {
            margin-top: 50px;
            background: transparent;
            color: var(--god-gold);
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 5px;
            padding: 18px 60px;
            border: 1px solid var(--god-gold);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            text-shadow: 0 0 5px var(--god-gold);
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        /* Effet de remplissage lumière */
        .btn-release::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.4), transparent);
            transition: 0.5s;
        }

        .btn-release:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 30px var(--god-gold), inset 0 0 10px var(--god-gold);
            transform: scale(1.05);
        }
        .btn-release:hover::before { left: 100%; }

        .btn-release:disabled {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- FENETRE RESULTAT (Window Object Stacia) --- */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            align-items: center; justify-content: center;
        }

        .stacia-window {
            width: 500px;
            background: rgba(20, 15, 25, 0.9);
            border: 1px solid var(--god-gold);
            padding: 3px; /* Double border effect */
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            transform: scale(0.8);
            opacity: 0;
            animation: openWindow 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            position: relative;
        }

        .window-inner {
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 30px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(255,215,0,0.05), transparent);
        }

        @keyframes openWindow {
            to { transform: scale(1); opacity: 1; }
        }

        .win-header {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: var(--god-gold);
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .win-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2.5rem;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        
        .win-desc {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ddd;
            font-style: italic;
            margin-bottom: 30px;
        }

        .btn-accept {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px 40px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-accept:hover {
            background: #fff; color: #000;
            box-shadow: 0 0 20px #fff;
        }

        /* Warning Style (Vector Account) */
        .stacia-window.dark {
            border-color: var(--vector-red);
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.3);
        }
        .stacia-window.dark .window-inner {
            background: linear-gradient(to bottom, rgba(255, 0, 60, 0.1), transparent);
            border-color: rgba(255, 0, 60, 0.3);
        }
        .stacia-window.dark .win-title {
            color: var(--vector-red);
            text-shadow: 0 0 15px var(--vector-red);
        }
        .stacia-window.dark .win-header { color: var(--vector-red); }

        /* Canvas Particules */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="universe">
        <div class="stars"></div>
        <div class="aurora"></div>
    </div>

    <div class="interface-container" id="main-ui">
        <div class="system-text">System Call . . . Inspect Entire Command List</div>
        <h1>Divine Authority</h1>
        
        <div class="sacred-circle-container">
            <!-- Cercles Magiques -->
            <div class="ring ring-outer"></div>
            <div class="ring ring-mid"></div>
            <div class="ring ring-inner"></div>
            
            <div class="divine-pointer"></div>
            <canvas id="wheel" width="800" height="800"></canvas>
        </div>

        <button id="spin-btn" class="btn-release">ENHANCE ARMAMENT</button>
    </div>

    <!-- Fenêtre "Window Object" -->
    <div id="result-overlay">
        <div class="stacia-window" id="win-obj">
            <div class="window-inner">
                <div class="win-header">
                    <span>UNIT ID: ADMIN_001</span>
                    <span id="durability">DURABILITY: 100%</span>
                </div>
                
                <div class="win-title" id="res-title">TITLE</div>
                <div class="win-desc" id="res-desc">Description text...</div>
                
                <button class="btn-accept" onclick="closeModal()">DISCHARGE</button>
            </div>
        </div>
    </div>

    <canvas id="particles"></canvas>

    <script>
        // --- DONNÉES DU JUGEMENT (THEME ALICIZATION) ---
        // Types: 'light' (Stacia/Solus), 'dark' (Vector/Dark Territory), 'neutral' (Human Empire)
        const segments = [
            { name: "MAINTIEN", desc: "La Volonté reste inchangée.", weight: 12, color: "#aaddff", type: "neutral" },
            { name: "DURÉE x2", desc: "Fluctlight Acceleration: Punishment doubled.", weight: 5, color: "#ffaa00", type: "dark" },
            { name: "CRITICAL x4", desc: "Maximum Load. Sanction quadrupled.", weight: 3, color: "#ff003c", type: "dark" },
            { name: "ZONE LOCK", desc: "Spatial Barrier: Area restriction applied.", weight: 2, color: "#d4af37", type: "light" },
            { name: "SILENCE", desc: "Voice Command Module: Disabled.", weight: 1, color: "#b19cd9", type: "neutral" },
            { name: "DEMOTION", desc: "Authority Level Reduced.", weight: 1, color: "#777777", type: "neutral" },
            { name: "MERCY /2", desc: "Solus Blessing: Duration halved.", weight: 0.5, color: "#00ffaa", type: "light" },
            { name: "ABSOLUTION", desc: "Stacia Miracle: Sanction removed.", weight: 0.25, color: "#ffffff", type: "light" },
            { name: "BANISHMENT", desc: "System Alert: Account deletion (Permanent).", weight: 0.25, color: "#000000", type: "dark" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const totalWeight = segments.reduce((sum, s) => sum + s.weight, 0);
        let currentRotation = 0;

        // --- DESSIN DU CERCLE DIVIN ---
        function drawWheel() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 40; // Rayon
            let start = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            segments.forEach((seg) => {
                const angle = (seg.weight / totalWeight) * 2 * Math.PI;
                const end = start + angle;

                // 1. Les Segments (Effet faisceau de lumière)
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();

                // Dégradé radial complexe (Centre brillant -> Couleur -> Transparent)
                let grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, r);
                if (seg.color === "#000000") {
                    grad.addColorStop(0, "#333");
                    grad.addColorStop(0.8, "#000");
                    grad.addColorStop(1, "rgba(0,0,0,0.8)");
                } else {
                    grad.addColorStop(0, "rgba(255,255,255,0.1)"); // Centre clair
                    grad.addColorStop(0.6, seg.color); // Couleur principale
                    grad.addColorStop(1, adjustAlpha(seg.color, 0.4)); // Bordure semi-transparente
                }

                ctx.fillStyle = grad;
                ctx.fill();

                // 2. Lignes de séparation (Filigranes dorés fins)
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                let x = cx + Math.cos(end) * (r + 10);
                let y = cy + Math.sin(end) * (r + 10);
                ctx.lineTo(x, y);
                ctx.strokeStyle = "rgba(255, 215, 0, 0.4)";
                ctx.lineWidth = 1;
                ctx.stroke();

                // 3. Texte (Arts Sacrés)
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + angle / 2);
                ctx.textAlign = "right";
                
                // Effet de brillance texte
                ctx.shadowColor = seg.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = "#fff";
                
                // Adaptation police
                let fontSize = seg.weight < 1 ? 20 : 28;
                ctx.font = `600 ${fontSize}px 'Cinzel'`;
                
                let label = seg.weight <= 0.25 ? "Ω" : seg.name; // Omega pour les très petits
                ctx.fillText(label, r - 30, 8);
                
                ctx.restore();
                start += angle;
            });

            // Centre (Source de lumière / Light Cube)
            ctx.beginPath();
            ctx.arc(cx, cy, 50, 0, Math.PI * 2);
            let coreGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 50);
            coreGrad.addColorStop(0, "#fff");
            coreGrad.addColorStop(0.5, "#ffd700");
            coreGrad.addColorStop(1, "rgba(255, 215, 0, 0)");
            ctx.fillStyle = coreGrad;
            ctx.fill();
        }

        function adjustAlpha(color, opacity) {
            // Fonction simple pour ajouter alpha à un hex (approximatif pour demo)
            return color; 
        }

        drawWheel();

        // --- ANIMATION "RELEASE RECOLLECTION" ---
        const btn = document.getElementById("spin-btn");
        const uiContainer = document.getElementById("main-ui");
        const winEl = document.getElementById("win-obj");
        const overlay = document.getElementById("result-overlay");

        btn.addEventListener("click", () => {
            btn.disabled = true;
            btn.innerHTML = "GENERATING...";
            
            // Logique de sélection
            let rand = Math.random() * totalWeight;
            let sum = 0, winner = 0;
            for(let i=0; i<segments.length; i++) {
                sum += segments[i].weight;
                if(rand <= sum) { winner = i; break; }
            }

            // Calcul angles
            let startDeg = 0;
            for(let i=0; i<winner; i++) startDeg += (segments[i].weight/totalWeight)*360;
            let sliceDeg = (segments[winner].weight/totalWeight)*360;
            let target = startDeg + sliceDeg / 2;
            let rng = (Math.random() - 0.5) * (sliceDeg * 0.5); // Randomisation légère
            
            // Rotation (Viser 270°)
            let spins = 6; 
            let finalRot = currentRotation + (360 * spins) + (270 - (target + rng) - (currentRotation % 360));
            // Correction pour éviter recul
            if(finalRot < currentRotation) finalRot += 360;

            // Lancement Animation CSS
            canvas.style.transition = "transform 6s cubic-bezier(0.1, 0.9, 0.3, 1)"; // Courbe "Heavy"
            canvas.style.transform = `rotate(${finalRot}deg)`;
            currentRotation = finalRot;

            // Effet visuel pendant le spin (Cercles accélèrent)
            document.querySelector('.ring-outer').style.animationDuration = "2s";
            document.querySelector('.ring-mid').style.animationDuration = "2s";
            
            // Shake screen
            uiContainer.style.animation = "shake 0.5s ease-in-out infinite";

            setTimeout(() => {
                // Arrêt
                uiContainer.style.animation = "";
                document.querySelector('.ring-outer').style.animationDuration = "60s";
                document.querySelector('.ring-mid').style.animationDuration = "40s";
                
                showResult(segments[winner]);
                explodeParticles(segments[winner].color, segments[winner].type);

                btn.disabled = false;
                btn.innerHTML = "ENHANCE ARMAMENT";
            }, 6000);
        });

        // --- FENETRE DE RESULTAT ---
        function showResult(seg) {
            winEl.className = "stacia-window"; // Reset
            if(seg.type === 'dark') winEl.classList.add('dark');

            document.getElementById("res-title").innerText = seg.name;
            document.getElementById("res-desc").innerText = seg.desc;
            
            // Fluctlight ID random
            document.getElementById("durability").innerText = "LIFE: " + Math.floor(Math.random() * 100000) + "/" + Math.floor(Math.random() * 100000);
            
            overlay.style.display = "flex";
        }

        function closeModal() {
            overlay.style.display = "none";
        }

        // --- PARTICULES (Memory Fragments) ---
        const pCanvas = document.getElementById("particles");
        const pCtx = pCanvas.getContext("2d");
        
        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.onresize = resizeP;
        resizeP();

        let particles = [];

        function explodeParticles(color, type) {
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const count = 100;
            
            for(let i=0; i<count; i++) {
                particles.push({
                    x: cx, y: cy,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 6 + 2,
                    type: type // 'dark' ou 'light'
                });
            }
            loopParticles();
        }

        function loopParticles() {
            pCtx.clearRect(0,0,pCanvas.width, pCanvas.height);
            let active = false;

            particles.forEach(p => {
                if(p.life > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.96; // Air resistance
                    p.vy *= 0.96;
                    p.life -= 0.015;

                    pCtx.save();
                    pCtx.globalAlpha = p.life;
                    pCtx.fillStyle = p.color;
                    pCtx.translate(p.x, p.y);
                    
                    // Formes : Carrés (Dark) vs Éclats (Light)
                    if(p.type === 'dark') {
                        // Glitch cubes
                        pCtx.fillRect(-p.size, -p.size, p.size*2, p.size*2);
                    } else {
                        // Diamond shape (Stacia style)
                        pCtx.beginPath();
                        pCtx.rotate(Math.PI / 4);
                        pCtx.rect(-p.size/2, -p.size/2, p.size, p.size);
                        pCtx.fill();
                    }
                    
                    pCtx.restore();
                }
            });

            if(active) requestAnimationFrame(loopParticles);
        }

        /* Animation Shake CSS */
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shake {
                0% { transform: translate(1px, 1px) rotate(0deg); }
                10% { transform: translate(-1px, -2px) rotate(-1deg); }
                20% { transform: translate(-3px, 0px) rotate(1deg); }
                30% { transform: translate(3px, 2px) rotate(0deg); }
                40% { transform: translate(1px, -1px) rotate(1deg); }
                50% { transform: translate(-1px, 2px) rotate(-1deg); }
                60% { transform: translate(-3px, 1px) rotate(0deg); }
                70% { transform: translate(3px, 1px) rotate(-1deg); }
                80% { transform: translate(-1px, -1px) rotate(1deg); }
                90% { transform: translate(1px, 2px) rotate(0deg); }
                100% { transform: translate(1px, -2px) rotate(-1deg); }
            }
        `;
        document.head.appendChild(styleSheet);

    </script>
</body>
</html>

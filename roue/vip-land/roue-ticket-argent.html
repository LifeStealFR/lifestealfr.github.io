<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP-Land | Star Stage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --ai-pink: #ff0080;
            --aqua-blue: #00ffff;
            --deep-purple: #1a0b2e;
            --gold: #ffd700;
            --glow: 0 0 10px var(--ai-pink), 0 0 20px var(--ai-pink);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #2e1045 0%, #05000a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Effet d'étoiles en arrière-plan (CSS pur) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px, 100px 100px;
            background-position: 0 0, 25px 25px;
            opacity: 0.1;
            z-index: -1;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            margin-bottom: 5px;
            background: linear-gradient(to right, var(--ai-pink), var(--aqua-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 128, 0.5);
            font-weight: 900;
            letter-spacing: -2px;
            text-align: center;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Conteneur Roue */
        .stage-container {
            position: relative;
            padding: 15px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--ai-pink), var(--deep-purple), var(--aqua-blue), var(--deep-purple), var(--ai-pink));
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.4);
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .wheel-container {
            position: relative;
            width: 380px;
            height: 380px;
            background: #000;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Pointeur Étoile (Star Eye) */
        #star-pointer {
            position: absolute;
            top: 50%;
            right: -40px;
            transform: translateY(-50%);
            font-size: 60px;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold), 0 0 30px orange;
            z-index: 20;
            filter: drop-shadow(-5px 0 5px rgba(0,0,0,0.8));
        }

        /* Centre Roue */
        .center-eye {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: radial-gradient(circle, #fff 10%, var(--ai-pink) 60%, var(--deep-purple) 100%);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 20px var(--ai-pink);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .center-eye::after {
            content: "★";
            color: white;
            font-size: 30px;
        }

        /* Bouton */
        button {
            margin-top: 40px;
            padding: 15px 60px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
            background: linear-gradient(45deg, var(--ai-pink), #ff6b6b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 0, 128, 1);
        }

        button:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* TABLEAU DES PROBABILITES */
        .stats-container {
            margin-top: 50px;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .stats-container h3 {
            text-align: center;
            color: var(--aqua-blue);
            margin-top: 0;
            text-transform: uppercase;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .stats-table th, .stats-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stats-table td.percent {
            text-align: right;
            font-family: monospace;
            color: var(--gold);
        }

        .disclaimer {
            font-size: 0.7rem;
            color: #666;
            margin-top: 20px;
            text-align: center;
        }

        /* Modal */
        #result-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        #result-modal.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: #1a0b2e;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--ai-pink);
            box-shadow: 0 0 100px var(--ai-pink);
            transform: scale(0.8); transition: transform 0.3s;
            max-width: 90%;
        }
        #result-modal.active .modal-content { transform: scale(1); }

        .modal-amount {
            font-size: 3rem;
            font-weight: 900;
            margin: 20px 0;
            color: white;
            text-shadow: 0 0 20px var(--gold);
        }

        @media (max-width: 500px) {
            .wheel-container { width: 300px; height: 300px; }
            h1 { font-size: 2rem; }
            .stage-container { padding: 10px; }
        }
    </style>
</head>
<body>

    <h1>VIP-Land</h1>
    <div class="subtitle">✧ Oshi no Ko Edition ✧</div>

    <div class="stage-container">
        <div class="wheel-container">
            <canvas id="wheel" width="500" height="500"></canvas>
            <div class="center-eye"></div>
        </div>
        <!-- Pointeur étoile -->
        <div id="star-pointer">★</div>
    </div>

    <button id="spin-btn">✦ LANCER LA ROUE ✦</button>

    <div class="stats-container">
        <h3>Taux de Drop (Probabilités)</h3>
        <table class="stats-table" id="probs-table">
            <!-- Rempli par JS -->
        </table>
        <div class="disclaimer">
            Argent fictif (DraftBot) uniquement. <br>
            Les probabilités sont réelles et automatiques.
        </div>
    </div>

    <!-- Modal Résultat -->
    <div id="result-modal">
        <div class="modal-content">
            <h2 id="result-title" style="color:var(--aqua-blue); text-transform:uppercase;">Résultat</h2>
            <div class="modal-amount" id="result-amount">...</div>
            <p id="result-message" style="color:#ccc;">...</p>
            <button onclick="closeModal()" style="margin-top:20px; padding:10px 30px; font-size:1rem; cursor:pointer; background:var(--ai-pink); color:white; border:none; border-radius:5px;">Fermer</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const modal = document.getElementById('result-modal');
        const tableBody = document.getElementById('probs-table');

        // --- CONFIGURATION BALANCÉE (70% PERDANT) ---
        // Poids gagnants totaux : 1 + 5 + 10 + 25 + 60 + 150 = 251 points
        // Poids perdants totaux : 100 * 6 cases = 600 points
        // Total = 851 points
        // % Perte = 600/851 = 70.5%
        
        const segments = [
            { text: "80k", color: "#ffd700", type: "win", message: "JACKPOT ABSOLU !!", weight: 1 }, 
            { text: "Perdu", color: "#240046", type: "lose", message: "Dommage...", weight: 100 },
            { text: "40k", color: "#ff0080", type: "win", message: "Incroyable !", weight: 5 }, 
            { text: "Perdu", color: "#3a0ca3", type: "lose", message: "Rien...", weight: 100 },
            { text: "20k", color: "#00ffff", type: "win", message: "Super gain !", weight: 10 }, 
            { text: "Perdu", color: "#240046", type: "lose", message: "Aïe...", weight: 100 },
            { text: "10k", color: "#4cc9f0", type: "win", message: "Joli !", weight: 25 }, 
            { text: "Perdu", color: "#3a0ca3", type: "lose", message: "Pas de chance.", weight: 100 },
            { text: "5k", color: "#f72585", type: "win", message: "C'est cool.", weight: 60 }, 
            { text: "Perdu", color: "#240046", type: "lose", message: "Perdu...", weight: 100 },
            { text: "1k", color: "#7209b7", type: "win", message: "Un début.", weight: 150 }, 
            { text: "Perdu", color: "#3a0ca3", type: "lose", message: "Essaie encore.", weight: 100 }
        ];

        const totalSegments = segments.length;
        const arc = (2 * Math.PI) / totalSegments;
        let isSpinning = false;

        // --- 1. Génération du Tableau des Probabilités ---
        function generateProbabilities() {
            const totalWeight = segments.reduce((acc, seg) => acc + seg.weight, 0);
            const groups = {};
            
            segments.forEach(seg => {
                if (!groups[seg.text]) {
                    groups[seg.text] = { weight: 0, color: seg.color, isWin: seg.type === 'win' };
                }
                groups[seg.text].weight += seg.weight;
            });

            const sortedStats = Object.keys(groups).map(key => {
                const percent = (groups[key].weight / totalWeight) * 100;
                let percentDisplay = percent < 0.01 ? "< 0.01%" : percent.toFixed(1) + "%";
                return { 
                    name: key, 
                    percent: percentDisplay, 
                    rawPercent: percent,
                    color: groups[key].color,
                    isWin: groups[key].isWin
                };
            }).sort((a, b) => {
                if (a.name === "Perdu") return 1; 
                if (b.name === "Perdu") return -1;
                return a.rawPercent - b.rawPercent;
            });

            sortedStats.forEach(stat => {
                const tr = document.createElement('tr');
                const colorStyle = stat.isWin ? `color: ${stat.color}; text-shadow: 0 0 5px ${stat.color}` : `color: #888`;
                const nameDisplay = stat.name === "Perdu" ? "RIEN (PERDU)" : `MONNAIE : ${stat.name}`;
                
                tr.innerHTML = `
                    <td style="${colorStyle}; font-weight:bold;">${nameDisplay}</td>
                    <td class="percent">${stat.percent}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // --- 2. Dessiner la Roue ---
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const initialOffset = -arc / 2;

            segments.forEach((segment, i) => {
                const angle = i * arc + initialOffset;
                
                ctx.beginPath();
                ctx.fillStyle = segment.color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                
                ctx.strokeStyle = "rgba(0,0,0,0.2)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = segment.type === 'win' ? "#fff" : "rgba(255,255,255,0.3)";
                ctx.font = segment.type === 'win' ? "bold 22px Montserrat" : "16px Montserrat";
                
                if (segment.type === 'win') {
                    ctx.shadowColor = segment.color;
                    ctx.shadowBlur = 10;
                }
                
                ctx.fillText(segment.text, radius - 30, 8);
                ctx.restore();
            });
        }

        // --- 3. Logique de Jeu ---
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            const totalWeight = segments.reduce((acc, seg) => acc + seg.weight, 0);
            let random = Math.random() * totalWeight;
            let winningIndex = 0;
            
            for (let i = 0; i < segments.length; i++) {
                if (random < segments[i].weight) {
                    winningIndex = i;
                    break;
                }
                random -= segments[i].weight;
            }

            const randomOffset = (Math.random() - 0.5) * (arc * 0.8);
            const segmentAngle = winningIndex * arc;
            const targetRotation = (360 - (segmentAngle * 180 / Math.PI)) + (randomOffset * 180 / Math.PI);
            
            const spins = (8 + Math.floor(Math.random() * 4)) * 360;
            const finalDeg = spins + targetRotation;

            canvas.style.transition = "transform 8s cubic-bezier(0.1, 1, 0.3, 1)";
            canvas.style.transform = `rotate(${finalDeg}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                showResult(segments[winningIndex]);
                
                canvas.style.transition = "none";
                canvas.style.transform = `rotate(${finalDeg % 360}deg)`;
            }, 8000);
        }

        function showResult(winner) {
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            const msg = document.getElementById('result-message');

            if (winner.type === 'win') {
                title.innerText = "FÉLICITATIONS !";
                title.style.color = winner.color;
                amount.innerText = winner.text;
                amount.style.color = winner.color;
                amount.style.textShadow = `0 0 30px ${winner.color}`;
                msg.innerText = winner.message;
            } else {
                title.innerText = "DOMMAGE...";
                title.style.color = "#ccc";
                amount.innerText = "PERDU";
                amount.style.color = "#555";
                amount.style.textShadow = "none";
                msg.innerText = winner.message;
            }

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        drawWheel();
        generateProbabilities();
        canvas.style.transform = `rotate(${arc/2 * 180/Math.PI}deg)`;
        
        spinBtn.addEventListener('click', spin);

    </script>
</body>
</html>

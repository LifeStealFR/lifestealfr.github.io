<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP-Land | Eye of Idol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --idol-pink: #fa0081;
            --idol-purple: #3a0ca3;
            --idol-dark: #10002b;
            --idol-light: #ff99c8;
            --eye-glow: 0 0 20px rgba(250, 0, 129, 0.6);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050010;
            background-image: 
                radial-gradient(circle at 20% 30%, #240046 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #480ca8 0%, transparent 40%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Particules d'étoiles en fond */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: 
                radial-gradient(white 1px, transparent 1px) 0 0 / 50px 50px,
                radial-gradient(rgba(255,255,255,0.5) 2px, transparent 2px) 25px 25px / 100px 100px;
            animation: twinkle 10s linear infinite;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--idol-pink);
            background: linear-gradient(to bottom, #fff, var(--idol-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            z-index: 2;
        }

        /* --- L'OEIL (La Roue) --- */
        .eye-container {
            position: relative;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            /* L'anneau sombre autour de l'iris */
            background: #000;
            padding: 8px; 
            box-shadow: 
                0 0 0 2px #3a0ca3,
                0 0 30px var(--idol-pink),
                inset 0 0 20px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Reflet brillant sur l'œil (Glossy effect) */
        .eye-container::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 30px;
            height: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: rotate(-45deg);
            z-index: 20;
            filter: blur(2px);
            pointer-events: none;
        }
        .eye-container::before {
            content: '';
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 20;
            filter: blur(1px);
            pointer-events: none;
        }

        .wheel-canvas {
            border-radius: 50%;
            box-shadow: inset 0 0 30px #000; /* Profondeur de l'iris */
        }

        /* --- LA PUPILLE (L'étoile blanche) --- */
        .pupil-star {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: white;
            /* Forme d'étoile à 6 branches style Ai */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 15;
            box-shadow: 0 0 20px white;
            filter: drop-shadow(0 0 10px var(--idol-pink));
        }
        
        /* Petit cercle sombre au centre de l'étoile pour le réalisme */
        .pupil-star::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: #1a0b2e;
            border-radius: 50%;
            opacity: 0.3;
        }

        /* Le Pointeur (Cils supérieurs) */
        .lash-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 40px solid #fff;
            filter: drop-shadow(0 0 10px var(--idol-pink));
            z-index: 25;
        }

        button {
            margin-top: 40px;
            padding: 15px 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #000;
            background: white;
            border: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            z-index: 10;
        }

        button:hover {
            background: var(--idol-pink);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--idol-pink);
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        /* TABLEAU */
        .stats-container {
            margin-top: 30px;
            width: 90%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--idol-purple);
            border-radius: 10px;
            padding: 15px;
            z-index: 2;
        }
        
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .stats-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .percent-val {
            text-align: right;
            font-family: monospace;
            color: var(--idol-light);
        }

        /* MODAL */
        #result-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
            backdrop-filter: blur(5px);
        }
        #result-modal.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: linear-gradient(135deg, #240046, #000);
            padding: 40px;
            border-radius: 0;
            text-align: center;
            border: 1px solid var(--idol-pink);
            box-shadow: 0 0 50px var(--idol-pink);
            max-width: 90%;
            width: 300px;
            transform: scale(0.8); transition: transform 0.3s;
        }
        #result-modal.active .modal-content { transform: scale(1); }
        
        .close-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid white;
            color: white;
            clip-path: none;
        }
        .close-btn:hover { background: white; color: black; }

        @media (max-width: 500px) {
            .eye-container { width: 300px; height: 300px; }
            .pupil-star { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <h1>VIP-Land</h1>

    <div class="eye-container">
        <!-- Pointeur en haut (Cil) -->
        <div class="lash-pointer"></div>
        
        <!-- Le Canvas (Iris) -->
        <canvas id="wheel" width="420" height="420" class="wheel-canvas"></canvas>
        
        <!-- La Pupille (Étoile Statique) -->
        <div class="pupil-star"></div>
    </div>

    <button id="spin-btn">UTILISER 1 TICKET</button>

    <div class="stats-container">
        <table class="stats-table" id="probs-table"></table>
        <div style="text-align:center; font-size:0.6rem; color:#666; margin-top:10px;">
            Système RNG certifié. Monnaie DraftBot.
        </div>
    </div>

    <!-- Modal Résultat -->
    <div id="result-modal">
        <div class="modal-content">
            <h2 id="result-title" style="margin:0; color:white; font-size:1.5rem;">RÉSULTAT</h2>
            <div id="result-amount" style="font-size:2.5rem; font-weight:900; margin:15px 0; color:var(--idol-pink); text-shadow:0 0 10px var(--idol-pink);">...</div>
            <p id="result-message" style="font-size:0.9rem; color:#ccc;">...</p>
            <button class="close-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const modal = document.getElementById('result-modal');
        const tableBody = document.getElementById('probs-table');

        // --- CONFIGURATION 50% GAGNANT / 50% PERDANT ---
        // Pour équilibrer à 50/50, la somme des poids "Win" doit être égale à la somme des poids "Lose".
        // Total Win Weight: 1 + 5 + 10 + 25 + 50 + 100 = 191
        // Il y a 6 slots "Perdu". Donc 191 / 6 = 31.83.
        // On arrondit à 32 pour les Perdus.
        // Total Win: 191 | Total Lose: 32*6 = 192.
        // Ratio quasi parfait 50/50.

        const segments = [
            { text: "80k", color: "#FFD700", type: "win", message: "JACKPOT ABSOLU !!", weight: 1 }, 
            { text: "Perdu", color: "#240046", type: "lose", message: "Pas cette fois.", weight: 32 },
            { text: "40k", color: "#FF0080", type: "win", message: "Gros gain !", weight: 5 }, 
            { text: "Perdu", color: "#3C096C", type: "lose", message: "Rien...", weight: 32 },
            { text: "20k", color: "#00FFFF", type: "win", message: "Super !", weight: 10 }, 
            { text: "Perdu", color: "#240046", type: "lose", message: "Aïe...", weight: 32 },
            { text: "10k", color: "#7209B7", type: "win", message: "Sympa !", weight: 25 }, 
            { text: "Perdu", color: "#3C096C", type: "lose", message: "Dommage.", weight: 32 },
            { text: "5k", color: "#B5179E", type: "win", message: "C'est cool.", weight: 50 }, 
            { text: "Perdu", color: "#240046", type: "lose", message: "Perdu...", weight: 32 },
            { text: "1k", color: "#480CA8", type: "win", message: "Un début.", weight: 100 }, 
            { text: "Perdu", color: "#3C096C", type: "lose", message: "Retente.", weight: 32 }
        ];

        const totalSegments = segments.length;
        const arc = (2 * Math.PI) / totalSegments;
        let isSpinning = false;

        // --- 1. Générer le tableau des pourcentages ---
        function generateProbabilities() {
            const totalWeight = segments.reduce((acc, seg) => acc + seg.weight, 0);
            const groups = {};
            
            segments.forEach(seg => {
                if (!groups[seg.text]) {
                    groups[seg.text] = { weight: 0, color: seg.color, isWin: seg.type === 'win' };
                }
                groups[seg.text].weight += seg.weight;
            });

            const sortedStats = Object.keys(groups).map(key => {
                const percent = (groups[key].weight / totalWeight) * 100;
                let percentDisplay = percent < 0.1 ? "< 0.5%" : percent.toFixed(1) + "%";
                return { 
                    name: key, 
                    percent: percentDisplay, 
                    rawPercent: percent,
                    color: groups[key].color,
                    isWin: groups[key].isWin
                };
            }).sort((a, b) => {
                if (a.name === "Perdu") return 1; 
                if (b.name === "Perdu") return -1;
                return a.rawPercent - b.rawPercent;
            });

            sortedStats.forEach(stat => {
                const tr = document.createElement('tr');
                const nameDisplay = stat.name === "Perdu" ? "RIEN (PERDU)" : `${stat.name}`;
                const colorStyle = stat.isWin ? `color: ${stat.color}; text-shadow:0 0 5px ${stat.color};` : `color: #aaa;`;
                
                tr.innerHTML = `
                    <td style="${colorStyle} font-weight:bold;">${nameDisplay}</td>
                    <td class="percent-val">${stat.percent}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // --- 2. Dessiner l'Iris (Roue) ---
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            
            // On décale de -90deg (-PI/2) pour que l'index 0 soit en haut (sous le pointeur lash-pointer)
            const initialOffset = -Math.PI / 2 - (arc/2);

            segments.forEach((segment, i) => {
                const angle = i * arc + initialOffset;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                
                // Dégradé radial pour faire effet "Oeil" (plus sombre au centre, plus clair au bord)
                const gradient = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, radius);
                if(segment.type === 'lose') {
                    gradient.addColorStop(0, "#10002b");
                    gradient.addColorStop(1, segment.color);
                } else {
                    gradient.addColorStop(0, segment.color); // Centre vibrant
                    gradient.addColorStop(1, "#1a0b2e"); // Bords fondus
                }
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Séparateurs fins
                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = 1;
                ctx.stroke();

                // Texte
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 18px Montserrat";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 4;
                // On met le texte un peu plus loin du bord pour laisser la place aux effets
                ctx.fillText(segment.text, radius - 20, 5);
                ctx.restore();
            });
        }

        // --- 3. Animation ---
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            const totalWeight = segments.reduce((acc, seg) => acc + seg.weight, 0);
            let random = Math.random() * totalWeight;
            let winningIndex = 0;
            
            for (let i = 0; i < segments.length; i++) {
                if (random < segments[i].weight) {
                    winningIndex = i;
                    break;
                }
                random -= segments[i].weight;
            }

            // Calcul angle
            // Pointeur en HAUT (CSS rotate part de droite, mais on a décalé le dessin).
            // Le calcul doit viser le segment pour qu'il arrive à -90deg (Midi).
            
            const randomOffset = (Math.random() - 0.5) * (arc * 0.7);
            const segmentAngle = winningIndex * arc;
            
            // Rotation cible (Sens horaire)
            // Pour amener l'index i en haut :
            // Angle actuel de i = i * arc. On veut qu'il soit à 0 (relativement au start).
            // Donc on tourne de - (i * arc).
            
            const targetRotation = (360 - (segmentAngle * 180 / Math.PI)) + (randomOffset * 180 / Math.PI);
            const spins = (6 + Math.floor(Math.random() * 4)) * 360; // 6 à 10 tours
            const finalDeg = spins + targetRotation;

            canvas.style.transition = "transform 6s cubic-bezier(0.1, 0.9, 0.3, 1)";
            canvas.style.transform = `rotate(${finalDeg}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                showResult(segments[winningIndex]);
                
                canvas.style.transition = "none";
                canvas.style.transform = `rotate(${finalDeg % 360}deg)`;
            }, 6000);
        }

        function showResult(winner) {
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            const msg = document.getElementById('result-message');

            if (winner.type === 'win') {
                title.innerText = "FÉLICITATIONS !";
                amount.innerText = winner.text;
                amount.style.color = winner.color;
                amount.style.textShadow = `0 0 20px ${winner.color}`;
                msg.innerText = winner.message;
            } else {
                title.innerText = "DOMMAGE...";
                amount.innerText = "PERDU";
                amount.style.color = "#888";
                amount.style.textShadow = "none";
                msg.innerText = winner.message;
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Init
        drawWheel();
        generateProbabilities();
        spinBtn.addEventListener('click', spin);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue VIP-Land - Hard Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #2c2f33;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
        }

        .subtitle {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #99aab5;
        }

        .wheel-wrapper {
            position: relative;
            padding: 10px;
            background: #23272a;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #pointer {
            position: absolute;
            top: 50%;
            right: -25px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 35px solid #fff;
            filter: drop-shadow(-2px 0 2px rgba(0,0,0,0.5));
            z-index: 10;
        }

        /* Centre de la roue (décoratif) */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #f1c40f;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #23272a;
        }

        button {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #f1c40f, #d4ac0d);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: #2c2f33;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.6);
        }

        button:disabled {
            background: #72767d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: #586069;
            max-width: 400px;
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Modal Resultat */
        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #result-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #23272a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #f1c40f;
            width: 300px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        #result-modal.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            background: #7289da;
            color: white;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }

        @media (max-width: 500px) {
            .wheel-container { width: 300px; height: 300px; }
            button { font-size: 1rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <h1>VIP-Land</h1>
    <div class="subtitle">Tente ta chance... si tu l'oses.</div>

    <div class="wheel-wrapper">
        <div class="wheel-container">
            <canvas id="wheel" width="500" height="500"></canvas>
            <div class="center-circle">VIP</div>
            <div id="pointer"></div>
        </div>
    </div>

    <button id="spin-btn">LANCER (1 TICKET)</button>
    
    <div class="disclaimer">
        Système certifié VIP-Land. <br>
        Les gains sont crédités en monnaie serveur (DraftBot). <br>
        Les probabilités sont ajustées pour la rareté des gros lots.
    </div>

    <!-- Modal Résultat -->
    <div id="result-modal">
        <div class="modal-content">
            <h2 id="result-title" style="margin-top:0; color:#f1c40f">...</h2>
            <p id="result-message" style="font-size:1.2rem; margin:15px 0;">...</p>
            <button class="close-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const modal = document.getElementById('result-modal');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');

        // --- CONFIGURATION DES LOTS ET DES PROBABILITÉS ---
        // weight = poids. Plus le chiffre est haut, plus on a de chance de tomber dessus.
        // Total "Perdu" weight = 400 + 400 + 400 + 400 + 400 = 2000
        // Total "Win" weight = 1 + 5 + 10 + 20 + 50 + 100 = 186
        // Chance de gagner = environ 8.5%
        // Chance de perdre = environ 91.5%
        
        const segments = [
            { text: "80k", color: "#FFD700", type: "win", message: "JACKPOT ! Tu remportes 80 000 !", weight: 1 }, // Ultra Rare
            { text: "Perdu", color: "#e74c3c", type: "lose", message: "Rien pour cette fois.", weight: 400 },
            { text: "40k", color: "#9b59b6", type: "win", message: "Incroyable ! 40 000 pour toi !", weight: 5 }, // Très Rare
            { text: "Perdu", color: "#c0392b", type: "lose", message: "Pas de chance...", weight: 400 },
            { text: "20k", color: "#3498db", type: "win", message: "Super ! Tu gagnes 20 000 !", weight: 10 }, // Rare
            { text: "Perdu", color: "#e74c3c", type: "lose", message: "Essaie encore !", weight: 400 },
            { text: "10k", color: "#2ecc71", type: "win", message: "Joli ! 10 000 dans la poche.", weight: 20 }, // Peu commun
            { text: "Perdu", color: "#c0392b", type: "lose", message: "Dommage...", weight: 400 },
            { text: "5k", color: "#1abc9c", type: "win", message: "C'est cool, tu gagnes 5 000.", weight: 50 }, // Commun
            { text: "Perdu", color: "#e74c3c", type: "lose", message: "Perdu !", weight: 400 },
            { text: "1k", color: "#95a5a6", type: "win", message: "Un petit lot de 1 000.", weight: 100 }, // Très commun
            { text: "Perdu", color: "#c0392b", type: "lose", message: "Retente ta chance.", weight: 400 }
        ];

        const totalSegments = segments.length;
        const arc = (2 * Math.PI) / totalSegments;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            // Rotation initiale pour que le pointeur (à droite) soit aligné au milieu d'un segment
            // Sans ça, le pointeur est entre deux segments au démarrage
            const initialOffset = -arc / 2;

            segments.forEach((segment, i) => {
                const angle = i * arc + initialOffset;
                
                ctx.beginPath();
                ctx.fillStyle = segment.color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.stroke();

                // Texte
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px Poppins";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.fillText(segment.text, radius - 30, 8);
                ctx.restore();
            });
        }

        // Algorithme de sélection pondérée (Weighted Random)
        function getWinningSegmentIndex() {
            let totalWeight = segments.reduce((sum, seg) => sum + seg.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < segments.length; i++) {
                if (randomNum < segments[i].weight) {
                    return i;
                }
                randomNum -= segments[i].weight;
            }
            return 0; // Fallback
        }

        function rotateWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            // 1. Déterminer le gagnant MAINTENANT grâce aux poids
            const winningIndex = getWinningSegmentIndex();
            
            // 2. Calculer l'angle pour atterrir sur ce segment
            // Le pointeur est à 0° (droite du cercle trigonométrique)
            // L'angle du segment i est : i * arc
            // Pour que le segment i soit à 0°, il faut tourner de : - (i * arc)
            
            // Ajout d'un peu d'aléatoire DANS le segment pour pas que ça tombe toujours au milieu
            const randomOffsetInSegment = (Math.random() - 0.5) * (arc * 0.8); 
            
            const segmentAngle = winningIndex * arc;
            const targetAngle = (360 - (segmentAngle * 180 / Math.PI)) + (randomOffsetInSegment * 180 / Math.PI);
            
            // Ajouter beaucoup de tours (5 à 10 tours)
            const fullSpins = (5 + Math.floor(Math.random() * 5)) * 360;
            const finalRotation = fullSpins + targetAngle;

            // Appliquer la rotation via CSS
            canvas.style.transition = `transform 6s cubic-bezier(0.1, 0.95, 0.2, 1)`; // Effet de freinage réaliste
            canvas.style.transform = `rotate(${finalRotation}deg)`;

            // Attendre la fin de l'animation
            setTimeout(() => {
                showResult(segments[winningIndex]);
                isSpinning = false;
                spinBtn.disabled = false;
                
                // Reset silencieux (optionnel, ici on laisse la roue telle quelle)
                // Pour une vraie roue infinie, on gérerait le modulo 360 ici
                canvas.style.transition = 'none';
                const actualPos = finalRotation % 360;
                canvas.style.transform = `rotate(${actualPos}deg)`;
                
            }, 6000);
        }

        function showResult(winner) {
            resultTitle.innerText = winner.type === 'win' ? "GAGNÉ !" : "PERDU";
            resultTitle.style.color = winner.type === 'win' ? "#f1c40f" : "#e74c3c";
            resultMessage.innerText = winner.message;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Démarrage
        // On dessine la roue
        drawWheel();
        
        // On pré-tourne le canvas pour que la ligne de séparation ne soit pas pile sous le pointeur au début
        // (Juste esthétique)
        canvas.style.transform = `rotate(${arc/2 * 180/Math.PI}deg)`;

        spinBtn.addEventListener('click', rotateWheel);

    </script>
</body>
</html>

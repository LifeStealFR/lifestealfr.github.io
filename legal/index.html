<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStealFR - Documentation Légale</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0d0d10; --panel: #15151a; --primary: #3498db; --text: #a0a0a8; --text-light: #ffffff; --border: #222228; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar avec Arborescence */
        nav { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .nav-header { padding: 25px; border-bottom: 1px solid var(--border); text-align: center; }
        .nav-header h1 { font-size: 1em; color: white; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        
        #tree-container { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.9em; }
        ul { list-style: none; padding-left: 15px; margin: 5px 0; }
        
        /* Style des dossiers et fichiers */
        .folder { cursor: pointer; padding: 6px 10px; border-radius: 4px; display: flex; align-items: center; font-weight: 600; color: #ddd; transition: 0.2s; }
        .folder:hover { background: rgba(255,255,255,0.05); }
        .folder::before { content: '📁'; margin-right: 8px; font-size: 1.1em; }
        .folder.open::before { content: '📂'; }
        
        .file { cursor: pointer; padding: 6px 10px; border-radius: 4px; display: flex; align-items: center; transition: 0.2s; color: var(--text); text-decoration: none; }
        .file:hover { background: rgba(52, 152, 219, 0.1); color: var(--primary); }
        .file::before { content: '📄'; margin-right: 8px; opacity: 0.6; }
        .file.active { background: var(--primary); color: white; font-weight: bold; }
        .file.active::before { filter: brightness(0) invert(1); }

        .collapsed { display: none; }

        /* Zone Contenu */
        main { flex: 1; overflow-y: auto; background: var(--bg); padding: 50px; scroll-behavior: smooth; }
        #doc-content { max-width: 850px; margin: 0 auto; line-height: 1.7; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Markdown Style */
        #doc-content h1 { color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 15px; font-size: 2.2em; }
        #doc-content h2 { color: var(--primary); margin-top: 1.5em; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        #doc-content table { width: 100%; border-collapse: collapse; margin: 20px 0; border-radius: 8px; overflow: hidden; }
        #doc-content th, #doc-content td { border: 1px solid var(--border); padding: 12px; text-align: left; }
        #doc-content th { background: #1a1a20; color: white; }
        #doc-content code { background: #1e1e24; color: #f1c40f; padding: 3px 6px; border-radius: 4px; font-family: monospace; }
        #doc-content blockquote { border-left: 4px solid var(--primary); background: rgba(52, 152, 219, 0.05); padding: 10px 20px; margin: 20px 0; }

        .loader { text-align: center; color: var(--primary); margin-top: 20px; font-size: 0.8em; letter-spacing: 1px; }
    </style>
</head>
<body>

<nav>
    <div class="nav-header">
        <h1>⚖️ LifeStealFR Docs</h1>
    </div>
    <div id="tree-container">
        <div class="loader">CHARGEMENT DE L'ARBORESCENCE...</div>
    </div>
</nav>

<main>
    <div id="doc-content">
        <h1>Bienvenue</h1>
        <p>Utilisez le menu à gauche pour naviguer dans l'arborescence des dossiers légaux.</p>
    </div>
</main>

<script>
    const CONFIG = {
        owner: "LifeStealFR",
        repo: "lifestealfr.github.io",
        basePath: "legal", // Dossier racine à scanner
        branch: "main"    // Ta branche principale
    };

    const treeContainer = document.getElementById('tree-container');
    const docContent = document.getElementById('doc-content');

    // 1. Fetch de toute l'arborescence récursivement
    async function fetchFullTree() {
        try {
            // On utilise l'API Git Trees avec recursive=1
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`);
            const data = await res.json();
            
            // On ne garde que les fichiers .md dans le dossier /legal/
            const legalFiles = data.tree.filter(item => 
                item.path.startsWith(CONFIG.basePath) && 
                item.path.endsWith('.md')
            );

            renderTree(legalFiles);
        } catch (err) {
            treeContainer.innerHTML = `<p style="color:red">Erreur API : ${err.message}</p>`;
        }
    }

    // 2. Construction de l'arbre HTML
    function renderTree(files) {
        const tree = {};

        // Transformer la liste plate en objet imbriqué
        files.forEach(file => {
            const parts = file.path.split('/');
            let current = tree;
            parts.forEach((part, index) => {
                if (index === parts.length - 1) {
                    current[part] = file;
                } else {
                    current[part] = current[part] || {};
                    current = current[part];
                }
            });
        });

        treeContainer.innerHTML = ''; // Nettoyer le loader
        const rootUl = document.createElement('ul');
        buildHtmlTree(tree[CONFIG.basePath], rootUl);
        treeContainer.appendChild(rootUl);

        // Auto-chargement via Hash
        const currentHash = window.location.hash.substring(1);
        if (currentHash) {
            const fileUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${currentHash}`;
            loadMarkdown(fileUrl, currentHash);
        }
    }

    // 3. Fonction récursive pour créer les dossiers/fichiers
    function buildHtmlTree(node, container, fullPath = CONFIG.basePath) {
        Object.keys(node).sort().forEach(key => {
            const currentPath = `${fullPath}/${key}`;
            const li = document.createElement('li');

            if (node[key].sha) { 
                // C'est un fichier
                const a = document.createElement('a');
                a.className = 'file';
                a.id = `file-${currentPath}`;
                a.innerText = key.replace('.md', '').replace(/[-_]/g, ' ');
                a.onclick = () => {
                    const rawUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${currentPath}`;
                    loadMarkdown(rawUrl, currentPath);
                };
                li.appendChild(a);
            } else {
                // C'est un dossier
                const div = document.createElement('div');
                div.className = 'folder';
                div.innerText = key.charAt(0).toUpperCase() + key.slice(1);
                
                const ul = document.createElement('ul');
                ul.className = 'collapsed';
                
                div.onclick = () => {
                    div.classList.toggle('open');
                    ul.classList.toggle('collapsed');
                };

                li.appendChild(div);
                li.appendChild(ul);
                buildHtmlTree(node[key], ul, currentPath);
            }
            container.appendChild(li);
        });
    }

    // 4. Charger et afficher le contenu
    async function loadMarkdown(url, path) {
        docContent.style.opacity = '0.5';
        
        // Update URL Hash
        window.location.hash = path;

        // Update Active Class
        document.querySelectorAll('.file').forEach(f => f.classList.remove('active'));
        const activeFile = document.getElementById(`file-${path}`);
        if(activeFile) {
            activeFile.classList.add('active');
            // Ouvrir les dossiers parents si fermés
            let parent = activeFile.parentElement.parentElement;
            while(parent && parent.id !== 'tree-container') {
                parent.classList.remove('collapsed');
                if(parent.previousElementSibling) parent.previousElementSibling.classList.add('open');
                parent = parent.parentElement.parentElement;
            }
        }

        try {
            const res = await fetch(url);
            const md = await res.text();
            docContent.innerHTML = marked.parse(md);
            docContent.style.opacity = '1';
            document.querySelector('main').scrollTop = 0;
        } catch (err) {
            docContent.innerHTML = `<h1>Erreur</h1><p>Impossible de charger : ${path}</p>`;
        }
    }

    fetchFullTree();
</script>

</body>
</html>

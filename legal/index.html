<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStealFR - Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0d0d10; --panel: #15151a; --primary: #3498db; --text: #a0a0a8; --text-light: #ffffff; --border: #222228; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        nav { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .nav-header { padding: 25px; border-bottom: 1px solid var(--border); text-align: center; }
        .nav-header h1 { font-size: 1em; color: white; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        
        #tree-container { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.9em; }
        ul { list-style: none; padding-left: 15px; margin: 5px 0; }
        
        .folder { cursor: pointer; padding: 8px 10px; border-radius: 4px; display: flex; align-items: center; font-weight: 600; color: #ddd; transition: 0.2s; }
        .folder:hover { background: rgba(255,255,255,0.05); }
        .folder::before { content: '📁'; margin-right: 8px; }
        .folder.open::before { content: '📂'; }
        
        .file { cursor: pointer; padding: 6px 10px; border-radius: 4px; display: flex; align-items: center; transition: 0.2s; color: var(--text); display: block; width: 100%; box-sizing: border-box; }
        .file:hover { background: rgba(52, 152, 219, 0.1); color: var(--primary); }
        .file::before { content: '📄'; margin-right: 8px; opacity: 0.6; }
        .file.active { background: var(--primary) !important; color: white !important; font-weight: bold; }

        .collapsed { display: none; }

        main { flex: 1; overflow-y: auto; background: var(--bg); padding: 50px; scroll-behavior: smooth; }
        #doc-content { max-width: 850px; margin: 0 auto; line-height: 1.7; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Style Markdown */
        #doc-content h1 { color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        #doc-content h2 { color: var(--primary); margin-top: 1.5em; }
        #doc-content table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        #doc-content th, #doc-content td { border: 1px solid var(--border); padding: 12px; text-align: left; }
        #doc-content th { background: #1a1a20; }
        #doc-content img { max-width: 100%; border-radius: 8px; }

        .loader { text-align: center; color: var(--primary); margin-top: 20px; font-size: 0.8em; }
    </style>
</head>
<body>

<nav>
    <div class="nav-header">
        <h1>⚖️ LifeStealFR Docs</h1>
    </div>
    <div id="tree-container"><div class="loader">CHARGEMENT...</div></div>
</nav>

<main>
    <div id="doc-content">
        <h1>Bienvenue</h1>
        <p>Sélectionnez un document à gauche pour l'afficher.</p>
    </div>
</main>

<script>
    const CONFIG = {
        owner: "LifeStealFR",
        repo: "lifestealfr.github.io",
        branch: "main",
        rootPath: "legal" // Le dossier parent
    };

    const treeContainer = document.getElementById('tree-container');
    const docContent = document.getElementById('doc-content');

    // 1. Récupérer l'arborescence complète
    async function fetchTree() {
        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`);
            const data = await res.json();
            
            // On filtre pour ne garder que les .md dans le dossier spécifié
            const files = data.tree.filter(item => 
                item.path.startsWith(CONFIG.rootPath) && item.path.endsWith('.md')
            );

            buildMenu(files);
        } catch (err) {
            treeContainer.innerHTML = `<p style="color:red">Erreur : ${err.message}</p>`;
        }
    }

    // 2. Transformer la liste de fichiers en menu HTML
    function buildMenu(files) {
        const tree = {};

        files.forEach(file => {
            const parts = file.path.split('/');
            let current = tree;
            parts.forEach((part, i) => {
                if (i === parts.length - 1) {
                    current[part] = file;
                } else {
                    current[part] = current[part] || {};
                    current = current[part];
                }
            });
        });

        treeContainer.innerHTML = '';
        const rootUl = document.createElement('ul');
        // On démarre la récursion à partir du dossier racine défini dans CONFIG
        generateHTML(tree[CONFIG.rootPath], rootUl, CONFIG.rootPath);
        treeContainer.appendChild(rootUl);

        // Si l'URL a déjà un #chemin/vers/fichier.md, on le charge
        if (window.location.hash) {
            const path = window.location.hash.substring(1);
            loadMD(path);
        }
    }

    // 3. Générer le HTML du menu (Récursif)
    function generateHTML(node, container, currentPath) {
        Object.keys(node).sort().forEach(key => {
            const path = `${currentPath}/${key}`;
            const li = document.createElement('li');

            if (node[key].sha) { // C'est un fichier
                const a = document.createElement('div'); // Utilisation de div pour éviter les sauts de page
                a.className = 'file';
                a.dataset.path = path;
                a.innerText = key.replace('.md', '').replace(/[-_]/g, ' ');
                a.onclick = () => loadMD(path);
                li.appendChild(a);
            } else { // C'est un dossier
                const div = document.createElement('div');
                div.className = 'folder';
                div.innerText = key;
                const ul = document.createElement('ul');
                ul.className = 'collapsed';
                div.onclick = () => {
                    div.classList.toggle('open');
                    ul.classList.toggle('collapsed');
                };
                li.appendChild(div);
                li.appendChild(ul);
                generateHTML(node[key], ul, path);
            }
            container.appendChild(li);
        });
    }

    // 4. Charger le Markdown et l'afficher
    async function loadMD(path) {
        console.log("Tentative de chargement du fichier :", path);
        docContent.innerHTML = "<div class='loader'>CHARGEMENT DU DOCUMENT...</div>";
        
        // Mise à jour visuelle du menu
        document.querySelectorAll('.file').forEach(f => f.classList.remove('active'));
        const activeEl = document.querySelector(`[data-path="${path}"]`);
        if (activeEl) activeEl.classList.add('active');

        // Mise à jour du hash dans l'URL
        window.location.hash = path;

        // URL brute GitHub
        const rawUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`;

        try {
            const res = await fetch(rawUrl);
            if (!res.ok) throw new Error("Fichier introuvable sur GitHub");
            const md = await res.text();
            
            // Rendu du Markdown
            docContent.innerHTML = marked.parse(md);
            document.querySelector('main').scrollTop = 0;
            console.log("Chargement réussi !");
        } catch (err) {
            console.error(err);
            docContent.innerHTML = `<h1>Erreur</h1><p>Impossible de charger le document : <br><code>${path}</code></p>`;
        }
    }

    fetchTree();
</script>

</body>
</html>

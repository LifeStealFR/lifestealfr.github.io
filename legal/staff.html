<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSteal - Staff</title>
    
    <!-- Police Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Marked.js pour le parsing du Markdown standard -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-title: #ffffff;
            --mc-color: #ffaa00;
            --hover-glow: #58a6ff;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        #container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Styles Markdown Standards */
        h1 { color: var(--text-title); text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 40px; }
        a { color: var(--hover-glow); text-decoration: none; }
        a:hover { text-decoration: underline; }
        blockquote { border-left: 4px solid var(--border-color); padding-left: 15px; color: #8b949e; }
        hr { border: 0; border-top: 1px solid var(--border-color); margin: 30px 0; }

        /* Sections et Grilles */
        .group-section {
            margin-top: 50px;
        }

        .group-section h2 {
            color: var(--text-title);
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Cartes de profil */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            border-color: var(--hover-glow);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.15);
            transform: translateY(-2px);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--text-title);
            font-size: 1.3em;
        }

        /* Données extraites de la carte */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .info-label {
            font-weight: 600;
            color: #8b949e;
        }

        .val-discord {
            background: #23863622;
            color: #3fb950;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        .val-minecraft {
            color: var(--mc-color);
            font-weight: 700;
            text-shadow: 0 0 5px rgba(255, 170, 0, 0.2);
        }

        .val-role {
            color: #d2a8ff;
            font-style: italic;
        }

        /* Loader */
        #loader { text-align: center; color: #8b949e; font-size: 1.2em; }
    </style>
</head>
<body>

    <div id="container">
        <div id="loader">Chargement des données...</div>
        <div id="content"></div>
    </div>

    <script>
        const MD_URL = "https://raw.githubusercontent.com/LifeStealFR/lifestealfr.github.io/refs/heads/main/legal/staff.md";

        async function fetchAndParseMarkdown() {
            try {
                const response = await fetch(MD_URL);
                if (!response.ok) throw new Error("Erreur lors de la récupération du fichier.");
                const markdown = await response.text();
                
                renderCustomMarkdown(markdown);
            } catch (error) {
                document.getElementById('loader').innerText = "Erreur : Impossible de charger le contenu.";
                console.error(error);
            }
        }

        function renderCustomMarkdown(markdown) {
            const lines = markdown.split('\n');
            let htmlOutput = '';
            
            // Buffer pour stocker le Markdown standard avant de le passer à marked.js
            let mdBuffer = [];
            
            // Gestion des états
            let inGroup = false;
            let inCard = false;

            // Fonction pour compiler et vider le buffer de texte standard
            const flushBuffer = () => {
                if (mdBuffer.length > 0) {
                    htmlOutput += marked.parse(mdBuffer.join('\n'));
                    mdBuffer = [];
                }
            };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmedLine = line.trim();
                const lowerLine = trimmedLine.toLowerCase();

                // 1. Détection d'un nouveau Groupe (##)
                if (line.startsWith('## ')) {
                    flushBuffer();
                    if (inCard) { htmlOutput += `</div>`; inCard = false; }
                    if (inGroup) { htmlOutput += `</div></div>`; } // Ferme la grille et le groupe précédent
                    
                    inGroup = true;
                    htmlOutput += `
                        <div class="group-section">
                            <h2>${line.substring(3).trim()}</h2>
                            <div class="cards-grid">
                    `;
                }
                
                // 2. Détection d'un nouveau Profil/Carte (###)
                else if (line.startsWith('### ')) {
                    flushBuffer();
                    if (inCard) { htmlOutput += `</div>`; } // Ferme la carte précédente
                    
                    inCard = true;
                    htmlOutput += `
                        <div class="card">
                            <h3>${line.substring(4).trim()}</h3>
                    `;
                }
                
                // 3. Extraction des données spécifiques dans une Carte (* ou -)
                else if (inCard && (trimmedLine.startsWith('*') || trimmedLine.startsWith('-'))) {
                    
                    if (lowerLine.includes('discord')) {
                        flushBuffer();
                        const match = trimmedLine.match(/`([^`]+)`/); // Extraction entre backticks
                        if (match) {
                            htmlOutput += `<div class="info-row"><span class="info-label">Discord</span> <span class="val-discord">${match[1]}</span></div>`;
                        }
                    } 
                    else if (lowerLine.includes('minecraft')) {
                        flushBuffer();
                        const match = trimmedLine.match(/`([^`]+)`/); // Extraction entre backticks
                        if (match) {
                            htmlOutput += `<div class="info-row"><span class="info-label">Minecraft</span> <span class="val-minecraft">${match[1]}</span></div>`;
                        }
                    } 
                    else if (lowerLine.includes('rôle') || lowerLine.includes('role')) {
                        flushBuffer();
                        // Extraction après "Rôle :"
                        const splitStr = trimmedLine.match(/r[oô]le\s*:/i);
                        if (splitStr) {
                            let roleText = trimmedLine.substring(splitStr.index + splitStr[0].length);
                            
                            // Nettoyage: Suppression des ** et des émojis
                            roleText = roleText.replace(/\*\*/g, '') 
                                               .replace(/[\u{1F300}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{1F1E6}-\u{1F1FF}]/gu, '')
                                               .trim();

                            htmlOutput += `<div class="info-row"><span class="info-label">Rôle</span> <span class="val-role">${roleText}</span></div>`;
                        }
                    }
                    else {
                        // Si c'est une liste à puce classique dans la carte, on l'ajoute au buffer
                        mdBuffer.push(line);
                    }
                } 
                
                // 4. Texte Markdown standard (H1, descriptions, citations, etc.)
                else {
                    mdBuffer.push(line);
                }
            }

            // Vidage final du buffer et fermeture des balises ouvertes
            flushBuffer();
            if (inCard) { htmlOutput += `</div>`; }
            if (inGroup) { htmlOutput += `</div></div>`; }

            // Injection dans le DOM
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').innerHTML = htmlOutput;
        }

        // Lancement du script au chargement
        window.addEventListener('DOMContentLoaded', fetchAndParseMarkdown);

    </script>
</body>
</html>

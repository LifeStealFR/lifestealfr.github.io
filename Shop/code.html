<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Code Custom</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
        }

        h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; text-align: center; }
        .desc { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }

        input[type="number"], select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }

        .checkbox-group {
            grid-column: span 2;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
        }

        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }

        /* Zone d'affichage */
        .result-container {
            position: relative;
            background: #000;
            padding: 1.2rem;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid var(--primary);
            min-height: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #code-output {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 1.2rem;
            color: #fbbf24;
            word-break: break-all;
            text-align: center;
        }

        /* Boutons */
        .btn-stack { display: flex; gap: 10px; }
        
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gen-btn { background: var(--primary); color: white; }
        .gen-btn:hover { background: var(--primary-hover); }

        .copy-btn { background: #334155; color: white; }
        .copy-btn:hover { background: #475569; }
        .copy-btn.success { background: #10b981; }

    </style>
</head>
<body>

<div class="card">
    <h1>Générateur de Code Pro</h1>
    <p class="desc">Configurez votre pattern Tebex ou clé personnalisée</p>

    <div class="settings-grid">
        <div class="control-group">
            <label>Nombre de segments</label>
            <input type="number" id="parts" value="4" min="1" max="10">
        </div>

        <div class="control-group">
            <label>Longueur segment</label>
            <input type="number" id="segLength" value="4" min="1" max="12">
        </div>

        <div class="checkbox-group">
            <div class="checkbox-item">
                <input type="checkbox" id="useUpper" checked> <label for="useUpper">ABC</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="useNumbers" checked> <label for="useNumbers">123</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="useSpecial"> <label for="useSpecial">!@#</label>
            </div>
        </div>
    </div>

    <div class="result-container">
        <div id="code-output">CLIQUEZ SUR GÉNÉRER</div>
    </div>

    <div class="btn-stack">
        <button class="gen-btn" onclick="generateCode()">GÉNÉRER</button>
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">COPIER</button>
    </div>
</div>

<script>
    function generateCode() {
        const parts = document.getElementById('parts').value;
        const segLength = document.getElementById('segLength').value;
        
        // Construction du dictionnaire de caractères
        let charset = "";
        if(document.getElementById('useUpper').checked) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        if(document.getElementById('useNumbers').checked) charset += "0123456789";
        if(document.getElementById('useSpecial').checked) charset += "!#$%&*+-=?@";

        if(charset === "") {
            alert("Sélectionnez au moins un type de caractère !");
            return;
        }

        let fullCode = [];

        for (let i = 0; i < parts; i++) {
            let segment = "";
            for (let j = 0; j < segLength; j++) {
                segment += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            fullCode.push(segment);
        }

        const result = fullCode.join('-');
        document.getElementById('code-output').innerText = result;
        
        // Reset du bouton copier
        const btn = document.getElementById('copyBtn');
        btn.innerText = "COPIER";
        btn.classList.remove('success');
    }

    function copyToClipboard() {
        const text = document.getElementById('code-output').innerText;
        if(text === "CLIQUEZ SUR GÉNÉRER") return;

        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIÉ !";
            btn.classList.add('success');
            
            setTimeout(() => {
                btn.innerText = "COPIER";
                btn.classList.remove('success');
            }, 2000);
        });
    }
</script>

</body>
</html>
